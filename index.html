                          </div>
                        </div>
                        <input type="number" min="0" max={totalQuestions} name={vis.name} value={config[vis.name]} onChange={handleInputChange} className="w-16 p-2 text-center font-bold text-sm bg-white border border-slate-200 rounded-xl" />
                      </div>
                    );
                  })}
                </div>
              </section>

              {/* Action Buttons */}
              <div className="space-y-3">
                <button type="button" onClick={handleGenerateQuiz} className="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                  <Sparkles size={18} />
                  <span>Buat Soal MI Sekarang</span>
                </button>
                <button type="button" onClick={() => jsonImportInputRef.current?.click()} className="w-full py-3.5 rounded-2xl bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer">
                  <Upload size={18} className="text-emerald-600" />
                  <span>Import / Upload Soal dari File JSON (.json)</span>
                </button>
                {finalQuiz && finalQuiz._minimizedToHome && (
                  <button type="button" onClick={() => { const c = { ...finalQuiz }; delete c._minimizedToHome; setFinalQuiz(c); }} className="w-full py-3.5 rounded-2xl bg-white text-emerald-700 border-2 border-emerald-200 font-extrabold text-sm flex items-center justify-center gap-2">
                    <FileText size={18} />
                    <span>Lihat Hasil Soal Terakhir</span>
                  </button>
                )}
              </div>
            </main>
          ) : (
            /* =====================================================================
               VIEW 3: RESULT SCREEN (5 TAB LENGKAP)
               ===================================================================== */
            <main className="max-w-4xl mx-auto px-4 py-8 space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-2 print:hidden">
                <button type="button" onClick={() => { setActiveTab('naskah'); setFinalQuiz((prev) => ({ ...prev, _minimizedToHome: true })); }} className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-xs font-bold shadow-sm">
                  <ArrowLeft size={14} />
                  <span>Kembali ke Pengaturan</span>
                </button>

                <div className="flex flex-wrap items-center gap-2">
                  <button type="button" onClick={() => setShowWordExportModal(true)} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold shadow-sm">
                    <FileText size={14} />
                    <span>Download Word (.doc)</span>
                  </button>
                  <button type="button" onClick={() => window.print()} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-red-600 text-white text-xs font-bold shadow-sm">
                    <Printer size={14} />
                    <span>Cetak / PDF</span>
                  </button>
                  <button type="button" onClick={() => jsonImportInputRef.current?.click()} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white border text-xs font-bold shadow-sm">
                    <Upload size={14} className="text-emerald-600" />
                    <span>Import JSON</span>
                  </button>
                  <button type="button" onClick={handleExportQuizJson} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white border text-xs font-bold shadow-sm">
                    <Download size={14} className="text-emerald-600" />
                    <span>Export JSON</span>
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-8 space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-slate-100">
                  <div>
                    <div className="text-[11px] font-extrabold text-emerald-700 uppercase tracking-wider">KKMI Kecamatan Wonomerto</div>
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Naskah Ujian MI &mdash; {config.subject}</h1>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Madrasah Ibtidaiyah (MI) &bull; {config.grade} &bull; Kurikulum {config.curriculum}
                      {config.assessmentType ? ` • ${config.assessmentType}` : ''}
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 print:hidden">
                    <button type="button" onClick={handleGenerateAllImages} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-sm">
                      <Wand2 size={14} />
                      <span>Generate Semua Gambar</span>
                    </button>
                    <button type="button" onClick={handleGenerateGoogleFormScript} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold shadow-sm">
                      <FileCode size={14} />
                      <span>Google Form</span>
                    </button>
                  </div>
                </div>

                {/* Navigation Tabs */}
                <div className="flex flex-wrap items-center gap-6 border-b border-slate-100 text-xs sm:text-sm font-bold print:hidden">
                  {[
                    { id: 'naskah', label: 'Naskah Soal', icon: FileText },
                    { id: 'kunci', label: 'Kunci & Pembahasan', icon: CheckCircle2 },
                    { id: 'kisikisi', label: 'Kisi-Kisi & Analisis', icon: Award },
                    { id: 'analisisbutir', label: 'Analisis Butir Soal', icon: BarChart3 },
                    { id: 'kartusoal', label: 'Kartu Soal', icon: CreditCard }
                  ].map((t) => {
                    const IconC = t.icon;
                    const active = activeTab === t.id;
                    return (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => setActiveTab(t.id)}
                        className={`pb-3 inline-flex items-center gap-2 border-b-2 transition-all ${
                          active ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-400 hover:text-slate-600'
                        }`}
                      >
                        <IconC size={16} />
                        <span>{t.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* TAB 1: NASKAH SOAL */}
                {activeTab === 'naskah' && (
                  <div className="space-y-6">
                    <div className="flex flex-wrap items-center justify-end gap-2 print:hidden">
                      <div className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-600">
                        <span>PG:</span>
                        <select value={config.optionLayout} onChange={(e) => setConfig({ ...config, optionLayout: e.target.value })} className="bg-transparent font-bold text-slate-800 outline-none">
                          <option value="vertical">Ke Bawah</option>
                          <option value="horizontal">Menyamping</option>
                        </select>
                      </div>
                      <button type="button" onClick={handleShuffleMultipleChoiceOptions} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
                        <Shuffle size={14} />
                        <span>Acak Jawaban PG</span>
                      </button>
                      <button type="button" onClick={() => copyRichHtmlToClipboard(buildExamPaperHtmlForExport(), 'Naskah soal berhasil disalin!')} className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">
                        <Copy size={14} />
                        <span>Salin Naskah (Word)</span>
                      </button>
                    </div>

                    <div className="space-y-8">
                      {finalQuiz.questions.map((q, idx) => {
                        const cleanQ = formatMathHtml(cleanPgkNumbering(q.question || '', false));
                        const useArUi = isArabicActive();
                        const hasVisual = q.visualType && q.visualType !== 'none' && q.visualDescription && q.visualDescription !== '-';
                        return (
                          <React.Fragment key={idx}>
                            {q.stimulusGroupId && q.isStimulusGroupLeader && q.sharedStimulusText && (
                              <div className="p-5 rounded-3xl bg-emerald-50/70 border-2 border-emerald-200 space-y-2">
                                <span className="px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold">
                                  STIMULUS SOAL NOMOR {q.stimulusGroupStart} – {q.stimulusGroupEnd}
                                </span>
                                <div className="text-sm text-slate-800 leading-relaxed">{q.sharedStimulusText}</div>
                              </div>
                            )}

                            <div className="flex gap-4">
                              <span className="font-bold text-lg w-7 shrink-0 text-slate-800">{idx + 1}.</span>
                              <div className="w-full space-y-2.5">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="text-[11px] font-bold text-slate-400 uppercase">{q.bentukSoal || 'PG'}</span>
                                  <button type="button" onClick={() => handleRegenerateSingleQuestion(idx, q)} className="print:hidden inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border bg-white text-xs font-bold text-slate-600 hover:text-emerald-700">
                                    <Wand2 size={12} />
                                    <span>Generate Ulang Soal</span>
                                  </button>
                                </div>

                                {hasVisual && (
                                  <div className="p-3.5 rounded-2xl bg-emerald-50/60 border border-emerald-200 space-y-2">
                                    <div className="flex items-center justify-between">
                                      <span className="text-xs font-bold text-emerald-800">{q.visualDescription}</span>
                                      <button type="button" onClick={() => handleGenerateImage(idx, q.visualDescription)} className="px-3 py-1 rounded-xl bg-emerald-600 text-white text-xs font-bold">
                                        {generatedImages[idx] ? 'Buat Ulang Gambar' : 'Tampilkan Gambar'}
                                      </button>
                                    </div>
                                    {generatedImages[idx] && <img src={generatedImages[idx]} alt="Visual" className="max-h-64 rounded-xl border bg-white p-2 mx-auto" />}
                                  </div>
                                )}

                                <div className="print:hidden">
                                  <button type="button" onClick={() => handleGenerateStimulusForQuestion(idx, q)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
                                    <BookOpen size={12} />
                                    <span>+ Stimulus</span>
                                  </button>
                                </div>

                                {(openStimulusEditors[idx] || stimulusByQuestion[idx]) && (
                                  <textarea rows={2} value={stimulusByQuestion[idx] || ''} onChange={(e) => setStimulusByQuestion((prev) => ({ ...prev, [idx]: e.target.value }))} className="w-full p-2.5 rounded-xl bg-slate-50 border text-xs" />
                                )}

                                <div dir={useArUi ? 'rtl' : 'ltr'} className="text-slate-800 text-sm sm:text-base leading-relaxed whitespace-pre-line" dangerouslySetInnerHTML={{ __html: cleanQ }} />

                                {q.bentukSoal === 'Menjodohkan' && Array.isArray(q.matchingPremises) ? (
                                  <div className="mt-3 p-4 rounded-2xl bg-slate-50 border grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                      <div className="text-[11px] font-extrabold text-slate-400 uppercase mb-2">Pernyataan</div>
                                      {q.matchingPremises.map((prem, pIdx) => (
                                        <div key={pIdx} className="flex gap-2 text-sm"><b>{pIdx + 1}.</b><span>{prem}</span></div>
                                      ))}
                                    </div>
                                    <div>
                                      <div className="text-[11px] font-extrabold text-slate-400 uppercase mb-2">Pilihan Jawaban</div>
                                      {(q.options || []).map((opt, oIdx) => (
                                        <div key={oIdx} className="flex gap-2 text-sm"><b>{getOptionLabel(oIdx, useArUi)}.</b><span>{opt}</span></div>
                                      ))}
                                    </div>
                                  </div>
                                ) : Array.isArray(q.options) && q.options.length > 0 ? (
                                  <div dir={useArUi ? 'rtl' : 'ltr'} className={config.optionLayout === 'horizontal' ? 'flex flex-wrap gap-x-8 gap-y-2 pt-1' : 'space-y-2 pt-1'}>
                                    {q.options.map((opt, oIdx) => (
                                      <div key={oIdx} className="flex items-center gap-3 text-sm sm:text-base text-slate-700">
                                        <span className="font-bold w-5 shrink-0">{getOptionLabel(oIdx, useArUi)}.</span>
                                        <span dangerouslySetInnerHTML={{ __html: formatMathHtml(opt) }} />
                                      </div>
                                    ))}
                                  </div>
                                ) : null}
                              </div>
                            </div>
                          </React.Fragment>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* TAB 2: KUNCI & PEMBAHASAN */}
                {activeTab === 'kunci' && (() => {
                  const scoringInfo = calculateQuizScoringDetails(finalQuiz.questions);
                  return (
                    <div className="space-y-5">
                      <div className="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-200 space-y-3">
                        <div className="text-xs font-extrabold text-emerald-900 uppercase">📊 Pedoman Penskoran &amp; Distribusi Bobot Nilai (Skala 100)</div>
                        <table className="w-full text-left border-collapse text-xs bg-white border">
                          <thead>
                            <tr className="bg-emerald-100 font-bold">
                              <th className="p-2 text-center">Bentuk Soal</th>
                              <th className="p-2 text-center">Jumlah</th>
                              <th className="p-2 text-center">Bobot / Butir</th>
                              <th className="p-2 text-center">Total Skor (Skala 100)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y">
                            {scoringInfo.summaryByType.map((s, i) => (
                              <tr key={i}>
                                <td className="p-2 text-center font-bold">{s.bentukSoal}</td>
                                <td className="p-2 text-center">{s.count}</td>
                                <td className="p-2 text-center">{s.rawWeightPerItem}</td>
                                <td className="p-2 text-center font-extrabold text-emerald-700">{s.totalScaledScore} Poin</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      {finalQuiz.questions.map((q, idx) => {
                        const itemScore = scoringInfo.items[idx] || { rawWeight: 1, scaledScore: 1 };
                        return (
                          <div key={idx} className="p-4 rounded-2xl bg-slate-50 border space-y-1.5">
                            <div className="flex justify-between text-xs font-extrabold">
                              <span>SOAL NO. {idx + 1} [{String(q.bentukSoal || 'PG').toUpperCase()}]</span>
                              <span className="text-emerald-700">Bobot: {itemScore.rawWeight} | Skor Maks: {itemScore.scaledScore} Poin</span>
                            </div>
                            <div className="text-sm font-bold text-emerald-700">Kunci Jawaban: <span dangerouslySetInnerHTML={{ __html: formatMathHtml(q.answer || '-') }} /></div>
                            <div className="text-xs text-slate-700"><b>Pembahasan:</b> <span dangerouslySetInnerHTML={{ __html: formatMathHtml(q.explanation || '-') }} /></div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}

                {/* TAB 3: KISI-KISI */}
                {activeTab === 'kisikisi' && (
                  <div className="overflow-x-auto rounded-2xl border">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-100 font-bold border-b">
                          <th className="p-3 text-center">No</th>
                          <th className="p-3">Capaian Pembelajaran (CP)</th>
                          <th className="p-3">Tujuan Pembelajaran (TP)</th>
                          <th className="p-3">Materi Pokok</th>
                          <th className="p-3">Indikator Soal</th>
                          <th className="p-3 text-center">Level</th>
                          <th className="p-3 text-center">Bentuk</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {finalQuiz.questions.map((q, idx) => (
                          <tr key={idx}>
                            <td className="p-3 text-center font-bold">{idx + 1}</td>
                            <td className="p-3">{q.cp || '-'}</td>
                            <td className="p-3">{q.tp || '-'}</td>
                            <td className="p-3">{q.materi || config.topic}</td>
                            <td className="p-3">{q.indicator || '-'}</td>
                            <td className="p-3 text-center font-bold text-emerald-700">{q.bloomLevel || 'C3'}</td>
                            <td className="p-3 text-center font-semibold">{q.bentukSoal || 'PG'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* TAB 4: ANALISIS BUTIR SOAL */}
                {activeTab === 'analisisbutir' && (() => {
                  const metrics = finalQuiz.questions.map((q, idx) => analyzeQuestionItemMetrics(q, idx));
                  return (
                    <div className="overflow-x-auto rounded-2xl border">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 font-bold border-b">
                            <th className="p-3 text-center">No</th>
                            <th className="p-3">Bentuk Soal</th>
                            <th className="p-3">Level</th>
                            <th className="p-3 text-center">Tingkat Kesukaran</th>
                            <th className="p-3 text-center">Indeks P</th>
                            <th className="p-3 text-center">Daya Pembeda (D)</th>
                            <th className="p-3 text-center">Status Validitas</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {metrics.map((m) => (
                            <tr key={m.no}>
                              <td className="p-3 text-center font-bold">{m.no}</td>
                              <td className="p-3">{m.bentuk}</td>
                              <td className="p-3 font-bold text-emerald-700">{m.level}</td>
                              <td className="p-3 text-center font-bold">{m.category}</td>
                              <td className="p-3 text-center font-mono">{m.pIndex.toFixed(2)}</td>
                              <td className="p-3 text-center font-mono">{m.dIndex.toFixed(2)}</td>
                              <td className="p-3 text-center font-bold text-emerald-700">{m.constructValidity}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  );
                })()}

                {/* TAB 5: KARTU SOAL */}
                {activeTab === 'kartusoal' && (
                  <div className="space-y-5">
                    {finalQuiz.questions.map((q, idx) => (
                      <div key={idx} className="rounded-2xl border overflow-hidden bg-white">
                        <div className="bg-slate-100 px-4 py-2.5 border-b flex justify-between text-xs font-extrabold">
                          <span>KARTU SOAL MI NOMOR {idx + 1} ({String(q.bentukSoal || 'PG').toUpperCase()})</span>
                          <span className="text-emerald-700">{q.bloomLevel || 'C3'}</span>
                        </div>
                        <div className="p-4 space-y-2 text-xs">
                          <div><b>Mata Pelajaran:</b> {config.subject} &bull; <b>Kelas:</b> {config.grade} (MI)</div>
                          <div><b>Indikator:</b> {q.indicator || '-'}</div>
                          <div className="p-3 rounded-xl bg-slate-50 border"><b>Butir Soal:</b> {q.question || ''}</div>
                          <div><b className="text-emerald-700">Kunci Jawaban:</b> {q.answer || '-'}</div>
                          <div><b>Pembahasan:</b> {q.explanation || '-'}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
