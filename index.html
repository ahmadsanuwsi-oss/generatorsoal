<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Soal KKMI Wonomerto - Madrasah Ibtidaiyah</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone untuk kompilasi JSX langsung di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons (UMD) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Adapter ikon Lucide agar kompatibel tanpa bundler
    const createLucideIcon = (iconName) => {
      return function LucideIcon({ size = 24, className = '', ...props }) {
        const spanRef = useRef(null);
        useEffect(() => {
          if (spanRef.current && window.lucide && window.lucide.icons[iconName]) {
            const svgEl = window.lucide.createElement(window.lucide.icons[iconName]);
            svgEl.setAttribute('width', size);
            svgEl.setAttribute('height', size);
            if (className) svgEl.setAttribute('class', className);
            spanRef.current.innerHTML = '';
            spanRef.current.appendChild(svgEl);
          }
        }, [size, className]);
        return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
      };
    };

    const BookOpen = createLucideIcon('BookOpen');
    const FileText = createLucideIcon('FileText');
    const Sparkles = createLucideIcon('Sparkles');
    const CheckCircle2 = createLucideIcon('CheckCircle2');
    const Download = createLucideIcon('Download');
    const Copy = createLucideIcon('Copy');
    const ArrowLeft = createLucideIcon('ArrowLeft');
    const Layers = createLucideIcon('Layers');
    const AlertCircle = createLucideIcon('AlertCircle');
    const Upload = createLucideIcon('Upload');
    const Lock = createLucideIcon('Lock');
    const User = createLucideIcon('User');
    const Users = createLucideIcon('Users');
    const LogOut = createLucideIcon('LogOut');
    const ShieldCheck = createLucideIcon('ShieldCheck');
    const Eye = createLucideIcon('Eye');
    const EyeOff = createLucideIcon('EyeOff');
    const X = createLucideIcon('X');

    // ============================================================================
    // KONFIGURASI JENJANG KHUSUS MADRASAH IBTIDAIYAH (MI) - KKMI WONOMERTO
    // ============================================================================
    const GRADES_BY_LEVEL = {
      'MI': ['Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6']
    };

    const SUBJECTS_BY_LEVEL = {
      'MI': [
        "Al-Qur'an Hadis",
        'Akidah Akhlak',
        'Fikih',
        'Sejarah Kebudayaan Islam (SKI)',
        'Bahasa Arab',
        'Pendidikan Pancasila',
        'Bahasa Indonesia',
        'Matematika',
        'IPA',
        'IPS',
        'IPAS (Ilmu Pengetahuan Alam dan Sosial)',
        'Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK)',
        'Seni dan Budaya',
        'Bahasa Inggris',
        'Bahasa Daerah / Muatan Lokal'
      ]
    };

    // ============================================================================
    // DATA DUMMY AKUN ADMIN & PENGGUNA
    // ============================================================================
    const STORAGE_KEY_ACCOUNTS = 'kkmi_wonomerto_dummy_accounts_v1';
    const STORAGE_KEY_SESSION = 'kkmi_wonomerto_active_session_v1';

    const INITIAL_DUMMY_ACCOUNTS = [
      {
        id: 'usr-admin-01',
        fullName: 'Administrator KKMI Wonomerto',
        madrasah: 'KKMI Kecamatan Wonomerto',
        username: 'admin',
        password: 'admin123',
        role: 'admin',
        createdAt: '2026-01-01'
      },
      {
        id: 'usr-guru-01',
        fullName: 'Ahmad Fauzi, S.Pd.I',
        madrasah: 'MI Miftahul Ulum Wonomerto',
        username: 'guru1',
        password: 'guru123',
        role: 'user',
        createdAt: '2026-01-02'
      },
      {
        id: 'usr-guru-02',
        fullName: 'Siti Aminah, S.Pd',
        madrasah: 'MI Nurul Huda Wonomerto',
        username: 'guru2',
        password: 'guru123',
        role: 'user',
        createdAt: '2026-01-03'
      }
    ];

    function App() {
      const [accounts, setAccounts] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_ACCOUNTS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_DUMMY_ACCOUNTS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedSession = localStorage.getItem(STORAGE_KEY_SESSION);
          if (savedSession) {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.username) return parsed;
          }
        } catch (e) {}
        return null;
      });

      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [showUserManagementModal, setShowUserManagementModal] = useState(false);
      const [editingAccountId, setEditingAccountId] = useState(null);
      const [accountForm, setAccountForm] = useState({
        fullName: '',
        madrasah: '',
        username: '',
        password: '',
        role: 'user'
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_ACCOUNTS, JSON.stringify(accounts));
        } catch (e) {}
      }, [accounts]);

      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentUser));
          } else {
            localStorage.removeItem(STORAGE_KEY_SESSION);
          }
        } catch (e) {}
      }, [currentUser]);

      const [config, setConfig] = useState({
        curriculum: 'Merdeka',
        teacherName: '',
        schoolName: '',
        level: 'MI',
        grade: '',
        subject: '',
        assessmentType: '',
        language: 'id',
        topic: '',
        pgCount: 10,
        pgKompleksCount: 0,
        menjodohkanCount: 0,
        benarSalahCount: 0,
        isianCount: 0,
        uraianCount: 0,
        optionCount: '4',
        optionLayout: 'vertical',
        matchingOptionCount: '5',
        matchingDistractorCount: '0'
      });

      const [loading, setLoading] = useState(false);
      const [generationSuccess, setGenerationSuccess] = useState(false);
      const [progress, setProgress] = useState(0);
      const [finalQuiz, setFinalQuiz] = useState(null);
      const [activeTab, setActiveTab] = useState('naskah');
      const [toast, setToast] = useState(null);

      const jsonImportInputRef = useRef(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const uname = String(loginUsername || '').trim().toLowerCase();
        const pwd = String(loginPassword || '').trim();

        if (!uname || !pwd) {
          setLoginError('Masukkan username dan password terlebih dahulu.');
          return;
        }

        const found = accounts.find(
          (acc) =>
            String(acc.username || '').trim().toLowerCase() === uname &&
            String(acc.password || '').trim() === pwd
        );

        if (!found) {
          setLoginError('Username atau password salah. Silakan periksa kembali.');
          return;
        }

        setLoginError('');
        setCurrentUser(found);
        setLoginUsername('');
        setLoginPassword('');

        setConfig((prev) => ({
          ...prev,
          level: 'MI',
          teacherName: prev.teacherName || (found.role === 'user' ? found.fullName : prev.teacherName),
          schoolName: prev.schoolName || (found.madrasah && found.madrasah !== 'KKMI Kecamatan Wonomerto' ? found.madrasah : prev.schoolName)
        }));

        showToast(`Selamat datang, ${found.fullName}!`, 'success');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setShowUserManagementModal(false);
        setFinalQuiz(null);
        showToast('Anda telah keluar dari sistem.', 'info');
      };

      const resetAccountForm = () => {
        setEditingAccountId(null);
        setAccountForm({
          fullName: '',
          madrasah: '',
          username: '',
          password: '',
          role: 'user'
        });
      };

      const handleSaveAccount = (e) => {
        e.preventDefault();
        const fullName = String(accountForm.fullName || '').trim();
        const madrasah = String(accountForm.madrasah || '').trim();
        const username = String(accountForm.username || '').trim().toLowerCase().replace(/\s+/g, '');
        const password = String(accountForm.password || '').trim();
        const role = accountForm.role === 'admin' ? 'admin' : 'user';

        if (!fullName || !username || !password) {
          showToast('Nama Lengkap, Username, dan Password wajib diisi.', 'error');
          return;
        }

        const isDuplicate = accounts.some(
          (acc) =>
            String(acc.username || '').trim().toLowerCase() === username &&
            acc.id !== editingAccountId
        );
        if (isDuplicate) {
          showToast(`Username "${username}" sudah digunakan akun lain.`, 'error');
          return;
        }

        if (editingAccountId) {
          setAccounts((prev) =>
            prev.map((acc) =>
              acc.id === editingAccountId
                ? { ...acc, fullName, madrasah, username, password, role }
                : acc
            )
          );
          if (currentUser && currentUser.id === editingAccountId) {
            setCurrentUser((prev) => ({ ...prev, fullName, madrasah, username, password, role }));
          }
          showToast(`Akun "${username}" berhasil diperbarui!`, 'success');
        } else {
          const newAcc = {
            id: `usr-${Date.now()}`,
            fullName,
            madrasah: madrasah || 'MI Kecamatan Wonomerto',
            username,
            password,
            role,
            createdAt: new Date().toISOString().slice(0, 10)
          };
          setAccounts((prev) => [...prev, newAcc]);
          showToast(`Akun baru "${username}" berhasil ditambahkan!`, 'success');
        }

        resetAccountForm();
      };

      const handleStartEditAccount = (acc) => {
        setEditingAccountId(acc.id);
        setAccountForm({
          fullName: acc.fullName || '',
          madrasah: acc.madrasah || '',
          username: acc.username || '',
          password: acc.password || '',
          role: acc.role || 'user'
        });
      };

      const handleDeleteAccount = (accId) => {
        if (currentUser && currentUser.id === accId) {
          showToast('Tidak dapat menghapus akun yang sedang digunakan login saat ini.', 'error');
          return;
        }
        const target = accounts.find((a) => a.id === accId);
        setAccounts((prev) => prev.filter((a) => a.id !== accId));
        if (editingAccountId === accId) resetAccountForm();
        showToast(`Akun "${target?.username || ''}" berhasil dihapus.`, 'success');
      };

      // ============================================================================
      // GENERATOR SOAL LOKAL TANPA API KEY
      // ============================================================================
      const isArabicActive = (cfg = config) => (cfg || config)?.language === 'ar';
      const isEnglishActive = (cfg = config) => (cfg || config)?.language === 'en';

      const getOptionLabel = (idx, useArabic = false) => {
        if (useArabic) {
          const arLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
          return arLetters[idx] || String.fromCharCode(65 + idx);
        }
        return String.fromCharCode(65 + idx);
      };

      const buildLocalQuestionItem = (idx, bentukSoal, cfg) => {
        const subj = cfg.subject || 'Mata Pelajaran MI';
        const top = cfg.topic || 'Materi Pembelajaran MI';
        const optCount = parseInt(cfg.optionCount, 10) || 4;
        const matchCount = parseInt(cfg.matchingOptionCount, 10) || 5;
        const matchDistractorCount = parseInt(cfg.matchingDistractorCount, 10) || 0;
        const isMathSci = /matematika|ipa|ipas/i.test(`${subj} ${top}`);
        const useAr = isArabicActive(cfg);
        const useEn = isEnglishActive(cfg);
        const n = idx + 1;
        const bloomLevels = ['C2', 'C3', 'C4'];
        const bloomLevel = bloomLevels[idx % bloomLevels.length];

        if (bentukSoal === 'PG Kompleks') {
          const rawOpts = useAr
            ? [
                `يَتَوَافَقُ مَعَ القَوَاعِدِ الأَسَاسِيَّةِ فِي مَوْضُوْعِ (${top})`,
                `يُسَاهِمُ فِي تَحْقِيْقِ الفَهْمِ الصَّحِيْحِ وَالتَّطْبِيْقِ العَمَلِيِّ`,
                `يَتَعَارَضُ مَعَ الأَحْكَامِ وَالأَدِلَّةِ الوَارِدَةِ فِي الدَّرْسِ`,
                `يَعْكِسُ القِيَمَ وَالمَبَادِئَ الرَّئِيْسِيَّةَ المَطْلُوْبَةَ`
              ].slice(0, optCount)
            : useEn
            ? [
                `It accurately applies the core principles of ${top}`,
                `It demonstrates a clear relationship between the main concepts`,
                `It contradicts the basic rules established in the lesson`,
                `It provides a valid contextual interpretation`
              ].slice(0, optCount)
            : [
                `Menerapkan langkah yang benar sesuai konsep dasar ${top}`,
                `Menunjukkan hubungan sebab-akibat yang tepat antarbagian materi`,
                `Mengabaikan kaidah dasar yang diajarkan pada materi ${top}`,
                `Memberikan kesimpulan yang sesuai dengan bukti pengamatan`
              ].slice(0, optCount);

          return {
            bentukSoal: 'PG Kompleks',
            question: useAr
              ? `اقْرَأِ العِبَارَاتِ الآتِيَةَ المُتَعَلِّقَةَ بِمَوْضُوْعِ (${top})، مَا العِبَارَاتُ الصَّحِيْحَةُ مِمَّا يَأْتِي؟`
              : useEn
              ? `Read the following statements regarding ${top}. Which of the following statements are correct?`
              : `Perhatikan studi kasus penerapan konsep ${top} pada mata pelajaran ${subj} (MI) berikut. Manakah pernyataan analisis yang tepat?`,
            matchingPremises: [],
            options: rawOpts,
            answer: `A, B, dan D`,
            explanation: `Pernyataan A, B, dan D bernilai benar sesuai analisis konsep ${top} jenjang MI.`,
            bloomLevel,
            cp: `Memahami dan menganalisis konsep ${top} pada mata pelajaran ${subj} jenjang MI.`,
            tp: `Peserta didik MI mampu mengevaluasi beberapa pernyataan yang benar terkait ${top}.`,
            materi: top,
            indicator: `Disajikan permasalahan mengenai ${top}, peserta didik dapat memilih lebih dari satu pernyataan yang benar.`
          };
        }

        if (bentukSoal === 'Menjodohkan') {
          const premises = [];
          const rightOpts = [];
          for (let i = 0; i < matchCount; i++) {
            if (isMathSci) {
              const a = n + i + 2;
              const b = i + 3;
              premises.push(`Hasil hitung dari (${a} × ${b}) + ${a}`);
              rightOpts.push(`${a * b + a}`);
            } else {
              const aspects = ['Pengertian Dasar', 'Contoh Penerapan', 'Hikmah / Manfaat', 'Ketentuan Utama', 'Sikap Teladan'];
              const asp = aspects[i % aspects.length];
              premises.push(`${asp} pada materi ${top}`);
              rightOpts.push(`Menjelaskan ${asp.toLowerCase()} sesuai kaidah ${subj}`);
            }
          }
          const distractors = [];
          for (let d = 0; d < matchDistractorCount; d++) {
            distractors.push(isMathSci ? `${(n + matchCount + d + 4) * 3}` : `Ketentuan yang tidak berkaitan dengan ${top} (${d + 1})`);
          }
          const reversedCorrect = [...rightOpts].reverse();
          const shuffledOpts = [...reversedCorrect, ...distractors];
          const pairKeys = premises.map((_, i) => `${i + 1}-${String.fromCharCode(65 + (matchCount - 1 - i))}`).join(', ');

          return {
            bentukSoal: 'Menjodohkan',
            question: `Pasangkanlah setiap pernyataan pada kolom kiri dengan jawaban yang paling tepat pada kolom kanan terkait materi ${top}!`,
            matchingPremises: premises,
            options: shuffledOpts,
            answer: pairKeys,
            explanation: `Pasangan yang tepat: ${pairKeys}.`,
            bloomLevel,
            cp: `Menguasai keterkaitan antarkonsep dalam materi ${top}.`,
            tp: `Peserta didik MI dapat menjodohkan pernyataan dan pasangan jawaban yang sesuai mengenai ${top}.`,
            materi: top,
            indicator: `Disajikan daftar premis dan pilihan jawaban tentang ${top}, peserta didik dapat memasangkan keduanya dengan tepat.`
          };
        }

        if (bentukSoal === 'Benar/Salah') {
          const isTrueKey = idx % 2 === 0;
          const valA = n + 3;
          const stmt = isMathSci
            ? isTrueKey
              ? `Hasil penjumlahan ${valA * 4} + ${valA * 2} sama dengan ${valA * 6}.`
              : `Hasil penjumlahan ${valA * 4} + ${valA * 2} sama dengan ${valA * 5}.`
            : isTrueKey
            ? `Penerapan konsep ${top} dalam kehidupan sehari-hari mencerminkan pemahaman materi ${subj} yang baik.`
            : `Dalam mempelajari ${top}, kita boleh mengabaikan aturan dasar yang berlaku.`;

          return {
            bentukSoal: 'Benar/Salah',
            question: `Tentukan apakah pernyataan berikut Benar atau Salah!\n"${stmt}"`,
            matchingPremises: [],
            options: ['Benar', 'Salah'],
            answer: isTrueKey ? 'A. Benar' : 'B. Salah',
            explanation: `Pernyataan tersebut bernilai ${isTrueKey ? 'Benar' : 'Salah'} sesuai konsep inti pada materi ${top}.`,
            bloomLevel,
            cp: `Mengevaluasi kebenaran pernyataan konsep pada materi ${top}.`,
            tp: `Peserta didik MI mampu memverifikasi kebenaran pernyataan terkait ${top}.`,
            materi: top,
            indicator: `Disajikan sebuah pernyataan mengenai ${top}, peserta didik dapat menentukan nilai kebenarannya.`
          };
        }

        if (bentukSoal === 'Isian Singkat') {
          const mult = n + 2;
          const baseVal = 8 * mult;
          const ansVal = 6 * mult;
          return {
            bentukSoal: 'Isian Singkat',
            question: isMathSci
              ? `Perbandingan banyak kelereng Ahmad dan Budi adalah 3 : 4. Jika banyak kelereng Budi adalah ${baseVal} butir, maka banyak kelereng Ahmad adalah ... butir.`
              : `Dalam pelajaran ${subj} mengenai ${top}, sikap atau tindakan utama yang harus diamalkan oleh siswa madrasah adalah ...`,
            matchingPremises: [],
            options: [],
            answer: isMathSci ? `${ansVal}` : `Mengamalkan nilai kebaikan sesuai ajaran ${top}`,
            explanation: isMathSci
              ? `Banyak kelereng Ahmad = (3/4) × ${baseVal} = ${ansVal} butir.`
              : `Jawaban mengacu pada inti pengamalan materi ${top} pada jenjang Madrasah Ibtidaiyah.`,
            bloomLevel,
            cp: `Menerapkan konsep esensial pada materi ${top}.`,
            tp: `Peserta didik MI mampu menentukan jawaban singkat yang tepat pada materi ${top}.`,
            materi: top,
            indicator: `Disajikan permasalahan singkat mengenai ${top}, peserta didik dapat menentukan jawabannya dengan tepat.`
          };
        }

        if (bentukSoal === 'Uraian') {
          const pVal = n + 3;
          return {
            bentukSoal: 'Uraian',
            question: isMathSci
              ? `Sebuah kebun madrasah berbentuk persegi panjang memiliki panjang ${pVal * 3} meter dan lebar ${pVal * 2} meter. Hitunglah keliling dan luas kebun madrasah tersebut beserta langkah-langkahnya!`
              : `Jelaskan 3 contoh penerapan materi ${top} dalam kehidupan sehari-hari di lingkungan madrasah maupun di rumah beserta manfaatnya!`,
            matchingPremises: [],
            options: [],
            answer: isMathSci
              ? `Keliling = ${2 * (pVal * 3 + pVal * 2)} meter, Luas = ${pVal * 3 * pVal * 2} m².`
              : `Siswa menyebutkan 3 contoh konkret pengamalan ${top} di rumah/madrasah beserta manfaat positifnya.`,
            explanation: isMathSci
              ? `Keliling = 2 × (p + l) = ${2 * (pVal * 3 + pVal * 2)} m. Luas = p × l = ${pVal * 3 * pVal * 2} m².`
              : `Penilaian didasarkan pada ketepatan contoh dan kejelasan alasan sesuai materi ${top}.`,
            bloomLevel,
            cp: `Menganalisis dan memecahkan permasalahan terkait ${top}.`,
            tp: `Peserta didik MI mampu menguraikan jawaban mengenai ${top} secara runtut.`,
            materi: top,
            indicator: `Disajikan kasus kontekstual mengenai ${top}, peserta didik dapat menguraikan jawabannya secara lengkap.`
          };
        }

        // Default: Pilihan Ganda (PG)
        const pgOpts = useAr
          ? [
              `تَطْبِيْقُ القَوَاعِدِ الأَسَاسِيَّةِ وَالأَحْكَامِ الصَّحِيْحَةِ بِشَكْلٍ مُنَظَّمٍ`,
              `إِهْمَالُ الشُّرُوْطِ الرَّئِيْسِيَّةِ فِي المَوْضُوْعِ`,
              `الاعْتِمَادُ عَلَى التَّخْمِيْنِ دُوْنَ الرُّجُوْعِ إِلَى الأَدِلَّةِ`,
              `تَجَاهُلُ النَّتَائِجِ المَتَرَتِّبَةِ عَلَى تَطْبِيْقِ المَفْهُوْمِ`
            ].slice(0, optCount)
          : useEn
          ? [
              `Applying the core principles of ${top} accurately in daily situations`,
              `Ignoring the basic rules required in the topic`,
              `Drawing conclusions without checking the facts`,
              `Disregarding the main objective of the lesson`
            ].slice(0, optCount)
          : [
              `Memahami konsep dasar ${top} dan menerapkannya secara tepat dalam kehidupan sehari-hari`,
              `Mengabaikan aturan utama yang berlaku pada materi ${top}`,
              `Menyimpulkan masalah tanpa memperhatikan fakta yang ada`,
              `Menolak bekerja sama saat menyelesaikan tugas kelompok`
            ].slice(0, optCount);

        const targetIdx = idx % pgOpts.length;
        if (targetIdx !== 0) {
          const tmp = pgOpts[0];
          pgOpts[0] = pgOpts[targetIdx];
          pgOpts[targetIdx] = tmp;
        }

        return {
          bentukSoal: 'PG',
          question: useAr
            ? `بِنَاءً عَلَى دِرَاسَتِكَ لِمَوْضُوْعِ (${top}) [السُّؤَالُ ${n}]، مَا العِبَارَةُ الأَكْثَرُ دِقَّةً وَصِحَّةً مِمَّا يَأْتِي؟`
            : useEn
            ? `Based on ${top} in ${subj} (Question ${n}), which of the following statements is correct?`
            : `Dalam mempelajari materi ${top} pada mata pelajaran ${subj} (butir ke-${n}), perilaku atau pemahaman yang paling tepat adalah...`,
          matchingPremises: [],
          options: pgOpts,
          answer: `${getOptionLabel(targetIdx, useAr)}. ${pgOpts[targetIdx]}`,
          explanation: `Jawaban yang tepat adalah ${getOptionLabel(targetIdx, useAr)} karena sesuai dengan kaidah konsep dasar pada materi ${top} jenjang MI.`,
          bloomLevel,
          cp: `Memahami konsep ${top} pada mata pelajaran ${subj} jenjang MI.`,
          tp: `Peserta didik MI mampu menyelesaikan soal terkait ${top} dengan tepat.`,
          materi: top,
          indicator: `Disajikan permasalahan mengenai ${top}, peserta didik dapat menentukan jawaban yang tepat.`
        };
      };

      const handleShuffleMultipleChoiceOptions = () => {
        if (!finalQuiz || !Array.isArray(finalQuiz.questions)) return;
        const useAr = isArabicActive();
        const shuffledQuestions = finalQuiz.questions.map((q) => {
          if (q.bentukSoal !== 'PG' || !Array.isArray(q.options) || q.options.length < 2) return q;
          const ansLetter = String(q.answer || '').trim().charAt(0).toUpperCase();
          const currentIdx = Math.max(0, ansLetter.charCodeAt(0) - 65);
          const pairs = q.options.map((opt, i) => ({ opt, isCorrect: i === currentIdx }));
          for (let i = pairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
          }
          const newCorrectIdx = Math.max(0, pairs.findIndex((p) => p.isCorrect));
          const newOpts = pairs.map((p) => p.opt);
          const label = getOptionLabel(newCorrectIdx, useAr);
          return { ...q, options: newOpts, answer: `${label}. ${newOpts[newCorrectIdx]}` };
        });
        setFinalQuiz((prev) => ({ ...prev, questions: shuffledQuestions }));
        showToast('Urutan pilihan jawaban PG berhasil diacak!', 'success');
      };

      const getTotalQuestions = (cfg = config) =>
        (parseInt(cfg.pgCount, 10) || 0) +
        (parseInt(cfg.pgKompleksCount, 10) || 0) +
        (parseInt(cfg.menjodohkanCount, 10) || 0) +
        (parseInt(cfg.benarSalahCount, 10) || 0) +
        (parseInt(cfg.isianCount, 10) || 0) +
        (parseInt(cfg.uraianCount, 10) || 0);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        const countFields = [
          'pgCount', 'pgKompleksCount', 'menjodohkanCount',
          'benarSalahCount', 'isianCount', 'uraianCount'
        ];
        if (countFields.includes(name)) {
          const numVal = value === '' ? '' : Math.max(0, parseInt(value, 10) || 0);
          setConfig((prev) => ({ ...prev, [name]: numVal }));
          return;
        }
        setConfig((prev) => ({ ...prev, level: 'MI', [name]: value }));
      };

      const handleGenerateQuiz = () => {
        if (!config.grade || !config.subject) {
          showToast('Mohon pilih Kelas MI dan Mata Pelajaran terlebih dahulu.', 'error');
          return;
        }
        if (!config.topic.trim()) {
          showToast('Mohon isi Topik / Materi Spesifik terlebih dahulu.', 'error');
          return;
        }
        const totalQuestions = getTotalQuestions();
        if (totalQuestions <= 0) {
          showToast('Total soal minimal 1 butir.', 'error');
          return;
        }

        setLoading(true);
        setGenerationSuccess(false);
        setProgress(35);

        setTimeout(() => {
          setProgress(75);
          const plan = [];
          const pushItems = (cnt, type) => {
            const c = parseInt(cnt, 10) || 0;
            for (let i = 0; i < c; i++) plan.push(type);
          };
          pushItems(config.pgCount, 'PG');
          pushItems(config.pgKompleksCount, 'PG Kompleks');
          pushItems(config.menjodohkanCount, 'Menjodohkan');
          pushItems(config.benarSalahCount, 'Benar/Salah');
          pushItems(config.isianCount, 'Isian Singkat');
          pushItems(config.uraianCount, 'Uraian');

          const questions = plan.map((bType, idx) => buildLocalQuestionItem(idx, bType, config));

          setTimeout(() => {
            setProgress(100);
            setFinalQuiz({ title: `Naskah Ujian MI - ${config.subject}`, questions });
            setGenerationSuccess(true);
          }, 300);
        }, 300);
      };

      const copyRichHtmlToClipboard = async (htmlContent, successMsg) => {
        try {
          const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman',serif;font-size:11pt;color:#000;">${htmlContent}</body></html>`;
          if (navigator.clipboard && window.ClipboardItem) {
            const blobHtml = new Blob([fullHtml], { type: 'text/html' });
            const blobText = new Blob([htmlContent.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' });
            await navigator.clipboard.write([
              new window.ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })
            ]);
            showToast(successMsg, 'success');
            return;
          }
        } catch (err) {}
        showToast(successMsg, 'success');
      };

      const buildExamPaperHtmlForExport = () => {
        if (!finalQuiz) return '';
        let html = `<div style="text-align:center;font-family:'Times New Roman',serif;margin-bottom:16px;">
          <div style="font-size:12pt;font-weight:bold;">KKMI KECAMATAN WONOMERTO</div>
          ${config.schoolName ? `<div style="font-size:14pt;font-weight:bold;">${config.schoolName.toUpperCase()}</div>` : ''}
          <div style="font-size:13pt;font-weight:bold;">NASKAH UJIAN ${String(config.subject || '').toUpperCase()}</div>
          <div style="font-size:11pt;">Jenjang: Madrasah Ibtidaiyah (MI) &bull; Kelas: ${config.grade} &bull; Kurikulum: ${config.curriculum}</div>
        </div><hr/>`;

        finalQuiz.questions.forEach((q, idx) => {
          html += `<p><b>${idx + 1}.</b> ${q.question || ''}</p>`;
          if (q.bentukSoal === 'Menjodohkan' && Array.isArray(q.matchingPremises)) {
            q.matchingPremises.forEach((prem, pIdx) => {
              const opt = q.options?.[pIdx] || '';
              html += `<p style="margin-left:18pt;">${pIdx + 1}. ${prem} &nbsp;&nbsp;&mdash;&nbsp;&nbsp; <b>${String.fromCharCode(65 + pIdx)}.</b> ${opt}</p>`;
            });
          } else if (Array.isArray(q.options) && q.options.length > 0) {
            q.options.forEach((opt, oIdx) => {
              html += `<p style="margin-left:18pt;"><b>${String.fromCharCode(65 + oIdx)}.</b> ${opt}</p>`;
            });
          }
        });
        return html;
      };

      const handleDownloadWordSimple = () => {
        if (!finalQuiz) return;
        const htmlDoc = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman',serif;">${buildExamPaperHtmlForExport()}</body></html>`;
        const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Soal_MI_KKMI_Wonomerto_${(config.subject || 'Ujian').replace(/\s+/g, '_')}.doc`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Dokumen Word berhasil diunduh!', 'success');
      };

      const handleExportQuizJson = () => {
        if (!finalQuiz) return;
        const blob = new Blob([JSON.stringify({ config, finalQuiz }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `KKMI_Wonomerto_${(config.subject || 'Soal').replace(/\s+/g, '_')}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File JSON berhasil diunduh!', 'success');
      };

      const handleImportQuizJsonFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (parsed?.config) setConfig((prev) => ({ ...prev, ...parsed.config, level: 'MI' }));
          if (parsed?.finalQuiz?.questions) {
            setFinalQuiz(parsed.finalQuiz);
            setActiveTab('naskah');
            showToast('File JSON berhasil dimuat!', 'success');
          }
        } catch (err) {
          showToast('File JSON tidak valid.', 'error');
        }
      };

      const totalQuestions = getTotalQuestions();

      // ============================================================================
      // HALAMAN LOGIN
      // ============================================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-teal-900 to-slate-900 flex flex-col justify-center items-center p-4">
            {toast && (
              <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-semibold">
                {toast.message}
              </div>
            )}

            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-emerald-100 overflow-hidden">
              <div className="bg-gradient-to-r from-emerald-600 to-teal-600 p-7 text-center text-white space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-white/20 mx-auto flex items-center justify-center shadow-lg border border-white/30">
                  <BookOpen size={28} className="text-white" />
                </div>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight">
                  Generate Soal KKMI Wonomerto
                </h1>
                <p className="text-xs text-emerald-100 font-medium">
                  Sistem Penyusunan Asesmen &amp; Bank Soal Madrasah Ibtidaiyah (MI)
                </p>
              </div>

              <form onSubmit={handleLoginSubmit} className="p-6 sm:p-8 space-y-5">
                {loginError && (
                  <div className="p-3.5 rounded-2xl bg-red-50 border border-red-200 flex items-center gap-2.5 text-xs font-bold text-red-700">
                    <AlertCircle size={16} />
                    <span>{loginError}</span>
                  </div>
                )}

                <div className="space-y-1.5">
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">Username</label>
                  <div className="relative">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><User size={16} /></span>
                    <input
                      type="text"
                      value={loginUsername}
                      onChange={(e) => setLoginUsername(e.target.value)}
                      placeholder="Masukkan username (admin / guru1)..."
                      className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">Password</label>
                  <div className="relative">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><Lock size={16} /></span>
                    <input
                      type={showLoginPassword ? 'text' : 'password'}
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      placeholder="Masukkan password..."
                      className="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                    <button
                      type="button"
                      onClick={() => setShowLoginPassword((prev) => !prev)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600"
                    >
                      {showLoginPassword ? <EyeOff size={16} /> : <Eye size={16} />}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                  <ShieldCheck size={18} />
                  <span>Masuk ke Aplikasi</span>
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ============================================================================
      // HALAMAN UTAMA APLIKASI
      // ============================================================================
      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-800">
          <input ref={jsonImportInputRef} type="file" accept=".json" onChange={handleImportQuizJsonFile} className="hidden" />

          {/* Navbar */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 py-3 px-4 print:hidden">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-600 flex items-center justify-center text-white shadow-md">
                  <BookOpen size={20} />
                </div>
                <div>
                  <span className="text-base sm:text-lg font-extrabold tracking-tight text-emerald-700 block leading-none">
                    Generate Soal KKMI Wonomerto
                  </span>
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                    Jenjang Madrasah Ibtidaiyah (MI)
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                {currentUser.role === 'admin' && (
                  <button
                    type="button"
                    onClick={() => { resetAccountForm(); setShowUserManagementModal(true); }}
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-extrabold"
                  >
                    <Users size={15} />
                    <span>Kelola Akun ({accounts.length})</span>
                  </button>
                )}

                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 border border-slate-200">
                  <span className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase ${currentUser.role === 'admin' ? 'bg-amber-500 text-white' : 'bg-emerald-600 text-white'}`}>
                    {currentUser.role === 'admin' ? 'Admin' : 'Pengguna'}
                  </span>
                  <span className="text-xs font-bold text-slate-700">{currentUser.fullName}</span>
                </div>

                <button
                  type="button"
                  onClick={handleLogout}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold"
                >
                  <LogOut size={14} />
                  <span>Keluar</span>
                </button>
              </div>
            </div>
          </header>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-md print:hidden">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold ${toast.type === 'error' ? 'bg-red-600 text-white border-red-700' : 'bg-emerald-600 text-white border-emerald-700'}`}>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Modal Kelola Akun */}
          {showUserManagementModal && currentUser.role === 'admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="px-6 py-4 bg-emerald-700 text-white flex items-center justify-between">
                  <h3 className="text-lg font-extrabold">Manajemen Akun Pengguna &amp; Admin</h3>
                  <button onClick={() => setShowUserManagementModal(false)} className="p-2 text-white/80 hover:text-white"><X size={20} /></button>
                </div>
                <div className="p-6 overflow-y-auto space-y-6">
                  <form onSubmit={handleSaveAccount} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" placeholder="Nama Lengkap *" value={accountForm.fullName} onChange={(e) => setAccountForm({ ...accountForm, fullName: e.target.value })} className="p-2.5 bg-white border rounded-xl text-xs" />
                    <input type="text" placeholder="Asal Madrasah" value={accountForm.madrasah} onChange={(e) => setAccountForm({ ...accountForm, madrasah: e.target.value })} className="p-2.5 bg-white border rounded-xl text-xs" />
                    <select value={accountForm.role} onChange={(e) => setAccountForm({ ...accountForm, role: e.target.value })} className="p-2.5 bg-white border rounded-xl text-xs font-bold">
                      <option value="user">Pengguna / Guru MI</option>
                      <option value="admin">Administrator KKMI</option>
                    </select>
                    <input type="text" placeholder="Username *" value={accountForm.username} onChange={(e) => setAccountForm({ ...accountForm, username: e.target.value })} className="p-2.5 bg-white border rounded-xl text-xs font-mono" />
                    <input type="text" placeholder="Password *" value={accountForm.password} onChange={(e) => setAccountForm({ ...accountForm, password: e.target.value })} className="p-2.5 bg-white border rounded-xl text-xs font-mono" />
                    <button type="submit" className="py-2.5 px-4 rounded-xl bg-emerald-600 text-white font-bold text-xs">
                      {editingAccountId ? 'Simpan Perubahan' : 'Tambah Akun'}
                    </button>
                  </form>

                  <table className="w-full text-left border-collapse text-xs border">
                    <thead>
                      <tr className="bg-slate-100 font-bold border-b">
                        <th className="p-3">Nama &amp; Madrasah</th>
                        <th className="p-3">Username</th>
                        <th className="p-3">Password</th>
                        <th className="p-3 text-center">Role</th>
                        <th className="p-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {accounts.map((acc) => (
                        <tr key={acc.id}>
                          <td className="p-3"><b>{acc.fullName}</b><br/><span className="text-slate-500">{acc.madrasah}</span></td>
                          <td className="p-3 font-mono">{acc.username}</td>
                          <td className="p-3 font-mono">{acc.password}</td>
                          <td className="p-3 text-center uppercase font-bold">{acc.role}</td>
                          <td className="p-3 text-center space-x-2">
                            <button onClick={() => handleStartEditAccount(acc)} className="px-2 py-1 bg-blue-100 text-blue-700 rounded font-bold">Edit</button>
                            {currentUser.id !== acc.id && (
                              <button onClick={() => handleDeleteAccount(acc.id)} className="px-2 py-1 bg-red-100 text-red-600 rounded font-bold">Hapus</button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* LOADING SCREEN */}
          {loading ? (
            <main className="max-w-2xl mx-auto px-4 py-14">
              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 text-center space-y-6">
                {!generationSuccess ? (
                  <>
                    <h2 className="text-2xl font-extrabold text-slate-800">Sedang Menyusun Soal MI...</h2>
                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                      <div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${progress}%` }} />
                    </div>
                    <p className="text-xs font-bold text-emerald-600">{progress}%</p>
                  </>
                ) : (
                  <>
                    <h2 className="text-2xl font-extrabold text-slate-800">Soal MI Berhasil Dibuat!</h2>
                    <button
                      type="button"
                      onClick={() => { setLoading(false); setGenerationSuccess(false); }}
                      className="px-8 py-3.5 rounded-full bg-slate-900 text-white font-bold text-sm"
                    >
                      Lihat Hasil Soal
                    </button>
                  </>
                )}
              </div>
            </main>
          ) : !finalQuiz || finalQuiz._minimizedToHome ? (
            /* FORM KONFIGURASI */
            <main className="max-w-2xl mx-auto px-4 py-8 space-y-6">
              <div className="text-center space-y-2">
                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">
                  Generator Soal MI Otomatis, <span className="text-emerald-600">Lebih Cepat &amp; Praktis</span>
                </h1>
                <p className="text-xs sm:text-sm text-slate-500">
                  Susun naskah ujian Madrasah Ibtidaiyah (Kelas 1–6) lengkap dengan kunci jawaban, pembahasan, dan kisi-kisi.
                </p>
              </div>

              {/* Pilih Kurikulum */}
              <section className="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 sm:p-6 space-y-4">
                <div className="flex items-center gap-2 text-slate-800 font-bold text-sm">
                  <BookOpen size={17} className="text-emerald-600" />
                  <span>Pilih Kurikulum</span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    { id: 'Merdeka', title: 'Merdeka', sub: 'Deep Learning MI' },
                    { id: 'KBC', title: 'KBC', sub: 'Kurikulum Berbasis Cinta' },
                    { id: 'K13', title: 'K13', sub: 'Kurikulum 2013' },
                    { id: 'Hybrid', title: 'Hybrid', sub: 'Gabungan' }
                  ].map((cur) => {
                    const active = config.curriculum === cur.id;
                    return (
                      <button
                        key={cur.id}
                        type="button"
                        onClick={() => handleInputChange({ target: { name: 'curriculum', value: cur.id } })}
                        className={`flex items-center gap-3 p-3.5 rounded-2xl border text-left transition-all ${
                          active
                            ? 'border-emerald-500 bg-emerald-50/60 ring-2 ring-emerald-100'
                            : 'border-slate-200 hover:border-slate-300 bg-white'
                        }`}
                      >
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${active ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                          <Layers size={18} />
                        </div>
                        <div>
                          <div className="text-xs sm:text-sm font-bold text-slate-800">{cur.title}</div>
                          <div className="text-[11px] text-slate-400">{cur.sub}</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Identitas Soal */}
              <section className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 space-y-4">
                <h2 className="text-sm font-bold text-slate-800">Identitas Soal Madrasah Ibtidaiyah (MI)</h2>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <input
                    type="text"
                    name="teacherName"
                    value={config.teacherName}
                    onChange={handleInputChange}
                    placeholder="Nama Guru (Opsional)"
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                  />
                  <input
                    type="text"
                    name="schoolName"
                    value={config.schoolName}
                    onChange={handleInputChange}
                    placeholder="Nama Madrasah (Opsional)"
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <select name="grade" value={config.grade} onChange={handleInputChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-medium">
                    <option value="">Pilih Kelas MI (1 – 6)...</option>
                    {GRADES_BY_LEVEL['MI'].map((grd) => (
                      <option key={grd} value={grd}>{grd} MI</option>
                    ))}
                  </select>

                  <select name="subject" value={config.subject} onChange={handleInputChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-medium">
                    <option value="">Pilih Mata Pelajaran MI...</option>
                    {SUBJECTS_BY_LEVEL['MI'].map((sub) => (
                      <option key={sub} value={sub}>{sub}</option>
                    ))}
                  </select>
                </div>

                {/* Bahasa Soal */}
                <div className="grid grid-cols-3 gap-2.5">
                  {[
                    { code: 'id', label: '🇮🇩 Bahasa Indonesia' },
                    { code: 'en', label: '🇬🇧 Bahasa Inggris' },
                    { code: 'ar', label: '🇸🇦 Bahasa Arab' }
                  ].map((lang) => (
                    <button
                      key={lang.code}
                      type="button"
                      onClick={() => setConfig({ ...config, language: lang.code })}
                      className={`py-2.5 px-3 rounded-xl border text-xs font-bold ${
                        config.language === lang.code
                          ? 'bg-emerald-50 text-emerald-700 border-emerald-500'
                          : 'bg-slate-50 text-slate-600 border-slate-200'
                      }`}
                    >
                      {lang.label}
                    </button>
                  ))}
                </div>

                <textarea
                  name="topic"
                  rows={3}
                  value={config.topic}
                  onChange={handleInputChange}
                  placeholder="Masukkan topik materi MI, rincian bab, atau Capaian Pembelajaran (CP)..."
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                />

                {/* Komposisi Soal */}
                <div className="p-4 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-extrabold uppercase text-slate-700">Komposisi Jumlah Soal</span>
                    <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">Total: {totalQuestions} Soal</span>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                    {[
                      { name: 'pgCount', label: 'PG' },
                      { name: 'pgKompleksCount', label: 'PG Kompleks' },
                      { name: 'menjodohkanCount', label: 'Menjodohkan' },
                      { name: 'benarSalahCount', label: 'Benar/Salah' },
                      { name: 'isianCount', label: 'Isian Singkat' },
                      { name: 'uraianCount', label: 'Uraian' }
                    ].map((item) => (
                      <div key={item.name} className="p-2.5 bg-white rounded-xl border flex items-center justify-between">
                        <span className="text-xs font-bold">{item.label}</span>
                        <input
                          type="number"
                          min="0"
                          max="50"
                          name={item.name}
                          value={config[item.name]}
                          onChange={handleInputChange}
                          className="w-14 p-1 text-center font-bold text-xs bg-slate-50 border rounded-lg"
                        />
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <button
                type="button"
                onClick={handleGenerateQuiz}
                className="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 cursor-pointer"
              >
                <Sparkles size={18} />
                <span>Buat Soal MI Sekarang</span>
              </button>

              <button
                type="button"
                onClick={() => jsonImportInputRef.current?.click()}
                className="w-full py-3.5 rounded-2xl bg-white text-slate-700 border-2 border-slate-200 font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer"
              >
                <Upload size={18} />
                <span>Import Soal dari File JSON (.json)</span>
              </button>
            </main>
          ) : (
            /* HASIL SOAL */
            <main className="max-w-4xl mx-auto px-4 py-8 space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-2 print:hidden">
                <button
                  type="button"
                  onClick={() => setFinalQuiz((prev) => ({ ...prev, _minimizedToHome: true }))}
                  className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border text-xs font-bold"
                >
                  <ArrowLeft size={14} />
                  <span>Kembali ke Pengaturan</span>
                </button>

                <div className="flex flex-wrap gap-2">
                  <button onClick={handleDownloadWordSimple} className="px-3.5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">
                    Download Word (.doc)
                  </button>
                  <button onClick={() => window.print()} className="px-3.5 py-2 rounded-xl bg-red-600 text-white text-xs font-bold">
                    Cetak / PDF
                  </button>
                  <button onClick={handleExportQuizJson} className="px-3.5 py-2 rounded-xl bg-white border text-xs font-bold">
                    Export JSON
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-8 space-y-6">
                <div className="border-b pb-4">
                  <div className="text-xs font-extrabold text-emerald-700 uppercase">KKMI Kecamatan Wonomerto</div>
                  <h1 className="text-xl font-extrabold text-slate-900">Naskah Ujian MI &mdash; {config.subject}</h1>
                  <p className="text-xs text-slate-400">Madrasah Ibtidaiyah (MI) &bull; {config.grade} &bull; Kurikulum {config.curriculum}</p>
                </div>

                {/* Tabs */}
                <div className="flex gap-6 border-b text-xs sm:text-sm font-bold print:hidden">
                  {[
                    { id: 'naskah', label: 'Naskah Soal' },
                    { id: 'kunci', label: 'Kunci & Pembahasan' },
                    { id: 'kisikisi', label: 'Kisi-Kisi' }
                  ].map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setActiveTab(t.id)}
                      className={`pb-3 border-b-2 ${activeTab === t.id ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-400'}`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>

                {activeTab === 'naskah' && (
                  <div className="space-y-6">
                    <div className="flex justify-end gap-2 print:hidden">
                      <button onClick={handleShuffleMultipleChoiceOptions} className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
                        Acak Jawaban PG
                      </button>
                      <button onClick={() => copyRichHtmlToClipboard(buildExamPaperHtmlForExport(), 'Naskah berhasil disalin!')} className="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">
                        Salin Naskah
                      </button>
                    </div>

                    {finalQuiz.questions.map((q, idx) => (
                      <div key={idx} className="flex gap-3">
                        <span className="font-bold">{idx + 1}.</span>
                        <div className="space-y-2 w-full">
                          <div className="text-[11px] font-bold text-slate-400 uppercase">{q.bentukSoal || 'PG'}</div>
                          <div className="text-sm sm:text-base leading-relaxed whitespace-pre-line">{q.question || ''}</div>

                          {q.bentukSoal === 'Menjodohkan' && Array.isArray(q.matchingPremises) ? (
                            <div className="mt-2 p-4 rounded-2xl bg-slate-50 border grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                              <div>
                                <div className="text-[11px] font-bold text-slate-400 uppercase mb-1">Pernyataan</div>
                                {q.matchingPremises.map((prem, pIdx) => (
                                  <div key={pIdx}>{pIdx + 1}. {prem}</div>
                                ))}
                              </div>
                              <div>
                                <div className="text-[11px] font-bold text-slate-400 uppercase mb-1">Pilihan Jawaban</div>
                                {(q.options || []).map((opt, oIdx) => (
                                  <div key={oIdx}><b>{String.fromCharCode(65 + oIdx)}.</b> {opt}</div>
                                ))}
                              </div>
                            </div>
                          ) : Array.isArray(q.options) && q.options.length > 0 ? (
                            <div className="space-y-1.5 pt-1">
                              {q.options.map((opt, oIdx) => (
                                <div key={oIdx} className="flex gap-2.5 text-sm">
                                  <span className="font-bold">{getOptionLabel(oIdx, isArabicActive())}.</span>
                                  <span>{opt}</span>
                                </div>
                              ))}
                            </div>
                          ) : null}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'kunci' && (
                  <div className="space-y-4">
                    {finalQuiz.questions.map((q, idx) => (
                      <div key={idx} className="p-4 rounded-2xl bg-slate-50 border space-y-1.5">
                        <div className="text-xs font-extrabold uppercase">Soal No. {idx + 1} ({q.bentukSoal || 'PG'})</div>
                        <div className="text-sm font-bold text-emerald-700">Kunci Jawaban: {q.answer || '-'}</div>
                        <div className="text-xs text-slate-600">Pembahasan: {q.explanation || '-'}</div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'kisikisi' && (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs border">
                      <thead>
                        <tr className="bg-slate-100 font-bold border-b">
                          <th className="p-2.5 text-center">No</th>
                          <th className="p-2.5">CP</th>
                          <th className="p-2.5">TP</th>
                          <th className="p-2.5">Materi</th>
                          <th className="p-2.5">Indikator Soal</th>
                          <th className="p-2.5 text-center">Level</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {finalQuiz.questions.map((q, idx) => (
                          <tr key={idx}>
                            <td className="p-2.5 text-center font-bold">{idx + 1}</td>
                            <td className="p-2.5">{q.cp || '-'}</td>
                            <td className="p-2.5">{q.tp || '-'}</td>
                            <td className="p-2.5">{q.materi || config.topic}</td>
                            <td className="p-2.5">{q.indicator || '-'}</td>
                            <td className="p-2.5 text-center font-bold">{q.bloomLevel || 'C3'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
