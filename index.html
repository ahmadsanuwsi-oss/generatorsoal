  const buildNativeDocxRunsFromMathHtml = (rawInput, baseOpts = {}) => {
    const formatted = formatMathHtml(rawInput || '');
    const container = document.createElement('div');
    container.innerHTML = formatted;

    const makeTextRun = (text, opts = {}) => {
      if (!text) return '';
      const boldXml = opts.bold ? '<w:b/><w:bCs/>' : '';
      const italicXml = opts.italic ? '<w:i/><w:iCs/>' : '';
      const underlineXml = opts.underline ? '<w:u w:val="single"/>' : '';
      const colorXml = opts.color ? `<w:color w:val="${opts.color}"/>` : '';
      const vertXml = opts.vertAlign ? `<w:vertAlign w:val="${opts.vertAlign}"/>` : '';
      const sz = opts.sz || 22;
      return `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${boldXml}${italicXml}${underlineXml}${colorXml}${vertXml}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r>`;
    };

    const makeOmmlRuns = (node, inherited = {}) => {
      let out = '';
      node.childNodes.forEach((child) => {
        if (child.nodeType === 3) {
          const t = child.nodeValue;
          if (t) {
            out += `<m:r><m:rPr><m:nor/></m:rPr><w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/><w:sz w:val="22"/></w:rPr><m:t>${escapeXml(t)}</m:t></m:r>`;
          }
        } else if (child.nodeType === 1) {
          const tag = child.tagName.toLowerCase();
          if (child.classList.contains('math-matrix')) {
            const mKind = child.getAttribute('data-mtype') || 'bmatrix';
            const encRows = child.getAttribute('data-mrows') || '';
            const rawRowsStr = decodeURIComponent(encRows);
            const rowLines = rawRowsStr.split('\n').filter(Boolean);
            const begChr = mKind === 'pmatrix' ? '(' : mKind === 'vmatrix' ? '|' : mKind === 'Vmatrix' ? '‖' : '[';
            const endChr = mKind === 'pmatrix' ? ')' : mKind === 'vmatrix' ? '|' : mKind === 'Vmatrix' ? '‖' : ']';
            const mrXml = rowLines
              .map((rLine) => {
                const cols = rLine.split('\t');
                const meXml = cols
                  .map((cHtml) => {
                    const cDiv = document.createElement('div');
                    cDiv.innerHTML = cHtml;
                    return `<m:e>${makeOmmlRuns(cDiv, inherited)}</m:e>`;
                  })
                  .join('');
                return `<m:mr>${meXml}</m:mr>`;
              })
              .join('');
            out += `<m:d><m:dPr><m:begChr m:val="${begChr}"/><m:endChr m:val="${endChr}"/></m:dPr><m:e><m:m>${mrXml}</m:m></m:e></m:d>`;
          } else if (child.classList.contains('math-frac')) {
            const numRaw = decodeURIComponent(child.getAttribute('data-num') || '');
            const denRaw = decodeURIComponent(child.getAttribute('data-den') || '');
            const numDiv = document.createElement('div');
            numDiv.innerHTML = formatMathHtml(numRaw);
            const denDiv = document.createElement('div');
            denDiv.innerHTML = formatMathHtml(denRaw);
            out += `<m:f><m:fPr><m:type m:val="bar"/></m:fPr><m:num>${makeOmmlRuns(numDiv, inherited)}</m:num><m:den>${makeOmmlRuns(denDiv, inherited)}</m:den></m:f>`;
          } else if (child.classList.contains('math-sqrt')) {
            const radRaw = decodeURIComponent(child.getAttribute('data-rad') || '');
            const idxRaw = decodeURIComponent(child.getAttribute('data-idx') || '');
            const radDiv = document.createElement('div');
            radDiv.innerHTML = formatMathHtml(radRaw);
            if (idxRaw.trim()) {
              const idxDiv = document.createElement('div');
              idxDiv.innerHTML = formatMathHtml(idxRaw);
              out += `<m:rad><m:radPr><m:degHide m:val="0"/></m:radPr><m:deg>${makeOmmlRuns(idxDiv, inherited)}</m:deg><m:e>${makeOmmlRuns(radDiv, inherited)}</m:e></m:rad>`;
            } else {
              out += `<m:rad><m:radPr><m:degHide m:val="1"/></m:radPr><m:deg/><m:e>${makeOmmlRuns(radDiv, inherited)}</m:e></m:rad>`;
            }
          } else if (tag === 'sup') {
            const txt = child.textContent || '';
            out += `<m:r><m:rPr><m:nor/></m:rPr><w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/><w:vertAlign w:val="superscript"/><w:sz w:val="20"/></w:rPr><m:t>${escapeXml(txt)}</m:t></m:r>`;
          } else if (tag === 'sub') {
            const txt = child.textContent || '';
            out += `<m:r><m:rPr><m:nor/></m:rPr><w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/><w:vertAlign w:val="subscript"/><w:sz w:val="20"/></w:rPr><m:t>${escapeXml(txt)}</m:t></m:r>`;
          } else {
            out += makeOmmlRuns(child, inherited);
          }
        }
      });
      return out || `<m:r><m:t> </m:t></m:r>`;
    };

    const walkNodes = (parent, state = {}) => {
      let xml = '';
      parent.childNodes.forEach((node) => {
        if (node.nodeType === 3) {
          xml += makeTextRun(node.nodeValue, { ...baseOpts, ...state });
        } else if (node.nodeType === 1) {
          const tag = node.tagName.toLowerCase();
          if (
            node.classList.contains('math-frac') ||
            node.classList.contains('math-sqrt') ||
            node.classList.contains('math-matrix')
          ) {
            const wrapper = document.createElement('div');
            wrapper.appendChild(node.cloneNode(true));
            xml += `<m:oMath>${makeOmmlRuns(wrapper, { ...baseOpts, ...state })}</m:oMath>`;
          } else if (tag === 'b' || tag === 'strong') {
            xml += walkNodes(node, { ...state, bold: true });
          } else if (tag === 'i' || tag === 'em') {
            xml += walkNodes(node, { ...state, italic: true });
          } else if (tag === 'u') {
            xml += walkNodes(node, { ...state, underline: true });
          } else if (tag === 'sup') {
            xml += walkNodes(node, { ...state, vertAlign: 'superscript' });
          } else if (tag === 'sub') {
            xml += walkNodes(node, { ...state, vertAlign: 'subscript' });
          } else if (tag === 'br') {
            xml += `<w:r><w:br/></w:r>`;
          } else {
            xml += walkNodes(node, state);
          }
        }
      });
      return xml;
    };

    return walkNodes(container, baseOpts);
  };

  const loadExternalScript = (src) => {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) {
        if (existing.getAttribute('data-loaded') === 'true') return resolve();
        existing.addEventListener('load', () => resolve());
        existing.addEventListener('error', () => reject(new Error(`Gagal memuat script: ${src}`)));
        return;
      }
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.onload = () => {
        script.setAttribute('data-loaded', 'true');
        resolve();
      };
      script.onerror = () => reject(new Error(`Gagal memuat script: ${src}`));
      document.head.appendChild(script);
    });
  };

  const handleDownloadWord = async (selectedSections = wordExportSelections) => {
    if (!finalQuiz) return;
    const activeSel = selectedSections || wordExportSelections;
    const hasAnySelected =
      activeSel.naskah ||
      activeSel.kunci ||
      activeSel.kisikisi ||
      activeSel.analisisbutir ||
      activeSel.kartusoal;

    if (!hasAnySelected) {
      showToast('Mohon centang minimal 1 bagian dokumen yang ingin diekspor ke Word!', 'error');
      return;
    }

    setShowExportMenu(false);
    setShowWordExportModal(false);

    const safeSubj = (config.subject || 'Soal_MI').replace(/[^a-zA-Z0-9]+/g, '_');

    try {
      if (!window.JSZip) {
        await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      }

      if (window.JSZip) {
        const zip = new window.JSZip();
        const mediaFiles = [];
        let relCounter = 10;

        const addImageToDocx = (dataUrl, maxWidthPx = 220, maxHeightPx = 150) => {
          const match = String(dataUrl || '').match(/^data:image\/(png|jpeg|jpg);base64,(.+)$/i);
          if (!match) return '';
          const ext = match[1].toLowerCase() === 'jpg' ? 'jpeg' : match[1].toLowerCase();
          const base64Data = match[2];
          const rId = `rIdImg${relCounter++}`;
          const fileName = `image_${relCounter}.${ext === 'jpeg' ? 'jpg' : 'png'}`;
          mediaFiles.push({ rId, fileName, base64Data, ext });

          const cx = Math.round(maxWidthPx * 9525);
          const cy = Math.round(maxHeightPx * 9525);
          const docPrId = relCounter;

          return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${docPrId}" name="Picture ${docPrId}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${docPrId}" name="${fileName}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
        };

        const makeParagraph = (runsXml, opts = {}) => {
          const jcXml = opts.align ? `<w:jc w:val="${opts.align}"/>` : '';
          const tabsXml =
            opts.tabStopTwips !== undefined
              ? `<w:tabs><w:tab w:val="left" w:pos="${opts.tabStopTwips}"/></w:tabs>`
              : '';
          const indXml =
            opts.leftTwips !== undefined || opts.hangingTwips !== undefined
              ? `<w:ind ${opts.leftTwips !== undefined ? `w:left="${opts.leftTwips}"` : ''} ${
                  opts.hangingTwips !== undefined ? `w:hanging="${opts.hangingTwips}"` : ''
                }/>`
              : '';
          const before = opts.spaceBefore !== undefined ? opts.spaceBefore : 0;
          const after = opts.spaceAfter !== undefined ? opts.spaceAfter : 60;
          const line = opts.lineSpacing !== undefined ? opts.lineSpacing : 276;
          const pBdrXml = opts.bottomBorder
            ? `<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="000000"/></w:pBdr>`
            : '';
          return `<w:p><w:pPr>${tabsXml}${jcXml}${indXml}${pBdrXml}<w:spacing w:before="${before}" w:after="${after}" w:line="${line}" w:lineRule="auto"/></w:pPr>${runsXml}</w:p>`;
        };

        let bodyXml = '';
        const useArDocx = isArabicActive();
        const useEnDocx = isEnglishActive();
        const subjDocx = useArDocx
          ? translateSubjectToAr(config.subject)
          : useEnDocx
          ? translateSubjectToEn(config.subject)
          : (config.subject || '');
        const assessDocx = config.assessmentType
          ? useArDocx
            ? translateAssessmentToAr(config.assessmentType)
            : useEnDocx
            ? translateAssessmentToEn(config.assessmentType)
            : config.assessmentType
          : '';
        const gradeDocx = useEnDocx ? translateGradeToEn(config.grade) : config.grade;

        bodyXml += makeParagraph(
          buildNativeDocxRunsFromMathHtml('KKMI KECAMATAN WONOMERTO', { bold: true, sz: 24 }),
          { align: 'center', spaceAfter: 30 }
        );
        if (config.schoolName) {
          bodyXml += makeParagraph(
            buildNativeDocxRunsFromMathHtml(config.schoolName.toUpperCase(), { bold: true, sz: 28 }),
            { align: 'center', spaceAfter: 40 }
          );
        }
        bodyXml += makeParagraph(
          buildNativeDocxRunsFromMathHtml(
            `${
              useArDocx
                ? `ورقة أسئلة الاختبار - ${subjDocx}`
                : useEnDocx
                ? `${subjDocx.toUpperCase()} EXAMINATION`
                : `NASKAH UJIAN ${subjDocx.toUpperCase()}`
            }${assessDocx ? ` - ${useArDocx ? assessDocx : assessDocx.toUpperCase()}` : ''}`,
            { bold: true, sz: 26 }
          ),
          { align: 'center', spaceAfter: 40 }
        );
        bodyXml += makeParagraph(
          buildNativeDocxRunsFromMathHtml(
            useArDocx
              ? `المرحلة: MI • الصف: ${config.grade} • المنهج: ${config.curriculum}`
              : useEnDocx
              ? `Level: MI • Grade: ${gradeDocx} • Curriculum: ${config.curriculum}`
              : `Jenjang: Madrasah Ibtidaiyah (MI) • Kelas: ${config.grade} • Kurikulum: ${config.curriculum}`,
            { sz: 22 }
          ),
          { align: 'center', spaceAfter: config.teacherName ? 40 : 120, bottomBorder: !config.teacherName }
        );
        if (config.teacherName) {
          bodyXml += makeParagraph(
            buildNativeDocxRunsFromMathHtml(
              useArDocx
                ? `المعلم: ${config.teacherName}`
                : useEnDocx
                ? `Teacher: ${config.teacherName}`
                : `Guru Penyusun: ${config.teacherName}`,
              { sz: 22 }
            ),
            { align: 'center', spaceAfter: 120, bottomBorder: true }
          );
        }

        let hasRenderedSection = false;
        let sectionNumCounter = 1;
        const toRoman = (num) => ['I', 'II', 'III', 'IV', 'V', 'VI'][num - 1] || String(num);
        const toArabicOrdinal = (num) =>
          ['أولاً', 'ثانياً', 'ثالثاً', 'رابعاً', 'خامساً'][num - 1] || `${num}`;

        const qIndentTwips = 420;
        const optHangingTwips = 360;
        const kisiBorders = `<w:tblBorders>
          <w:top w:val="single" w:sz="6" w:space="0" w:color="000000"/>
          <w:left w:val="single" w:sz="6" w:space="0" w:color="000000"/>
          <w:bottom w:val="single" w:sz="6" w:space="0" w:color="000000"/>
          <w:right w:val="single" w:sz="6" w:space="0" w:color="000000"/>
          <w:insideH w:val="single" w:sz="6" w:space="0" w:color="000000"/>
          <w:insideV w:val="single" w:sz="6" w:space="0" w:color="000000"/>
        </w:tblBorders>`;

        if (activeSel.naskah) {
          const secIdx = sectionNumCounter++;
          hasRenderedSection = true;
          bodyXml += makeParagraph(
            buildNativeDocxRunsFromMathHtml(
              useArDocx
                ? `${toArabicOrdinal(secIdx)}: أسئلة الاختبار`
                : useEnDocx
                ? `${toRoman(secIdx)}. EXAMINATION QUESTIONS`
                : `${toRoman(secIdx)}. NASKAH SOAL`,
              { bold: true, sz: 24 }
            ),
            { align: useArDocx ? 'right' : 'left', spaceBefore: 120, spaceAfter: 140 }
          );

          finalQuiz.questions.forEach((q, idx) => {
            const isPgk = String(q.bentukSoal || '').toLowerCase().includes('kompleks');
            const cleanedRaw = cleanPgkNumbering(q.question || '', false);
            const lines = String(cleanedRaw)
              .split(/\n+/)
              .map((l) => l.trim())
              .filter(Boolean);

            const stim = stimulusByQuestion[idx];
            const imgUrl = generatedImages[idx];

            if (q.stimulusGroupId && q.isStimulusGroupLeader && q.sharedStimulusText) {
              const headerStimText = useArDocx
                ? `النص التمهيدي للأسئلة رقم ${q.stimulusGroupStart} إلى ${q.stimulusGroupEnd}:`
                : useEnDocx
                ? `Stimulus for Questions No. ${q.stimulusGroupStart} to ${q.stimulusGroupEnd}:`
                : `Perhatikan stimulus berikut untuk menjawab soal nomor ${q.stimulusGroupStart} s.d. ${q.stimulusGroupEnd}!`;
              bodyXml += makeParagraph(buildNativeDocxRunsFromMathHtml(headerStimText, { bold: true, underline: true }), {
                spaceBefore: 120,
                spaceAfter: 40
              });
              if (imgUrl) {
                bodyXml += makeParagraph(addImageToDocx(imgUrl, 220, 145), {
                  spaceAfter: 60
                });
              }
              const sharedLines = String(q.sharedStimulusText)
                .split(/\n+/)
                .map((l) => l.trim())
                .filter(Boolean);
              sharedLines.forEach((sLine, sIdx) => {
                bodyXml += makeParagraph(buildNativeDocxRunsFromMathHtml(sLine), {
                  align: 'both',
                  spaceAfter: sIdx === sharedLines.length - 1 ? 80 : 40
                });
              });
            }

            const effectiveImgUrl =
              q.stimulusGroupId && q.isStimulusGroupLeader && q.sharedStimulusText ? null : imgUrl;

            if (effectiveImgUrl || stim) {
              if (stim) {
                const stimRuns =
                  buildNativeDocxRunsFromMathHtml(`${idx + 1}.`, { bold: true }) +
                  `<w:r><w:tab/></w:r>` +
                  buildNativeDocxRunsFromMathHtml(stim, { italic: true });
                bodyXml += makeParagraph(stimRuns, {
                  align: 'both',
                  leftTwips: qIndentTwips,
                  hangingTwips: qIndentTwips,
                  tabStopTwips: qIndentTwips,
                  spaceBefore: 80,
                  spaceAfter: 60
                });
                if (effectiveImgUrl) {
                  bodyXml += makeParagraph(addImageToDocx(effectiveImgUrl, 220, 145), {
                    leftTwips: qIndentTwips,
                    spaceAfter: 80
                  });
                }
                lines.forEach((line, lIdx) => {
                  const isNumLine = /^\d+\.\s+/.test(line);
                  bodyXml += makeParagraph(buildNativeDocxRunsFromMathHtml(line), {
                    align: 'both',
                    leftTwips: qIndentTwips,
                    spaceBefore: lIdx > 0 && !isNumLine && isPgk ? 60 : 0,
                    spaceAfter: lIdx === lines.length - 1 ? 60 : 30
                  });
                });
              } else {
                const numOnlyRuns = buildNativeDocxRunsFromMathHtml(`${idx + 1}.`, { bold: true });
                bodyXml += makeParagraph(numOnlyRuns, {
                  leftTwips: qIndentTwips,
                  hangingTwips: qIndentTwips,
                  tabStopTwips: qIndentTwips,
                  spaceBefore: 80,
                  spaceAfter: 40
                });
                bodyXml += makeParagraph(addImageToDocx(effectiveImgUrl, 220, 145), {
                  leftTwips: qIndentTwips,
                  spaceAfter: 60
                });
                lines.forEach((line, lIdx) => {
                  const isNumLine = /^\d+\.\s+/.test(line);
                  bodyXml += makeParagraph(buildNativeDocxRunsFromMathHtml(line), {
                    align: 'both',
                    leftTwips: qIndentTwips,
                    spaceBefore: lIdx > 0 && !isNumLine && isPgk ? 60 : 0,
                    spaceAfter: lIdx === lines.length - 1 ? 60 : 30
                  });
                });
              }
            } else {
              const firstLine = lines[0] || '';
              const firstRuns =
                buildNativeDocxRunsFromMathHtml(`${idx + 1}.`, { bold: true }) +
                `<w:r><w:tab/></w:r>` +
                buildNativeDocxRunsFromMathHtml(firstLine);
              bodyXml += makeParagraph(firstRuns, {
                align: 'both',
                leftTwips: qIndentTwips,
                hangingTwips: qIndentTwips,
                tabStopTwips: qIndentTwips,
                spaceBefore: 80,
                spaceAfter: lines.length > 1 ? 30 : 60
              });

              for (let lIdx = 1; lIdx < lines.length; lIdx++) {
                const line = lines[lIdx];
                const isNumLine = /^\d+\.\s+/.test(line);
                bodyXml += makeParagraph(buildNativeDocxRunsFromMathHtml(line), {
                  align: 'both',
                  leftTwips: qIndentTwips,
                  spaceBefore: !isNumLine && isPgk ? 60 : 0,
                  spaceAfter: lIdx === lines.length - 1 ? 60 : 30
                });
              }
            }

            if (q.bentukSoal === 'Menjodohkan' && Array.isArray(q.matchingPremises)) {
              const maxRows = Math.max(q.matchingPremises.length, (q.options || []).length);
              let tblRowsXml = `<w:tr>
                <w:tc><w:tcPr><w:tcW w:w="4200" w:type="dxa"/></w:tcPr>${makeParagraph(
                  buildNativeDocxRunsFromMathHtml(
                    useArDocx ? 'العبارات' : useEnDocx ? 'Statements' : 'Pernyataan',
                    { bold: true, underline: true }
                  ),
                  { spaceAfter: 40 }
                )}</w:tc>
                <w:tc><w:tcPr><w:tcW w:w="4200" w:type="dxa"/></w:tcPr>${makeParagraph(
                  buildNativeDocxRunsFromMathHtml(
                    useArDocx ? 'خيارات الإجابة' : useEnDocx ? 'Answer Choices' : 'Pilihan Jawaban',
                    { bold: true, underline: true }
                  ),
                  { spaceAfter: 40 }
                )}</w:tc>
              </w:tr>`;

              for (let r = 0; r < maxRows; r++) {
                const premRuns = q.matchingPremises[r]
                  ? buildNativeDocxRunsFromMathHtml(`${r + 1}.`, { bold: true }) +
                    `<w:r><w:tab/></w:r>` +
                    buildNativeDocxRunsFromMathHtml(cleanMatchingItemText(q.matchingPremises[r], true))
                  : '';
                const optRuns =
                  q.options && q.options[r]
                    ? buildNativeDocxRunsFromMathHtml(`${getOptionLabel(r, useArDocx)}.`, { bold: true }) +
                      `<w:r><w:tab/></w:r>` +
                      buildNativeDocxRunsFromMathHtml(cleanMatchingItemText(q.options[r], false))
                    : '';
                tblRowsXml += `<w:tr>
                  <w:tc><w:tcPr><w:tcW w:w="4200" w:type="dxa"/></w:tcPr>${makeParagraph(premRuns, {
                    leftTwips: 320,
                    hangingTwips: 320,
                    tabStopTwips: 320,
                    spaceAfter: 30
                  })}</w:tc>
                  <w:tc><w:tcPr><w:tcW w:w="4200" w:type="dxa"/></w:tcPr>${makeParagraph(optRuns, {
                    leftTwips: 320,
                    hangingTwips: 320,
                    tabStopTwips: 320,
                    spaceAfter: 30
                  })}</w:tc>
                </w:tr>`;
              }

              bodyXml += `<w:tbl><w:tblPr><w:tblInd w:w="${qIndentTwips}" w:type="dxa"/><w:tblBorders><w:top w:val="none"/><w:left w:val="none"/><w:bottom w:val="none"/><w:right w:val="none"/><w:insideH w:val="none"/><w:insideV w:val="none"/></w:tblBorders></w:tblPr>${tblRowsXml}</w:tbl>`;
            } else {
              const bLowerOpts = String(q.bentukSoal || '').toLowerCase();
              const isBSOpts = bLowerOpts.includes('benar') || bLowerOpts.includes('salah') || bLowerOpts.includes('true') || bLowerOpts.includes('false');
              const effectiveDocxOpts = isBSOpts
                ? useArDocx
                  ? ['صَحِيْحٌ', 'خَطَأٌ']
                  : useEnDocx
                  ? ['True', 'False']
                  : ['Benar', 'Salah']
                : Array.isArray(q.options) && q.options.length > 0
                ? q.options
                : [];

              if (effectiveDocxOpts.length > 0) {
                if (config.optionLayout === 'horizontal') {
                  let horizRuns = '';
                  effectiveDocxOpts.forEach((opt, oIdx) => {
                    const cleanOpt = cleanPgkNumbering(opt, isPgk);
                    horizRuns +=
                      buildNativeDocxRunsFromMathHtml(`${getOptionLabel(oIdx, useArDocx)}.  `, { bold: true }) +
                      buildNativeDocxRunsFromMathHtml(cleanOpt) +
                      buildNativeDocxRunsFromMathHtml('      ');
                  });
                  bodyXml += makeParagraph(horizRuns, {
                    leftTwips: qIndentTwips,
                    spaceAfter: 100
                  });
                } else {
                  const hangTwips = optHangingTwips;
                  const optLeftTotal = qIndentTwips + hangTwips;
                  effectiveDocxOpts.forEach((opt, oIdx) => {
                    const cleanOpt = cleanPgkNumbering(opt, isPgk);
                    const optRuns =
                      buildNativeDocxRunsFromMathHtml(`${getOptionLabel(oIdx, useArDocx)}.`, { bold: true }) +
                      `<w:r><w:tab/></w:r>` +
                      buildNativeDocxRunsFromMathHtml(cleanOpt);
                    bodyXml += makeParagraph(optRuns, {
                      align: 'both',
                      leftTwips: optLeftTotal,
                      hangingTwips: hangTwips,
                      tabStopTwips: optLeftTotal,
                      spaceAfter: oIdx === effectiveDocxOpts.length - 1 ? 100 : 40
                    });
                  });
                }
              }
            }

            const bLowerDocx = String(q.bentukSoal || '').toLowerCase();

  const handleDownloadPDF = async () => {
    if (!finalQuiz) return;
    setShowExportMenu(false);
    showToast('Sedang menyiapkan & mengunduh file PDF...', 'info');

    let hiddenHost = null;
    try {
      if (!window.html2canvas) {
        await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      }
      if (!(window.jspdf && window.jspdf.jsPDF) && !window.jsPDF) {
        await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      }

      const JsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      if (!JsPDFClass || typeof window.html2canvas !== 'function') {
        throw new Error('Pustaka PDF belum siap.');
      }

      hiddenHost = document.createElement('div');
      hiddenHost.style.position = 'fixed';
      hiddenHost.style.left = '0';
      hiddenHost.style.top = '0';
      hiddenHost.style.width = '0';
      hiddenHost.style.height = '0';
      hiddenHost.style.overflow = 'hidden';
      hiddenHost.style.zIndex = '-9999';
      hiddenHost.style.pointerEvents = 'none';

      const renderStage = document.createElement('div');
      renderStage.style.width = '794px';
      renderStage.style.background = '#ffffff';
      renderStage.style.color = '#000000';
      hiddenHost.appendChild(renderStage);
      document.body.appendChild(hiddenHost);

      const sectionsHtml = [
        buildExamPaperHtmlForExport(),
        buildAnswerKeyHtmlForExport(),
        buildKisiKisiHtmlForExport(),
        buildKartuSoalHtmlForExport()
      ].filter(Boolean);

      const safeSubj = (config.subject || 'Soal_MI').replace(/[^a-zA-Z0-9]+/g, '_');
      const filename = `Soal_MI_KKMI_Wonomerto_${safeSubj}.pdf`;

      const pdf = new JsPDFClass({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4',
        compress: true
      });

      const pageWidthMm = 210;
      const pageHeightMm = 297;
      const marginMm = 10;
      const contentWidthMm = pageWidthMm - marginMm * 2;
      const contentHeightMm = pageHeightMm - marginMm * 2;

      let isFirstSectionPage = true;

      for (let sIdx = 0; sIdx < sectionsHtml.length; sIdx++) {
        renderStage.innerHTML = `<div style="width:794px;padding:24px 36px;background:#ffffff;color:#000000;font-family:'Times New Roman',serif;font-size:11pt;line-height:1.45;box-sizing:border-box;">${sectionsHtml[sIdx]}</div>`;
        const targetEl = renderStage.firstElementChild;
        if (!targetEl) continue;

        const imgs = Array.from(targetEl.querySelectorAll('img'));
        await Promise.all(
          imgs.map(
            (img) =>
              new Promise((res) => {
                if (img.complete) return res();
                img.onload = res;
                img.onerror = res;
              })
          )
        );

        await new Promise((r) => setTimeout(r, 60));

        const canvas = await window.html2canvas(targetEl, {
          scale: 1.6,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: '#ffffff',
          width: 794,
          windowWidth: 794,
          scrollX: 0,
          scrollY: 0
        });

        if (!canvas || canvas.width === 0 || canvas.height === 0) continue;

        const pageCanvasHeightPx = Math.max(1, Math.floor((canvas.width * contentHeightMm) / contentWidthMm));
        let renderedHeightPx = 0;

        while (renderedHeightPx < canvas.height) {
          if (!isFirstSectionPage) {
            pdf.addPage();
          }
          isFirstSectionPage = false;

          const sliceHeightPx = Math.min(pageCanvasHeightPx, canvas.height - renderedHeightPx);
          if (sliceHeightPx <= 0) break;

          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = canvas.width;
          pageCanvas.height = sliceHeightPx;

          const ctx = pageCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
          ctx.drawImage(
            canvas,
            0,
            renderedHeightPx,
            canvas.width,
            sliceHeightPx,
            0,
            0,
            canvas.width,
            sliceHeightPx
          );

          const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
          const sliceHeightMm = (sliceHeightPx * contentWidthMm) / canvas.width;

          pdf.addImage(imgData, 'JPEG', marginMm, marginMm, contentWidthMm, sliceHeightMm);
          renderedHeightPx += sliceHeightPx;
        }
      }

      if (hiddenHost && hiddenHost.parentNode) {
        hiddenHost.parentNode.removeChild(hiddenHost);
        hiddenHost = null;
      }

      const pdfBlob = pdf.output('blob');
      const blobUrl = URL.createObjectURL(pdfBlob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);

      showToast('File PDF berhasil diunduh!', 'success');
    } catch (err) {
      if (hiddenHost && hiddenHost.parentNode) {
        hiddenHost.parentNode.removeChild(hiddenHost);
      }
      showToast(`Gagal mengunduh PDF: ${err?.message || 'Silakan coba lagi.'}`, 'error');
    }
  };

  const stripHtmlForPlainText = (str) => {
    if (!str) return '';
    return String(str)
      .replace(/⟦MATRIX:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, mType, rowsStr) => {
        const rows = String(rowsStr || '')
          .split(';;')
          .map((r) =>
            r
              .split('&')
              .map((c) => c.trim())
              .join(', ')
          )
          .join('; ');
        return `[${rows}]`;
      })
      .replace(/⟦FRAC:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, '($1/$2)')
      .replace(/⟦SQRT:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, r, i) => (i ? `${i}√(${r})` : `√(${r})`))
      .replace(/<sup>(.*?)<\/sup>/gi, '^($1)')
      .replace(/<sub>(.*?)<\/sub>/gi, '_($1)')
      .replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1/$2)')
      .replace(/\\sqrt\s*\{([^{}]+)\}/g, '√($1)')
      .replace(/<[^>]+>/g, '')
      .replace(/&#8407;/g, '⃗')
      .replace(/&#770;/g, '̂')
      .replace(/&radic;/g, '√')
      .replace(/&times;/g, '×')
      .replace(/&divide;/g, '÷')
      .replace(/&bull;/g, '•')
      .trim();
  };

  const handleGenerateGoogleFormScript = () => {
    if (!finalQuiz) return;
    setShowExportMenu(false);

    const formTitle = `Ujian MI ${config.subject}${config.assessmentType ? ' - ' + config.assessmentType : ''} (${config.grade || 'MI'}) - KKMI Wonomerto`;
    const questionsPayload = finalQuiz.questions.map((q, idx) => {
      const cleanQ = stripHtmlForPlainText(normalizeBrokenMathNotation(q.question));
      const opts = Array.isArray(q.options)
        ? q.options.map((o) => stripHtmlForPlainText(normalizeBrokenMathNotation(o)))
        : [];
      const correctIdx = isMultipleChoice(q) ? resolveCorrectOptionIndex(q) : 0;
      const isPgk = String(q.bentukSoal || '').toLowerCase().includes('kompleks');
      let correctIndices = [correctIdx];
      if (isPgk && opts.length >= 2) {
        const matched = [...String(q.answer || '').matchAll(/\b([A-E])\b/gi)]
          .map((m) => m[1].toUpperCase().charCodeAt(0) - 65)
          .filter((i) => i >= 0 && i < opts.length);
        correctIndices = matched.length >= 2 ? [...new Set(matched)] : [0, 1];
      }
      const explanation = stripHtmlForPlainText(normalizeBrokenMathNotation(q.explanation || ''));
      return {
        no: idx + 1,
        type: q.bentukSoal || 'PG',
        question: cleanQ,
        options: opts,
        correctIndex: correctIdx,
        correctIndices,
        answerText: stripHtmlForPlainText(normalizeBrokenMathNotation(q.answer || '')),
        explanation
      };
    });

    const scriptCode = `function createKkmiWonomertoGoogleForm() {
  var form = FormApp.create(${JSON.stringify(formTitle)});
  form.setDescription(${JSON.stringify(`KKMI Kecamatan Wonomerto | Mapel: ${config.subject} | Jenjang: MI ${config.grade} | Kurikulum: ${config.curriculum}`)});
  form.setIsQuiz(true);
  form.setCollectEmail(true);

  var ss = SpreadsheetApp.create(${JSON.stringify(formTitle + ' (Rekap Nilai Siswa)')});
  form.setDestination(FormApp.DestinationType.SPREADSHEET, ss.getId());

  var namaItem = form.addTextItem();
  namaItem.setTitle('Nama Lengkap Peserta Didik').setRequired(true);

  var kelasItem = form.addTextItem();
  kelasItem.setTitle('Kelas / Asal Madrasah (MI)').setRequired(true);

  var questions = ${JSON.stringify(questionsPayload, null, 2)};
  var pointsPerQuestion = Math.max(1, Math.round(100 / questions.length));

  questions.forEach(function(q) {
    if (q.options && q.options.length >= 2 && q.type === 'PG Kompleks') {
      var cbItem = form.addCheckboxItem();
      cbItem.setTitle(q.no + '. [PG Kompleks - Pilih Lebih dari Satu] ' + q.question);
      cbItem.setPoints(pointsPerQuestion);
      cbItem.setRequired(true);

      var cbChoices = q.options.map(function(optText, idx) {
        var isCorrect = (q.correctIndices && q.correctIndices.indexOf(idx) !== -1);
        return cbItem.createChoice(optText, isCorrect);
      });
      cbItem.setChoices(cbChoices);
    } else if (q.options && q.options.length >= 2 && q.type === 'PG') {
      var item = form.addMultipleChoiceItem();
      item.setTitle(q.no + '. ' + q.question);
      item.setPoints(pointsPerQuestion);
      item.setRequired(true);

      var choices = q.options.map(function(optText, idx) {
        var isCorrect = (idx === q.correctIndex);
        return item.createChoice(optText, isCorrect);
      });
      item.setChoices(choices);
    } else {
      var pItem = form.addParagraphTextItem();
      pItem.setTitle(q.no + '. [' + q.type + '] ' + q.question);
      pItem.setPoints(pointsPerQuestion);
      pItem.setRequired(true);
    }
  });

  Logger.log('Link Google Form: ' + form.getPublishedUrl());
  Logger.log('Link Spreadsheet Rekap: ' + ss.getUrl());
}`;

    setGoogleFormScriptModal(scriptCode);

  const handleExportQuizJson = () => {

      showToast('Belum ada naskah soal untuk diekspor ke JSON.', 'error');
      return;
    }
    setShowExportMenu(false);
    try {
      const exportPayload = {
        app: 'Generate Soal KKMI Wonomerto',
        version: '2.0',
        exportedAt: new Date().toISOString(),
        config,
        finalQuiz: {
          title: finalQuiz.title || `Naskah Ujian MI ${config.subject || ''}`.trim(),
          questions: finalQuiz.questions
        },
        generatedImages,
        customImagePrompts,
        stimulusByQuestion
      };

      const jsonString = JSON.stringify(exportPayload, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const safeSubj = (config.subject || 'Soal_MI').replace(/[^a-zA-Z0-9]+/g, '_');
      const a = document.createElement('a');
      a.href = url;
      a.download = `KKMI_Wonomerto_${safeSubj}_${finalQuiz.questions.length}Soal.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      showToast('File JSON berhasil diunduh! Anda dapat mengimpornya kembali kapan saja.', 'success');
    } catch (err) {
      showToast('Gagal mengekspor file JSON.', 'error');
    }
  };

  const handleImportQuizJsonFile = async (e) => {

      const parsed = JSON.parse(rawText);

      const importedConfig =
        parsed?.config && typeof parsed.config === 'object'
          ? { ...config, ...parsed.config, level: 'MI' }
          : { ...config, level: 'MI' };
      const rawQuizObj = parsed?.finalQuiz
        ? parsed.finalQuiz
        : Array.isArray(parsed?.questions)
        ? { title: parsed.title || 'Naskah Ujian MI', questions: parsed.questions }
        : Array.isArray(parsed)
        ? { title: 'Naskah Ujian MI', questions: parsed }
        : null;

      if (!rawQuizObj || !Array.isArray(rawQuizObj.questions) || rawQuizObj.questions.length === 0) {
        throw new Error('Struktur file JSON tidak valid atau tidak memuat daftar soal.');

      setConfig(importedConfig);

      const loadedStim = parsed?.stimulusByQuestion && typeof parsed.stimulusByQuestion === 'object' ? parsed.stimulusByQuestion : {};

      setFinalQuiz(loadedQuizObj);

      setActiveTab('naskah');

      showToast(`Berhasil mengimpor ${validatedQuestions.length} butir soal dari file JSON!`, 'success');

      showToast(`Gagal mengimpor file JSON: ${err?.message || 'Format file tidak sesuai.'}`, 'error');

                                          }}
                                        />
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              </div>
                            ) : (
                              (() => {
                                const bLowUi = rawBentuk.toLowerCase();
                                const isBSUi =
                                  bLowUi.includes('benar') ||
                                  bLowUi.includes('salah') ||
                                  bLowUi.includes('true') ||
                                  bLowUi.includes('false');
                                const isPgkUi = bLowUi.includes('kompleks');
                                const uiOpts = isBSUi
                                  ? useArUi
                                    ? ['صَحِيْحٌ', 'خَطَأٌ']
                                    : isEnglishActive()
                                    ? ['True', 'False']
                                    : ['Benar', 'Salah']
                                  : Array.isArray(q.options) && q.options.length > 0
                                  ? q.options.map((o) => cleanPgkNumbering(o, isPgkUi))
                                  : [];
                                if (uiOpts.length === 0) return null;
                                return (
                                  <div
                                    dir={useArUi ? 'rtl' : 'ltr'}
                                    className={
                                      config.optionLayout === 'horizontal'
                                        ? 'flex flex-wrap gap-x-8 gap-y-2 pt-1'
                                        : 'space-y-2 pt-1'
                                    }
                                  >
                                    {uiOpts.map((opt, oIdx) => (
                                      <div
                                        key={oIdx}
                                        className="flex items-center gap-3 text-sm sm:text-base text-slate-700"
                                      >
                                        <span className="font-bold text-slate-800 w-5 shrink-0">
                                          {getOptionLabel(oIdx, useArUi)}.
                                        </span>
                                        <span
                                          dangerouslySetInnerHTML={{
                                            __html: formatMathHtml(opt)
                                          }}
                                        />
                                      </div>
                                    ))}
                                  </div>
                                );
                              })()
                            )}
                          </div>
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: KUNCI JAWABAN & PEMBAHASAN */}
            {activeTab === 'kunci' && (() => {
              const scoringInfo = calculateQuizScoringDetails(finalQuiz.questions);
              return (
                <div className="space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 print:hidden">
                    <div>
                      <h3 className="text-sm font-extrabold text-slate-800">
                        Kunci Jawaban, Bobot Penilaian &amp; Pembahasan Lengkap
                      </h3>
                      <p className="text-xs text-slate-500">
                        Dilengkapi rincian bobot per bentuk soal dan konversi nilai akhir (Skala 0–100).
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() =>
                        copyRichHtmlToClipboard(
                          buildAnswerKeyHtmlForExport(),
                          'Kunci jawaban, bobot skor & pembahasan berhasil disalin!'
                        )
                      }
                      className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
                    >
                      <Copy size={14} />
                      <span>Salin Kunci &amp; Pembahasan</span>
                    </button>
                  </div>

                  <div className="p-4 sm:p-5 rounded-2xl bg-emerald-50/60 border border-emerald-200/80 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="text-xs font-extrabold text-emerald-900 uppercase tracking-wider">
                        📊 Pedoman Penskoran &amp; Distribusi Bobot Nilai (Skala 100)
                      </div>
                      <span className="px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold">
                        Total Nilai Akhir = 100 Poin
                      </span>
                    </div>

                    <div className="overflow-x-auto rounded-xl border border-emerald-200 bg-white">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-emerald-100/70 text-emerald-950 font-bold border-b border-emerald-200">
                            <th className="p-2.5 text-center">Bentuk Soal</th>
                            <th className="p-2.5 text-center">Jumlah Soal</th>
                            <th className="p-2.5 text-center">Bobot / Butir</th>
                            <th className="p-2.5 text-center">Total Skor Mentah</th>
                            <th className="p-2.5 text-center">Total Skor Konversi (Skala 100)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-emerald-100">
                          {scoringInfo.summaryByType.map((s, sIdx) => (
                            <tr key={sIdx} className="hover:bg-emerald-50/40">
                              <td className="p-2.5 text-center font-bold text-slate-800">{s.bentukSoal}</td>
                              <td className="p-2.5 text-center text-slate-700">{s.count} Soal</td>
                              <td className="p-2.5 text-center font-semibold text-slate-700">{s.rawWeightPerItem}</td>
                              <td className="p-2.5 text-center font-semibold text-slate-700">{s.totalRawWeight}</td>
                              <td className="p-2.5 text-center font-extrabold text-emerald-700">
                                {s.totalScaledScore} Poin
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {finalQuiz.questions.map((q, idx) => {
                      const isMatching = String(q.bentukSoal || '').toLowerCase().includes('jodoh');
                      const displayAns = isMatching
                        ? formatMatchingAnswerKey(q.answer, q.matchingPremises, q.options)
                        : q.answer || '-';
                      const typeLabel = String(q.bentukSoal || 'PG').toUpperCase();
                      const itemScore = scoringInfo.items[idx] || { rawWeight: 1, scaledScore: 1, rubricNote: '' };

                      return (
                        <div
                          key={idx}
                          className="p-4 sm:p-5 rounded-2xl bg-slate-50/80 border border-slate-200/80 space-y-2 print:break-inside-avoid"
                        >
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <span className="text-xs font-extrabold text-slate-800 uppercase">
                              Soal No. {idx + 1} [{typeLabel}]
                            </span>
                            <div className="flex flex-wrap items-center gap-1.5">
                              <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-extrabold">
                                Bobot: {itemScore.rawWeight} &bull; Skor Maks: {itemScore.scaledScore} Poin
                              </span>
                              <span className="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[11px] font-bold">
                                {q.bloomLevel || 'C3'}
                              </span>
                            </div>
                          </div>
                          <div className="text-xs sm:text-sm font-bold text-emerald-700">
                            <span>Kunci Jawaban: </span>
                            <span dangerouslySetInnerHTML={{ __html: formatMathHtml(displayAns) }} />
                          </div>
                          <div className="text-xs sm:text-sm text-slate-700 leading-relaxed">
                            <span className="font-bold text-slate-800">Pembahasan: </span>
                            <span dangerouslySetInnerHTML={{ __html: formatMathHtml(q.explanation || '-') }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {/* TAB 3: KISI-KISI & ANALISIS */}
            {activeTab === 'kisikisi' && (
              <div className="space-y-5">
                <div className="flex justify-end print:hidden">
                  <button
                    type="button"
                    onClick={() =>
                      copyRichHtmlToClipboard(
                        buildKisiKisiHtmlForExport(),
                        'Tabel Kisi-Kisi berhasil disalin!'
                      )
                    }
                    className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
                  >
                    <Copy size={14} />
                    <span>Salin Tabel Kisi-Kisi</span>
                  </button>
                </div>

                <div className="overflow-x-auto rounded-2xl border border-slate-200">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                        <th className="p-3 text-center w-12">No</th>
                        <th className="p-3">Capaian Pembelajaran (CP)</th>
                        <th className="p-3">Tujuan Pembelajaran (TP)</th>
                        <th className="p-3">Materi Pokok</th>
                        <th className="p-3">Indikator Soal</th>
                        <th className="p-3 text-center">Level</th>
                        <th className="p-3 text-center">Bentuk Soal</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {finalQuiz.questions.map((q, idx) => (
                        <tr key={idx} className="hover:bg-slate-50/80">
                          <td className="p-3 text-center font-bold text-slate-700">{idx + 1}</td>
                          <td className="p-3 text-slate-700" dangerouslySetInnerHTML={{ __html: formatMathHtml(q.cp || '-') }} />
                          <td className="p-3 text-slate-700" dangerouslySetInnerHTML={{ __html: formatMathHtml(q.tp || '-') }} />
                          <td className="p-3 text-slate-700 font-medium" dangerouslySetInnerHTML={{ __html: formatMathHtml(q.materi || config.topic) }} />
                          <td className="p-3 text-slate-700" dangerouslySetInnerHTML={{ __html: formatMathHtml(q.indicator || '-') }} />
                          <td className="p-3 text-center">
                            <span className="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 font-bold">
                              {q.bloomLevel || 'C3'}
                            </span>
                          </td>
                          <td className="p-3 text-center font-semibold text-slate-700">{q.bentukSoal || 'PG'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 4: ANALISIS BUTIR SOAL */}
            {activeTab === 'analisisbutir' && (() => {
              const itemMetrics = finalQuiz.questions.map((q, idx) => analyzeQuestionItemMetrics(q, idx));
              return (
                <div className="space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 print:hidden">
                    <h3 className="text-sm font-extrabold text-slate-800">
                      Analisis Kualitas &amp; Psikometrik Butir Soal MI
                    </h3>
                    <button
                      type="button"
                      onClick={() =>
                        copyRichHtmlToClipboard(
                          buildAnalisisButirSoalHtmlForExport(),
                          'Tabel Analisis Butir Soal berhasil disalin!'
                        )
                      }
                      className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
                    >
                      <Copy size={14} />
                      <span>Salin Analisis Butir Soal</span>
                    </button>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-slate-200">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                          <th className="p-3 text-center w-12">No</th>
                          <th className="p-3">Bentuk Soal</th>
                          <th className="p-3">Level Taksonomi</th>
                          <th className="p-3 text-center">Tingkat Kesukaran</th>
                          <th className="p-3 text-center">Indeks P</th>
                          <th className="p-3 text-center">Daya Pembeda (D)</th>
                          <th className="p-3 text-center">Status Validitas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {itemMetrics.map((m) => (
                          <tr key={m.no} className="hover:bg-slate-50/80">
                            <td className="p-3 text-center font-bold text-slate-700">{m.no}</td>
                            <td className="p-3 font-semibold text-slate-700">{m.bentuk}</td>
                            <td className="p-3">
                              <span className="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 font-bold">
                                {m.level}
                              </span>
                            </td>
                            <td className="p-3 text-center font-bold">{m.category}</td>
                            <td className="p-3 text-center font-mono font-bold text-slate-700">{m.pIndex.toFixed(2)}</td>
                            <td className="p-3 text-center font-mono font-bold text-slate-800">{m.dIndex.toFixed(2)}</td>
                            <td className="p-3 text-center">
                              <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 font-bold text-[11px]">
                                <Check size={12} />
                                {m.constructValidity}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })()}

            {/* TAB 5: KARTU SOAL */}
            {activeTab === 'kartusoal' && (
              <div className="space-y-5">
                <div className="flex justify-end print:hidden">
                  <button
                    type="button"
                    onClick={() =>
                      copyRichHtmlToClipboard(
                        buildKartuSoalHtmlForExport(),
                        'Kartu soal berhasil disalin!'
                      )
                    }
                    className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all"
                  >
                    <Copy size={14} />
                    <span>Salin Semua Kartu Soal</span>
                  </button>
                </div>

                <div className="space-y-6">
                  {finalQuiz.questions.map((q, idx) => {
                    const isPgk = String(q.bentukSoal || '').toLowerCase().includes('kompleks');
                    const cardOptions = Array.isArray(q.options) ? q.options : [];
                    return (
                      <div
                        key={idx}
                        className="rounded-2xl border border-slate-200 overflow-hidden bg-white shadow-xs print:break-inside-avoid"
                      >
                        <div className="bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex items-center justify-between">
                          <span className="text-xs font-extrabold text-slate-800 uppercase">
                            KARTU SOAL MI NOMOR {idx + 1} ({String(q.bentukSoal || 'PG').toUpperCase()})
                          </span>
                          <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">
                            {q.bloomLevel || 'C3'}
                          </span>
                        </div>
                        <div className="p-4 sm:p-5 space-y-3 text-xs sm:text-sm">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pb-3 border-b border-slate-100">
                            <div>
                              <span className="font-bold text-slate-600">Mata Pelajaran: </span>
                              <span className="text-slate-800">{config.subject}</span>
                            </div>
                            <div>
                              <span className="font-bold text-slate-600">Jenjang / Kelas: </span>
                              <span className="text-slate-800">MI &mdash; {config.grade} ({config.curriculum})</span>
                            </div>
                          </div>

                          <div className="space-y-2">
                            <div className="font-bold text-slate-700">Rumusan Butir Soal:</div>
                            <div
                              className="text-slate-800 whitespace-pre-line leading-relaxed text-justify"
                              dangerouslySetInnerHTML={{
                                __html: formatMathHtml(cleanPgkNumbering(q.question || '', false))
                              }}
                            />
                            {cardOptions.length > 0 && (
                              <div className="space-y-1 pt-1 pl-2">
                                {cardOptions.map((opt, oIdx) => (
                                  <div key={oIdx} className="flex gap-2 text-slate-700">
                                    <span className="font-bold">{String.fromCharCode(65 + oIdx)}.</span>
                                    <span
                                      dangerouslySetInnerHTML={{
                                        __html: formatMathHtml(cleanPgkNumbering(opt, isPgk))
                                      }}
                                    />
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>

                          <div className="pt-3 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div className="bg-emerald-50/70 border border-emerald-200/70 p-3 rounded-xl">
                              <div className="text-[11px] font-bold text-emerald-800 uppercase">Kunci Jawaban</div>
                              <div
                                className="font-bold text-emerald-700 mt-0.5"
                                dangerouslySetInnerHTML={{ __html: formatMathHtml(q.answer || '-') }}
                              />
                            </div>
                            <div className="sm:col-span-2 bg-slate-50 border border-slate-200/70 p-3 rounded-xl">
                              <div className="text-[11px] font-bold text-slate-500 uppercase">Pembahasan</div>
                              <div
                                className="text-slate-700 mt-0.5 leading-relaxed"
                                dangerouslySetInnerHTML={{ __html: formatMathHtml(q.explanation || '-') }}
                              />
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </main>
      )}
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
