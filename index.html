    // Adapter ikon Lucide agar kompatibel di GitHub Pages tanpa bundler
    const createLucideIcon = (iconName) => {
      return function LucideIcon({ size = 24, className = '', ...props }) {
        const spanRef = useRef(null);
        useEffect(() => {
          if (spanRef.current && window.lucide && window.lucide.icons[iconName]) {
            const svgEl = window.lucide.createElement(window.lucide.icons[iconName]);
            svgEl.setAttribute('width', size);
            svgEl.setAttribute('height', size);
            if (className) svgEl.setAttribute('class', className);
            spanRef.current.innerHTML = '';
            spanRef.current.appendChild(svgEl);
          }
        }, [size, className]);
        return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
      };
    };

      const exportMenuRef = useRef(null);

      const showToast = (message, type = 'info') => {

      // ============================================================================
      // HANDLER LOGIN, LOGOUT & CRUD AKUN PENGGUNA (ADMIN)
      // ============================================================================
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const uname = String(loginUsername || '').trim().toLowerCase();
        const pwd = String(loginPassword || '').trim();

        if (!uname || !pwd) {
          setLoginError('Masukkan username dan password terlebih dahulu.');
          return;
        }

        const found = accounts.find(
          (acc) =>
            String(acc.username || '').trim().toLowerCase() === uname &&
            String(acc.password || '').trim() === pwd

        if (!found) {
          setLoginError('Username atau password salah. Silakan periksa kembali.');
          return;
        }

        setLoginError('');
        setCurrentUser(found);
        setLoginUsername('');
        setLoginPassword('');

        setConfig((prev) => ({
          ...prev,
          level: 'MI',
          teacherName: prev.teacherName || (found.role === 'user' ? found.fullName : prev.teacherName),
          schoolName: prev.schoolName || (found.madrasah && found.madrasah !== 'KKMI Kecamatan Wonomerto' ? found.madrasah : prev.schoolName)

        showToast(`Selamat datang, ${found.fullName}!`, 'success');

          showToast('Nama Lengkap, Username, dan Password wajib diisi.', 'error');
          return;
        }

        const isDuplicate = accounts.some(
          (acc) =>
            String(acc.username || '').trim().toLowerCase() === username &&
            acc.id !== editingAccountId
        );
        if (isDuplicate) {
          showToast(`Username "${username}" sudah digunakan akun lain.`, 'error');
          return;
        }

        if (editingAccountId) {
          setAccounts((prev) =>
            prev.map((acc) =>
              acc.id === editingAccountId
                ? { ...acc, fullName, madrasah, username, password, role }
                : acc
            )
          );
          if (currentUser && currentUser.id === editingAccountId) {
            setCurrentUser((prev) => ({ ...prev, fullName, madrasah, username, password, role }));

          showToast(`Akun "${username}" berhasil diperbarui!`, 'success');
        } else {
          const newAcc = {
            id: `usr-${Date.now()}`,

            madrasah: madrasah || 'MI Kecamatan Wonomerto',

            password,
            role,
            createdAt: new Date().toISOString().slice(0, 10)

          showToast(`Akun baru "${username}" berhasil ditambahkan!`, 'success');

        resetAccountForm();

      const handleStartEditAccount = (acc) => {
        setEditingAccountId(acc.id);
        setAccountForm({
          fullName: acc.fullName || '',
          madrasah: acc.madrasah || '',
          username: acc.username || '',

      const handleDeleteAccount = (accId) => {
        if (currentUser && currentUser.id === accId) {
          showToast('Tidak dapat menghapus akun yang sedang digunakan login saat ini.', 'error');
          setConfirmDeleteAccountId(null);
          return;
        }
        const target = accounts.find((a) => a.id === accId);
        setAccounts((prev) => prev.filter((a) => a.id !== accId));
        if (editingAccountId === accId) {
          resetAccountForm();
        }
        setConfirmDeleteAccountId(null);
        showToast(`Akun "${target?.username || ''}" berhasil dihapus.`, 'success');
      };

      // ============================================================================
      // HELPER DETEKSI BAHASA, JENJANG & FORMATTER RUMUS / SOAL
      // ============================================================================
      const isArabicActive = (cfg = config) => {
        const c = cfg || config;
        return c?.language === 'ar';
      };

      const isEnglishActive = (cfg = config) => {
        const c = cfg || config;
        if (isArabicActive(c)) return false;
        return (
          c?.language === 'en' ||
          (c?.language !== 'id' && /bahasa inggris|english/i.test(String(c?.subject || '')))
        );
      };

      const getOptionLabel = (idx, useArabic = false) => {
        if (useArabic) {
          const arLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
          return arLetters[idx] || String.fromCharCode(65 + idx);
        }
        return String.fromCharCode(65 + idx);
      };

      const cleanMatchingItemText = (text = '', isPremise = true) => {
        if (!text) return '';
        let s = String(text).trim();
        if (isPremise) {
          for (let i = 0; i < 3; i++) {
            const next = s.replace(/^\s*(?:\(\d+\)|\(\s*[٠-٩]+\s*\)|\d+[\.\)\-:]\s+|[٠-٩]+[\.\)\-:]\s+)/, '').trim();
            if (next === s) break;
            s = next;
          }
        } else {
          for (let i = 0; i < 3; i++) {
            const next = s
              .replace(/^\s*(?:\([A-Ja-j]\)|[A-Ja-j][\.\)\-:]\s+|\(?[أبجدهوزحطي][\.\)\-:]\s*)/, '')
              .trim();
            if (next === s) break;
            s = next;
          }
        }
        return s;
      };

      const translateSubjectToEn = (subj = '') => {

      const translateSubjectToAr = (subj = '') => {
        const s = String(subj || '').trim();
        const map = {
          'Bahasa Arab': 'اللُّغَةُ العَرَبِيَّةُ',
          "Al-Qur'an Hadis": 'القُرْآنُ وَالحَدِيْثُ',
          'Akidah Akhlak': 'العَقِيْدَةُ وَالأَخْلَاقُ',
          'Fikih': 'الفِقْهُ',
          'Sejarah Kebudayaan Islam (SKI)': 'تَارِيْخُ الثَّقَافَةِ الإِسْلَامِيَّةِ',
          'Matematika': 'الرِّيَاضِيَّاتُ',
          'IPA': 'العُلُوْمُ الطَّبِيْعِيَّةُ',
          'IPS': 'العُلُوْمُ الاجْتِمَاعِيَّةُ',
          'IPAS (Ilmu Pengetahuan Alam dan Sosial)': 'العُلُوْمُ الطَّبِيْعِيَّةُ وَالاجْتِمَاعِيَّةُ'
        };
        return map[s] || s;

      const translateAssessmentToEn = (assess = '') => {
        const a = String(assess || '').trim();
        if (a.includes('Penilaian Harian')) return 'Daily Assessment (PH)';
        if (a.includes('STS')) return 'Mid-Semester Summative Assessment (STS)';
        if (a.includes('SAS')) return 'Final Semester Summative Assessment (SAS)';
        if (a === 'TKA') return 'Academic Ability Test (TKA)';
        if (a === 'OSN') return 'National Science Olympiad (OSN)';
        if (a === 'OMI') return 'Indonesian Madrasah Olympiad (OMI)';

      const translateAssessmentToAr = (assess = '') => {
        const a = String(assess || '').trim();
        if (a.includes('Penilaian Harian')) return 'التَّقْيِيْمُ اليَوْمِيُّ';
        if (a.includes('STS')) return 'اخْتِبَارُ مُنْتَصَفِ الفَصْلِ الدِّرَاسِيِّ';
        if (a.includes('SAS')) return 'اخْتِبَارُ نِهَايَةِ الفَصْلِ الدِّرَاسِيِّ';

        if (a === 'OSN') return 'أُولِمْبِيَادُ العُلُوْمِ الوَطَنِيُّ';
        if (a === 'OMI') return 'أُولِمْبِيَادُ المَدَارِسِ الإِسْلَامِيَّةِ';

      const translateGradeToEn = (grd = '') => String(grd || '').replace(/^Kelas\s+/i, 'Grade ');

      const translateBentukSoalToEn = (bentuk = '') => {
        const b = String(bentuk || '').toLowerCase();

        if (b.includes('jodoh')) return 'Matching';
        if (b.includes('benar') || b.includes('salah') || b.includes('true')) return 'True / False';
        if (b.includes('isian') || b.includes('singkat')) return 'Short Answer';
        if (b.includes('uraian') || b.includes('esai')) return 'Essay';

      };

      const translateBentukSoalToAr = (bentuk = '') => {
        const b = String(bentuk || '').toLowerCase();
        if (b.includes('kompleks')) return 'اخْتِيَارٌ مُتَعَدِّدٌ مُرَكَّبٌ';
        if (b.includes('jodoh')) return 'المُطَابَقَةُ وَالتَّوْصِيْلُ';

        return 'اخْتِيَارٌ مِنْ مُتَعَدِّدٍ';
      };

      const extractBalancedBraceGroup = (str, openBraceIdx) => {
        if (!str || str[openBraceIdx] !== '{') return null;
        let depth = 0;
        for (let i = openBraceIdx; i < str.length; i++) {
          const ch = str[i];
          if (ch === '{') depth++;
          else if (ch === '}') {
            depth--;
            if (depth === 0) {
              return { content: str.slice(openBraceIdx + 1, i), endIndex: i + 1 };
            }
          }
        }
        return null;
      };

      const convertLatexConstructsToTokens = (inputStr = '') => {
        let s = String(inputStr || '')
          .replace(/\{2,}(?=[a-zA-Z])/g, '\')
          .replace(/(?:\+|\/)+(?:d?frac|tfrac|cfrac|fraq|farc) /gi, '\frac')
          .replace(/ (?:d?frac|tfrac|cfrac|fraq|farc)\s*(?=\{)/gi, '\frac')
          .replace(/(?:\+|\/)+sqrt /gi, '\sqrt');

        for (let pass = 0; pass < 8; pass++) {
          const sqrtRegex = /\sqrt\s*(?:\[([^\[\]]*)\])?\s*\{/g;
          const match = sqrtRegex.exec(s);
          if (!match) break;
          const grp = extractBalancedBraceGroup(s, match.index + match[0].length - 1);
          if (!grp) break;
          s = s.slice(0, match.index) + `⟦SQRT:${grp.content.trim()}::${(match[1] || '').trim()}⟧` + s.slice(grp.endIndex);
        }

        s = s
          .replace(/√\s*\{([^{}]+)\}/g, '⟦SQRT:$1::⟧')
          .replace(/√\s*\(([^()]+)\)/g, '⟦SQRT:$1::⟧')
          .replace(/√\s*([0-9a-zA-Zπθαβ]+)/g, '⟦SQRT:$1::⟧');

        for (let pass = 0; pass < 10; pass++) {
          const fracRegex = /\*\frac\s*\{/g;
          const match = fracRegex.exec(s);
          if (!match) break;
          const numGrp = extractBalancedBraceGroup(s, match.index + match[0].length - 1);
          if (!numGrp) break;
          let afterNumIdx = numGrp.endIndex;
          while (afterNumIdx < s.length && /\s/.test(s[afterNumIdx])) afterNumIdx++;
          if (s[afterNumIdx] === '{') {
            const denGrp = extractBalancedBraceGroup(s, afterNumIdx);
            if (denGrp) {
              s = s.slice(0, match.index) + `⟦FRAC:${numGrp.content.trim()}::${denGrp.content.trim()}⟧` + s.slice(denGrp.endIndex);
              continue;
            }
          }
          break;
        }
        return s;
      };

      const normalizeBrokenMathNotation = (input = '') => {
        if (input === null || input === undefined) return '';
        let s = String(input)
          .replace(/\r\n/g, '
')
          .replace(/\n/g, '
')
          .replace(/\\[([\s\S]*?)\\]/g, '$1')
          .replace(/\\(([\s\S]*?)\\)/g, '$1')
          .replace(/\$\$([\s\S]*?)\$\$/g, '$1')
          .replace(/\$([^$
]+)\$/g, '$1')
          .replace(/\(?:text|mathrm|operatorname|mbox)\s*\{([^{}]*)\}/g, '$1');

        s = convertLatexConstructsToTokens(s);
        s = s
          .replace(/(?:\+|\/)times /g, '×')
          .replace(/(?:\+|\/)div /g, '÷')
          .replace(/(?:\+|\/)pm /g, '±')
          .replace(/(?:\+|\/)cdot /g, '·')
          .replace(/(?:\+|\/)(?:leq|le) /g, '≤')
          .replace(/(?:\+|\/)(?:geq|ge) /g, '≥')
          .replace(/(?:\+|\/)(?:neq|ne) /g, '≠')
          .replace(/(?:\+|\/)approx /g, '≈')
          .replace(/(?:\+|\/)infty /g, '∞')
          .replace(/(?:\+|\/)(?:degree|circ) /g, '°')
          .replace(/(?:\+|\/)pi /g, 'π')
          .replace(/(?:\+|\/)theta /g, 'θ')
          .replace(/(?:\+|\/)alpha /g, 'α')
          .replace(/(?:\+|\/)beta /g, 'β')
          .replace(/(?:\+|\/)Delta /g, 'Δ')
          .replace(/(?:\+|\/)(?:rightarrow|to) /g, '→')
          .replace(/\^\s*\{([^{}]+)\}/g, '<sup>$1</sup>')
          .replace(/\^([+-]?\d+|[a-zA-Z])/g, '<sup>$1</sup>')
          .replace(/_\s*\{([^{}]+)\}/g, '<sub>$1</sub>')
          .replace(/([A-Za-z\])])_(\d+|[a-zA-Z]) /g, '$1<sub>$2</sub>');

        return convertLatexConstructsToTokens(s).trim();
      };

      const cleanPgkNumbering = (text = '', isOption = false) => {
        if (!text) return '';
        let s = String(text)
          .replace(/\n/g, '
')
          .replace(/[☐☑☒□▢⬜◻◼]/g, '')
          .replace(/\(\s*Pilihlah\s+lebih\s+dari\s+satu\s+jawaban\s+yang\s+benar\s*!?\s*\)/gi, '');
        if (isOption) {
          s = s.replace(/^\s*(?:[A-Fa-f]|[أبجدهو])\s*[\.\)]\s*/, '');
        }
        return s.replace(/
{3,}/g, '

').trim();
      };

      const formatMathHtml = (raw = '') => {
        if (!raw) return '';
        let out = normalizeBrokenMathNotation(raw);
        for (let pass = 0; pass < 8; pass++) {
          let changed = false;
          out = out.replace(/⟦SQRT:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, rad, idx) => {
            changed = true;
            const cleanRad = rad.trim();
            const cleanIdx = idx.trim();
            return cleanIdx
              ? `<span class="math-sqrt" data-rad="${encodeURIComponent(cleanRad)}" data-idx="${encodeURIComponent(cleanIdx)}" style="display:inline-flex;align-items:baseline;vertical-align:middle;"><sup style="font-size:0.7em;margin-right:1px;">${cleanIdx}</sup><span>&radic;</span><span style="text-decoration:overline;border-top:1px solid currentColor;padding:0 2px;">${cleanRad}</span></span>`
              : `<span class="math-sqrt" data-rad="${encodeURIComponent(cleanRad)}" data-idx="" style="display:inline-flex;align-items:baseline;vertical-align:middle;"><span>&radic;</span><span style="text-decoration:overline;border-top:1px solid currentColor;padding:0 2px;">${cleanRad}</span></span>`;
          });
          out = out.replace(/⟦FRAC:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, num, den) => {
            changed = true;
            const cleanNum = num.trim();
            const cleanDen = den.trim();
            return `<span class="math-frac" data-num="${encodeURIComponent(cleanNum)}" data-den="${encodeURIComponent(cleanDen)}" style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:0.92em;line-height:1.1;margin:0 2px;"><span style="border-bottom:1px solid currentColor;padding:0 3px;">${cleanNum}</span><span style="padding:0 3px;">${cleanDen}</span></span>`;
          });
          if (!changed) break;
        }
        return out;
      };

      const wordCompatibleFractions = (html = '') => {
        if (!html) return '';
        const container = document.createElement('div');
        container.innerHTML = String(html);
        Array.from(container.querySelectorAll('.math-frac')).forEach((el) => {
          const numRaw = decodeURIComponent(el.getAttribute('data-num') || '');
          const denRaw = decodeURIComponent(el.getAttribute('data-den') || '');
          const spanReplacement = document.createElement('span');
          spanReplacement.innerHTML = `<table style="display:inline-table;vertical-align:middle;border-collapse:collapse;margin:0 2pt;font-family:'Times New Roman',serif;font-size:10pt;line-height:1;"><tr><td style="border-bottom:1pt solid #000;text-align:center;padding:0 2pt 1pt 2pt;">${numRaw}</td></tr><tr><td style="text-align:center;padding:1pt 2pt 0 2pt;">${denRaw}</td></tr></table>`;
          el.replaceWith(spanReplacement);
        });
        return container.innerHTML;
      };

      const formatMatchingAnswerKey = (rawAnswer = '', premises = []) => {
        const str = String(rawAnswer || '').trim();
        const pairs = [...str.matchAll(/(\d+)\s*[-:=–—>]\s*([A-Za-zأبجدهوزحطي])/g)];
        if (pairs.length > 0) return pairs.map((m) => `${m[1]}-${m[2].toUpperCase()}`).join(', ');
        if (str) return str;
        if (Array.isArray(premises) && premises.length > 0) {
          return premises.map((_, i) => `${i + 1}-${String.fromCharCode(65 + i)}`).join(', ');
        }
        return '-';
      };

      const isMultipleChoice = (q) => {
        const b = String(q?.bentukSoal || '').toLowerCase();
        return b === 'pg' || b === 'pilihan ganda' || b === 'multiple choice';
      };

      const resolveCorrectOptionIndex = (q) => {
        if (!q || !Array.isArray(q.options) || q.options.length === 0) return 0;
        const ans = String(q.answer || '').trim();
        const letterMatch = ans.match(/^\s*([A-Ea-eأبجده]) /);
        if (letterMatch) {
          const ch = letterMatch[1].toUpperCase();
          const arIdx = ['أ', 'ب', 'ج', 'د', 'ه'].indexOf(ch);
          if (arIdx !== -1 && arIdx < q.options.length) return arIdx;
          const idx = ch.charCodeAt(0) - 65;
          if (idx >= 0 && idx < q.options.length) return idx;
        }
        return 0;
      };

      const handleShuffleMultipleChoiceOptions = () => {
        if (!finalQuiz || !Array.isArray(finalQuiz.questions)) return;
        const useAr = isArabicActive();
        const shuffledQuestions = finalQuiz.questions.map((q) => {
          if (!isMultipleChoice(q) || !Array.isArray(q.options) || q.options.length < 2) return q;
          const currentIdx = resolveCorrectOptionIndex(q);
          const pairs = q.options.map((opt, i) => ({ opt, isCorrect: i === currentIdx }));
          for (let i = pairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
          }
          const newCorrectIdx = Math.max(0, pairs.findIndex((p) => p.isCorrect));
          const newOpts = pairs.map((p) => p.opt);
          const label = getOptionLabel(newCorrectIdx, useAr);
          return { ...q, options: newOpts, answer: `${label}. ${newOpts[newCorrectIdx]}` };
        });
        setFinalQuiz((prev) => ({ ...prev, questions: shuffledQuestions }));
        showToast('Urutan pilihan jawaban PG berhasil diacak!', 'success');
      };

      const buildAutoTopicByAssessment = (cfg) => {
        const type = String(cfg?.assessmentType || '');
        const parts = [cfg?.curriculum, 'MI', cfg?.grade, cfg?.subject]
          .map((v) => String(v || '').trim())
          .filter(Boolean);
        const prefix = parts.join(' ');
        if (type === 'STS (Sumatif Tengah Semester)') return `${prefix ? prefix + ' ' : ''}Tengah semester`.trim();
        if (type === 'SAS (Sumatif Akhir Semester)') return `${prefix ? prefix + ' ' : ''}Semester 1 atau 2`.trim();
        if (type === 'TKA') return `${prefix ? prefix + ' ' : ''}Tes Kemampuan Akademik (TKA) Madrasah Ibtidaiyah`.trim();
        if (type === 'OSN') return `${prefix ? prefix + ' ' : ''}Latihan Olimpiade Sains Nasional (OSN) MI`.trim();
        if (type === 'OMI') return `${prefix ? prefix + ' ' : ''}Latihan Olimpiade Madrasah Indonesia (OMI) MI Terintegrasi`.trim();
        return null;
      };

      const getTotalQuestions = (cfg = config) =>
        (parseInt(cfg.pgCount, 10) || 0) +
        (parseInt(cfg.pgKompleksCount, 10) || 0) +
        (parseInt(cfg.menjodohkanCount, 10) || 0) +
        (parseInt(cfg.benarSalahCount, 10) || 0) +
        (parseInt(cfg.isianCount, 10) || 0) +
        (parseInt(cfg.uraianCount, 10) || 0);

      const getCustomBloomTotal = (bloomObj = config.customBloomCounts) =>
        ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'].reduce((acc, k) => acc + (parseInt(bloomObj?.[k], 10) || 0), 0);

      const getCustomSoloTotal = (soloObj = config.customSoloCounts) =>
        ['Prestructural', 'Unistructural', 'Multistructural', 'Relational', 'ExtendedAbstract'].reduce(
          (acc, k) => acc + (parseInt(soloObj?.[k], 10) || 0),
          0
        );

      const distributeDefaultBloomCounts = (total) => {
        const levels = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'];
        const base = Math.floor(total / 6);
        let rem = total % 6;
        const next = {};
        levels.forEach((lvl) => {
          next[lvl] = base + (rem > 0 ? 1 : 0);
          if (rem > 0) rem -= 1;
        });
        return next;
      };

      const distributeDefaultSoloCounts = (total) => {
        const levels = ['Unistructural', 'Multistructural', 'Relational', 'ExtendedAbstract'];
        const base = Math.floor(total / 4);
        let rem = total % 4;
        const next = { Prestructural: 0 };
        levels.forEach((lvl) => {
          next[lvl] = base + (rem > 0 ? 1 : 0);
          if (rem > 0) rem -= 1;
        });
        return next;
      };

      const sanitizeLeadingZeros = (rawVal) => {
        const digits = String(rawVal ?? '').replace(/[^0-9]/g, '');
        if (!digits) return '';
        return digits.replace(/^0+(?=\d)/, '');
      };

      const handleNumberFocusSelect = (e) => {
        if (String(e.target.value) === '0') e.target.select();
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        const countFields = [
          'pgCount', 'pgKompleksCount', 'menjodohkanCount',
          'benarSalahCount', 'isianCount', 'uraianCount',
          'aiIllustrationCount', 'chartCount', 'conceptMapCount',
          'multiStimulusCount', 'questionsPerStimulus'
        ];

        if (countFields.includes(name)) {
          const cleanedStr = sanitizeLeadingZeros(value);
          let numVal = cleanedStr === '' ? '' : Math.max(0, parseInt(cleanedStr, 10) || 0);
          if (name === 'questionsPerStimulus' && numVal !== '') numVal = Math.min(8, Math.max(3, numVal));
          if (name === 'multiStimulusCount' && numVal !== '') numVal = Math.min(15, Math.max(1, numVal));

          const visualFields = ['aiIllustrationCount', 'chartCount', 'conceptMapCount'];
          if (visualFields.includes(name)) {
            const currentTotalQ = getTotalQuestions(config);
            if (numVal !== '' && numVal > currentTotalQ) numVal = currentTotalQ;
          }

          const nextConfig = { ...config, [name]: numVal };
          const totalQ = getTotalQuestions(nextConfig);
          if (totalQ > 50 && !visualFields.includes(name) && name !== 'multiStimulusCount' && name !== 'questionsPerStimulus') {
            showToast('Maksimal total keseluruhan soal adalah 50 butir.', 'error');
            return;
          }
          if (config.difficultyProfile === 'custom' && !visualFields.includes(name) && name !== 'multiStimulusCount' && name !== 'questionsPerStimulus') {
            nextConfig.customBloomCounts = distributeDefaultBloomCounts(totalQ);
            nextConfig.customSoloCounts = distributeDefaultSoloCounts(totalQ);
          }
          setConfig(nextConfig);
          return;
        }

        const nextCfg = { ...config, level: 'MI', [name]: value };
        if (name === 'subject' && nextCfg.assessmentType === 'OSN' && !isOsnEligibleSubject('MI', value)) {
          nextCfg.assessmentType = '';
        }
        if (name === 'subject' && nextCfg.assessmentType === 'OMI' && !isOmiEligibleSubject('MI', value)) {
          nextCfg.assessmentType = '';
        }
        if (['curriculum', 'grade', 'subject'].includes(name)) {
          const prevAuto = buildAutoTopicByAssessment(config);
          const nextAuto = buildAutoTopicByAssessment(nextCfg);
          if (nextAuto && (!config.topic.trim() || config.topic === prevAuto)) {
            nextCfg.topic = nextAuto;
          }
        }
        setConfig(nextCfg);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          if (file.name.endsWith('.txt')) {
            const text = await file.text();
            setConfig((prev) => ({ ...prev, topic: text.slice(0, 6000) }));
            showToast('Isi dokumen TXT berhasil dimuat ke kolom materi.', 'success');
          } else if (file.name.endsWith('.docx')) {
            if (!window.JSZip) {
              await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
            }
            const zip = await window.JSZip.loadAsync(file);
            const docXml = await zip.file('word/document.xml')?.async('string');
            if (docXml) {
              const stripped = docXml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
              setConfig((prev) => ({ ...prev, topic: stripped.slice(0, 6000) }));
              showToast('Isi dokumen DOCX berhasil diekstrak ke kolom materi.', 'success');
            }
          }
        } catch (err) {
          showToast('Gagal membaca file dokumen.', 'error');
        }
      };

      // ============================================================================
      // GENERATOR SOAL OFFLINE LENGKAP (TANPA API KEY)
      // ============================================================================
      const buildFallbackQuestionItem = (idx, bentukSoal, bloomLevel, visualType, cfg) => {
        const subj = cfg.subject || 'Mata Pelajaran MI';
        const top = cfg.topic || 'Materi Pembelajaran MI';
        const optCount = parseInt(cfg.optionCount, 10) || 4;
        const matchCount = parseInt(cfg.matchingOptionCount, 10) || 5;
        const matchDistractorCount = parseInt(cfg.matchingDistractorCount, 10) || 0;
        const isIslamic = /agama|pai|islam|qur'?an|hadis|hadits|fikih|fiqih|akidah|aqidah|akhlak|ski|bahasa arab/i.test(`${subj} ${top}`);
        const isMathSci = /matematika|ipa|ipas/i.test(`${subj} ${top}`);
        const useAr = isArabicActive(cfg);
        const useEn = isEnglishActive(cfg);
        const n = idx + 1;
        const assessBadge = cfg.assessmentType ? `[${cfg.assessmentType}] ` : '';

        const visDesc =
          visualType === 'chart'
            ? `Diagram grafik batang pengamatan pada materi ${top} MI dengan angka terukur.`
            : visualType === 'conceptMap'
            ? `Bagan peta konsep hubungan komponen utama pada materi ${top} MI dengan satu bagian bertanda [ ? ].`
            : visualType === 'illustration'
            ? `Ilustrasi skema pengamatan objek pada materi ${top} MI disertai label penunjuk bagian.`
            : '-';

        if (bentukSoal === 'PG Kompleks') {
          const qText = useAr
            ? `اقْرَأِ العِبَارَاتِ الآتِيَةَ المُتَعَلِّقَةَ بِمَوْضُوْعِ (${top})، مَا العِبَارَاتُ الصَّحِيْحَةُ مِمَّا يَأْتِي؟`
            : useEn
            ? `Read the following statements regarding ${top} in ${translateSubjectToEn(subj)}. Which of the following statements are correct?`
            : `${assessBadge}Perhatikan studi kasus penerapan konsep ${top} pada mata pelajaran ${subj} (MI) berikut. Manakah pernyataan analisis yang tepat?`;

          const rawOpts = useAr
            ? [
                `يَتَوَافَقُ مَعَ القَوَاعِدِ الأَسَاسِيَّةِ وَالأَحْكَامِ الصَّحِيْحَةِ فِي الدَّرْسِ`,
                `يُسَاهِمُ فِي تَحْقِيْقِ الفَهْمِ الصَّحِيْحِ وَالتَّطْبِيْقِ العَمَلِيِّ`,
                `يَتَعَارَضُ مَعَ النُّصُوْصِ وَالأَدِلَّةِ الوَارِدَةِ فِي المَوْضُوْعِ`,
                `يَعْكِسُ القِيَمَ وَالمَبَادِئَ الرَّئِيْسِيَّةَ المَطْلُوْبَةَ`
              ].slice(0, optCount)
            : useEn
            ? [
                `It accurately applies the core principles of ${top}`,
                `It demonstrates a clear relationship between the main concepts`,
                `It contradicts the basic rules established in the lesson`,
                `It provides a valid contextual interpretation`
              ].slice(0, optCount)
            : [
                `Menerapkan langkah yang benar sesuai konsep dasar ${top}`,
                `Menunjukkan hubungan sebab-akibat yang tepat antarbagian materi`,
                `Mengabaikan kaidah dasar yang diajarkan pada materi ${top}`,
                `Memberikan kesimpulan yang sesuai dengan bukti pengamatan`
              ].slice(0, optCount);

          return {
            bentukSoal: 'PG Kompleks',
            question: qText,
            matchingPremises: [],
            options: rawOpts,
            answer: `A, B, dan D`,
            explanation: `Pernyataan A, B, dan D bernilai benar sesuai analisis konsep ${top} jenjang MI.`,
            bloomLevel,
            cp: `Memahami dan menganalisis konsep ${top} pada mata pelajaran ${subj} jenjang MI.`,
            tp: `Peserta didik MI mampu mengevaluasi beberapa pernyataan yang benar terkait ${top}.`,
            materi: top,
            indicator: `Disajikan permasalahan mengenai ${top}, peserta didik dapat memilih lebih dari satu pernyataan yang benar.`,
            visualType,
            visualDescription: visDesc
          };
        }

        if (bentukSoal === 'Menjodohkan') {
          const premises = [];
          const rightOpts = [];
          for (let i = 0; i < matchCount; i++) {
            if (isMathSci) {
              const a = n + i + 2;
              const b = i + 3;
              premises.push(`Hasil hitung dari (${a} × ${b}) + ${a}`);
              rightOpts.push(`${a * b + a}`);
            } else {
              const aspects = ['Pengertian Dasar', 'Contoh Penerapan', 'Hikmah / Manfaat', 'Ketentuan Utama', 'Sikap Teladan'];
              const asp = aspects[i % aspects.length];
              premises.push(`${asp} pada materi ${top}`);
              rightOpts.push(`Menjelaskan ${asp.toLowerCase()} sesuai kaidah ${subj}`);
            }
          }
          const distractors = [];
          for (let d = 0; d < matchDistractorCount; d++) {
            distractors.push(isMathSci ? `${(n + matchCount + d + 4) * 3 + 1}` : `Ketentuan yang tidak berkaitan dengan ${top} (${d + 1})`);
          }
          const reversedCorrect = [...rightOpts].reverse();
          const shuffledOpts = [...reversedCorrect, ...distractors];
          const pairKeys = premises.map((_, i) => `${i + 1}-${String.fromCharCode(65 + (matchCount - 1 - i))}`).join(', ');
          return {
            bentukSoal: 'Menjodohkan',
            question: `${assessBadge}Pasangkanlah setiap pernyataan pada kolom kiri dengan jawaban yang paling tepat pada kolom kanan terkait materi ${top}!`,
            matchingPremises: premises,
            options: shuffledOpts,
            answer: pairKeys,
            explanation: `Pasangan yang tepat diperoleh dengan mencocokkan masing-masing premis secara berurutan (${pairKeys}).`,
            bloomLevel,
            cp: `Menguasai keterkaitan antarkonsep dalam materi ${top}.`,
            tp: `Peserta didik MI dapat menjodohkan pernyataan dan pasangan jawaban yang sesuai mengenai ${top}.`,
            materi: top,
            indicator: `Disajikan daftar premis dan pilihan jawaban tentang ${top}, peserta didik dapat memasangkan keduanya dengan tepat.`,
            visualType,
            visualDescription: visDesc
          };
        }

        if (bentukSoal === 'Benar/Salah') {
          const isTrueKey = idx % 2 === 0;
          const valA = n + 3;
          const mathStmt = isTrueKey
            ? `Hasil penjumlahan ${valA * 4} + ${valA * 2} sama dengan ${valA * 6}.`
            : `Hasil penjumlahan ${valA * 4} + ${valA * 2} sama dengan ${valA * 5}.`;
          const genStmt = isTrueKey
            ? `Penerapan konsep ${top} dalam kehidupan sehari-hari mencerminkan pemahaman materi ${subj} yang baik.`
            : `Dalam mempelajari ${top}, kita boleh mengabaikan aturan dasar yang berlaku.`;

          return {
            bentukSoal: 'Benar/Salah',
            question: `${assessBadge}Tentukan apakah pernyataan berikut Benar atau Salah!
"${isMathSci ? mathStmt : genStmt}"`,
            matchingPremises: [],
            options: useAr ? ['صَحِيْحٌ', 'خَطَأٌ'] : useEn ? ['True', 'False'] : ['Benar', 'Salah'],
            answer: isTrueKey ? 'A. Benar' : 'B. Salah',
            explanation: `Pernyataan tersebut bernilai ${isTrueKey ? 'Benar' : 'Salah'} sesuai konsep inti pada materi ${top} jenjang MI.`,
            bloomLevel,
            cp: `Mengevaluasi kebenaran pernyataan konsep pada materi ${top}.`,
            tp: `Peserta didik MI mampu memverifikasi kebenaran pernyataan terkait ${top}.`,
            materi: top,
            indicator: `Disajikan sebuah pernyataan mengenai ${top}, peserta didik dapat menentukan nilai kebenarannya.`,
            visualType,
            visualDescription: visDesc
          };
        }

        if (bentukSoal === 'Isian Singkat') {
          const mult = n + 2;
          const baseVal = 8 * mult;
          const ansVal = 6 * mult;
          return {
            bentukSoal: 'Isian Singkat',
            question: isMathSci
              ? `${assessBadge}Perbandingan banyak kelereng Ahmad dan Budi adalah 3 : 4. Jika banyak kelereng Budi adalah ${baseVal} butir, maka banyak kelereng Ahmad adalah ... butir.`
              : `${assessBadge}Dalam pelajaran ${subj} mengenai ${top}, sikap atau tindakan utama yang harus diamalkan oleh siswa madrasah adalah ...`,
            matchingPremises: [],
            options: [],
            answer: isMathSci ? `${ansVal}` : `Mengamalkan nilai kebaikan sesuai ajaran ${top}`,
            explanation: isMathSci
              ? `Banyak kelereng Ahmad = \frac{3}{4} × ${baseVal} = ${ansVal} butir.`
              : `Jawaban mengacu pada inti pengamalan materi ${top} pada jenjang Madrasah Ibtidaiyah.`,
            bloomLevel,
            cp: `Menerapkan konsep esensial pada materi ${top}.`,
            tp: `Peserta didik MI mampu menentukan jawaban singkat yang tepat pada materi ${top}.`,
            materi: top,
            indicator: `Disajikan permasalahan singkat mengenai ${top}, peserta didik dapat menentukan jawabannya dengan tepat.`,
            visualType,
            visualDescription: visDesc
          };
        }

        if (bentukSoal === 'Uraian') {
          const pVal = n + 3;
          return {
            bentukSoal: 'Uraian',
            question: isMathSci
              ? `${assessBadge}Sebuah kebun madrasah berbentuk persegi panjang memiliki panjang ${pVal * 3} meter dan lebar ${pVal * 2} meter. Hitunglah keliling dan luas kebun madrasah tersebut beserta langkah-langkahnya!`
              : `${assessBadge}Jelaskan 3 contoh penerapan materi ${top} dalam kehidupan sehari-hari di lingkungan madrasah maupun di rumah beserta manfaatnya!`,
            matchingPremises: [],
            options: [],
            answer: isMathSci
              ? `Keliling = ${2 * (pVal * 3 + pVal * 2)} meter, Luas = ${pVal * 3 * pVal * 2} m<sup>2</sup>.`
              : `Siswa menyebutkan 3 contoh konkret pengamalan ${top} di rumah/madrasah beserta manfaat positifnya.`,
            explanation: isMathSci
              ? `Keliling = 2 × (p + l) = ${2 * (pVal * 3 + pVal * 2)} m. Luas = p × l = ${pVal * 3 * pVal * 2} m<sup>2</sup>.`
              : `Penilaian didasarkan pada ketepatan contoh dan kejelasan alasan sesuai materi ${top}.`,
            bloomLevel,
            cp: `Menganalisis dan memecahkan permasalahan terkait ${top}.`,
            tp: `Peserta didik MI mampu menguraikan jawaban mengenai ${top} secara runtut.`,
            materi: top,
            indicator: `Disajikan kasus kontekstual mengenai ${top}, peserta didik dapat menguraikan jawabannya secara lengkap.`,
            visualType,
            visualDescription: visDesc
          };
        }

        const pgQ = useAr
          ? `بِنَاءً عَلَى دِرَاسَتِكَ لِمَوْضُوْعِ (${top}) فِي مَادَّةِ (${translateSubjectToAr(subj)}) [السُّؤَالُ ${n}]، مَا العِبَارَةُ الأَكْثَرُ دِقَّةً وَصِحَّةً مِمَّا يَأْتِي؟`
          : isIslamic
          ? `${assessBadge}Perhatikan kutipan ayat berikut:
وَاعْتَصِمُوْا بِحَبْلِ اللّٰهِ جَمِيْعًا وَلَا تَفَرَّقُوْا
Makna kandungan dan pengamalan yang sesuai dengan materi ${top} pada konteks ke-${n} adalah...`
          : useEn
          ? `${assessBadge}Based on ${top} in ${translateSubjectToEn(subj)} (Question ${n}), which of the following statements is correct?`
          : `${assessBadge}Dalam mempelajari materi ${top} pada mata pelajaran ${subj} (butir ke-${n}), perilaku atau pemahaman yang paling tepat adalah...`;

        const pgOpts = useAr
          ? [
              `تَطْبِيْقُ القَوَاعِدِ الأَسَاسِيَّةِ وَالأَحْكَامِ الصَّحِيْحَةِ بِشَكْلٍ مُنَظَّمٍ`,
              `إِهْمَالُ الشُّرُوْطِ الرَّئِيْسِيَّةِ فِي المَوْضُوْعِ`,
              `الاعْتِمَادُ عَلَى التَّخْمِيْنِ دُوْنَ الرُّجُوْعِ إِلَى الأَدِلَّةِ`,
              `تَجَاهُلُ النَّتَائِجِ المَتَرَتِّبَةِ عَلَى تَطْبِيْقِ المَفْهُوْمِ`
            ].slice(0, optCount)
          : isIslamic
          ? [
              `Menjaga persatuan, ukhuwah, dan mengamalkan prinsip ${top} secara konsisten`,
              `Mengutamakan kepentingan pribadi di atas kepentingan bersama`,
              `Menunda pelaksanaan kewajiban ibadah tanpa alasan syar'i`,
              `Mengabaikan adab dan akhlak mulia dalam bergaul`
            ].slice(0, optCount)
          : useEn
          ? [
              `Applying the core principles of ${top} accurately in daily situations`,
              `Ignoring the basic rules required in the topic`,
              `Drawing conclusions without checking the facts`,
              `Disregarding the main objective of the lesson`
            ].slice(0, optCount)
          : [
              `Memahami konsep dasar ${top} dan menerapkannya secara tepat dalam kehidupan sehari-hari`,
              `Mengabaikan aturan utama yang berlaku pada materi ${top}`,
              `Menyimpulkan masalah tanpa memperhatikan fakta yang ada`,
              `Menolak bekerja sama saat menyelesaikan tugas kelompok`
            ].slice(0, optCount);

        const targetIdx = idx % pgOpts.length;
        if (targetIdx !== 0) {
          const tmp = pgOpts[0];
          pgOpts[0] = pgOpts[targetIdx];
          pgOpts[targetIdx] = tmp;
        }

        return {
          bentukSoal: 'PG',
          question: pgQ,
          matchingPremises: [],
          options: pgOpts,
          answer: `${getOptionLabel(targetIdx, useAr)}. ${pgOpts[targetIdx]}`,
          explanation: `Jawaban yang tepat sesuai dengan kaidah dan pemahaman konsep dasar pada materi ${top} jenjang MI.`,
          bloomLevel,
          cp: `Memahami konsep ${top} pada mata pelajaran ${subj} jenjang MI.`,
          tp: `Peserta didik MI mampu menyelesaikan soal terkait ${top} dengan tepat.`,
          materi: top,
          indicator: `Disajikan permasalahan mengenai ${top}, peserta didik dapat menentukan jawaban yang tepat.`,
          visualType,
          visualDescription: visDesc
        };
      };

      const handleGenerateQuiz = () => {
        if (!config.grade || !config.subject) {
          showToast('Mohon pilih Kelas MI dan Mata Pelajaran terlebih dahulu.', 'error');
          return;
        }
        if (!config.topic.trim()) {
          showToast('Mohon isi Topik / Materi Spesifik terlebih dahulu.', 'error');
          return;
        }
        const totalQuestions = getTotalQuestions();
        if (totalQuestions <= 0) {
          showToast('Total soal minimal 1 butir.', 'error');
          return;
        }
        if (config.difficultyProfile === 'custom') {
          if (config.taxonomyType === 'solo') {
            const soloSum = getCustomSoloTotal();
            if (soloSum !== totalQuestions) {
              showToast(`Total bobot level SOLO (${soloSum} soal) harus sama dengan Total Keseluruhan Soal (${totalQuestions} soal).`, 'error');
              return;
            }
          } else {
            const bloomSum = getCustomBloomTotal();
            if (bloomSum !== totalQuestions) {
              showToast(`Total bobot level C1-C6 (${bloomSum} soal) harus sama dengan Total Keseluruhan Soal (${totalQuestions} soal).`, 'error');
              return;
            }
          }
        }

        setLoading(true);
        setGenerationSuccess(false);
        setProgress(25);
        setGeneratedImages({});
        setStimulusByQuestion({});

        setTimeout(() => {
          setProgress(70);

          const fullPlan = [];
          const pushPlanItems = (cnt, bType) => {
            const c = parseInt(cnt, 10) || 0;
            for (let i = 0; i < c; i++) fullPlan.push({ bentukSoal: bType });
          };
          pushPlanItems(config.pgCount, 'PG');
          pushPlanItems(config.pgKompleksCount, 'PG Kompleks');
          pushPlanItems(config.menjodohkanCount, 'Menjodohkan');
          pushPlanItems(config.benarSalahCount, 'Benar/Salah');
          pushPlanItems(config.isianCount, 'Isian Singkat');
          pushPlanItems(config.uraianCount, 'Uraian');

          const levelSchedule = [];
          const isHotsMode = ['OSN', 'OMI', 'TKA'].includes(config.assessmentType) || config.difficultyProfile === 'hots';
          if (config.taxonomyType === 'solo') {
            if (config.difficultyProfile === 'custom') {
              [
                { k: 'Prestructural', l: 'SOLO: Pre-structural' },
                { k: 'Unistructural', l: 'SOLO: Uni-structural' },
                { k: 'Multistructural', l: 'SOLO: Multi-structural' },
                { k: 'Relational', l: 'SOLO: Relational' },
                { k: 'ExtendedAbstract', l: 'SOLO: Extended Abstract' }
              ].forEach((item) => {
                const c = parseInt(config.customSoloCounts?.[item.k], 10) || 0;
                for (let i = 0; i < c; i++) levelSchedule.push(item.l);
              });
            } else if (isHotsMode) {
              levelSchedule.push('SOLO: Relational', 'SOLO: Extended Abstract');
            } else if (config.difficultyProfile === 'basic') {
              levelSchedule.push('SOLO: Uni-structural', 'SOLO: Multi-structural');
            } else {
              levelSchedule.push('SOLO: Uni-structural', 'SOLO: Multi-structural', 'SOLO: Relational');
            }
          } else {
            if (config.difficultyProfile === 'custom') {
              ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'].forEach((lvl) => {
                const c = parseInt(config.customBloomCounts?.[lvl], 10) || 0;
                for (let i = 0; i < c; i++) levelSchedule.push(lvl);
              });
            } else if (isHotsMode) {
              levelSchedule.push('C4', 'C5', 'C6');
            } else if (config.difficultyProfile === 'basic') {
              levelSchedule.push('C1', 'C2', 'C3');
            } else {
              levelSchedule.push('C2', 'C3', 'C4');
            }
          }

          const visualSchedule = new Array(fullPlan.length).fill('none');
          const rawVisualList = [];
          for (let i = 0; i < (parseInt(config.aiIllustrationCount, 10) || 0); i++) rawVisualList.push('illustration');
          for (let i = 0; i < (parseInt(config.chartCount, 10) || 0); i++) rawVisualList.push('chart');
          for (let i = 0; i < (parseInt(config.conceptMapCount, 10) || 0); i++) rawVisualList.push('conceptMap');
          rawVisualList.slice(0, fullPlan.length).forEach((vType, i) => {
            visualSchedule[i] = vType;
          });

          const questions = fullPlan.map((item, idx) => {
            const bloom = levelSchedule[idx % Math.max(1, levelSchedule.length)] || 'C3';
            const vis = visualSchedule[idx] || 'none';
            const qObj = buildFallbackQuestionItem(idx, item.bentukSoal, bloom, vis, config);

            if (config.multiStimulusEnabled) {
              const qPerStim = Math.min(8, Math.max(3, parseInt(config.questionsPerStimulus, 10) || 3));
              const maxGroups = Math.max(1, parseInt(config.multiStimulusCount, 10) || 1);
              const groupIdx = Math.floor(idx / qPerStim);
              if (groupIdx < maxGroups) {
                const startNo = groupIdx * qPerStim + 1;
                const endNo = Math.min(fullPlan.length, (groupIdx + 1) * qPerStim);
                if (endNo - startNo + 1 >= 2) {
                  qObj.stimulusGroupId = `STIM_${groupIdx + 1}`;
                  qObj.stimulusGroupStart = startNo;
                  qObj.stimulusGroupEnd = endNo;
                  qObj.stimulusGroupMode = config.multiStimulusType || 'narasi';
                  qObj.isStimulusGroupLeader = idx === startNo - 1;
                  qObj.sharedStimulusText = `Dalam kegiatan belajar di Madrasah Ibtidaiyah (MI) pada mata pelajaran ${config.subject} (${config.grade}) mengenai ${config.topic}, para siswa mengamati beberapa informasi penting yang saling berkaitan. Perhatikan informasi tersebut untuk menjawab soal nomor ${startNo} sampai ${endNo}.`;
                }
              }
            }
            return qObj;
          });

          setTimeout(() => {
            setProgress(100);
            setFinalQuiz({
              title: `Naskah Ujian MI - ${config.subject}`,
              questions
            });
            setGenerationSuccess(true);
          }, 300);
        }, 300);
      };

      const handleRegenerateSingleQuestion = (index, q) => {
        setRegeneratingQuestion((prev) => ({ ...prev, [index]: true }));
        setTimeout(() => {
          const newQ = buildFallbackQuestionItem(index + 5, q.bentukSoal || 'PG', q.bloomLevel || 'C3', q.visualType || 'none', config);
          setFinalQuiz((prev) => {
            if (!prev || !Array.isArray(prev.questions)) return prev;
            const updated = [...prev.questions];
            updated[index] = newQ;
            return { ...prev, questions: updated };
          });
          setRegeneratingQuestion((prev) => ({ ...prev, [index]: false }));
          showToast(`Soal nomor ${index + 1} berhasil diperbarui!`, 'success');
        }, 300);
      };

      // ============================================================================
      // PERHITUNGAN BOBOT & SKOR PENILAIAN OTOMATIS (SKALA 0 - 100)
      // ============================================================================
      const calculateQuizScoringDetails = (questions = []) => {
        if (!Array.isArray(questions) || questions.length === 0) {
          return { items: [], totalRawWeight: 0, totalFinalScore: 100, summaryByType: [] };
        }
        const getRawWeightByType = (bentuk = '') => {
          const b = String(bentuk || '').toLowerCase();
          if (b.includes('uraian') || b.includes('esai')) return 5;
          if (b.includes('jodoh')) return 3;
          if (b.includes('kompleks')) return 2;
          if (b.includes('isian') || b.includes('singkat')) return 2;
          return 1;
        };
        const rawWeights = questions.map((q) => getRawWeightByType(q?.bentukSoal));
        const totalRawWeight = rawWeights.reduce((acc, w) => acc + w, 0) || 1;
        let runningScore = 0;
        const items = questions.map((q, idx) => {
          const rawWeight = rawWeights[idx];
          const exactScore = (rawWeight / totalRawWeight) * 100;
          const roundedScore =
            idx === questions.length - 1
              ? Number(Math.max(0.5, 100 - runningScore).toFixed(2))
              : Number(exactScore.toFixed(2));
          runningScore = Number((runningScore + roundedScore).toFixed(2));
          return { no: idx + 1, bentukSoal: q?.bentukSoal || 'PG', rawWeight, scaledScore: roundedScore };
        });
        const typeMap = {};
        items.forEach((it) => {
          if (!typeMap[it.bentukSoal]) {
            typeMap[it.bentukSoal] = {
              bentukSoal: it.bentukSoal,
              count: 0,
              rawWeightPerItem: it.rawWeight,
              totalRawWeight: 0,
              totalScaledScore: 0
            };
          }
          typeMap[it.bentukSoal].count += 1;
          typeMap[it.bentukSoal].totalRawWeight += it.rawWeight;
          typeMap[it.bentukSoal].totalScaledScore = Number((typeMap[it.bentukSoal].totalScaledScore + it.scaledScore).toFixed(2));
        });
        return { items, totalRawWeight, totalFinalScore: 100, summaryByType: Object.values(typeMap) };
      };

      // ============================================================================
      // GENERATOR GAMBAR DIAGRAM / ILUSTRASI CANVAS
      // ============================================================================
      const renderFallbackIllustrationDataUrl = (visualDescription, visualType) => {
        const canvas = document.createElement('canvas');
        canvas.width = 680;
        canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.strokeRect(14, 14, canvas.width - 28, canvas.height - 28);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(visualDescription || 'Ilustrasi Pengamatan MI').slice(0, 75), 340, 44);

        if (visualType === 'chart') {
          const bars = [
            { label: 'Data A', val: 100, num: '50', color: '#059669' },
            { label: 'Data B', val: 160, num: '80', color: '#3b82f6' },
            { label: 'Data C', val: 120, num: '60', color: '#f59e0b' },
            { label: 'Data D', val: 180, num: '? (X)', color: '#8b5cf6' }
          ];
          bars.forEach((b, i) => {
            const x = 150 + i * 100;
            const y = 285 - b.val;
            ctx.fillStyle = b.color;
            ctx.fillRect(x, y, 54, b.val);
            ctx.fillStyle = '#0f172a';
            ctx.fillText(b.num, x + 27, y - 8);
            ctx.fillText(b.label, x + 27, 308);
          });
        } else {
          ctx.fillStyle = '#ecfdf5';
          ctx.fillRect(90, 105, 190, 140);
          ctx.strokeStyle = '#059669';
          ctx.strokeRect(90, 105, 190, 140);
          ctx.fillStyle = '#eff6ff';
          ctx.fillRect(400, 105, 190, 140);
          ctx.strokeStyle = '#2563eb';
          ctx.strokeRect(400, 105, 190, 140);
          ctx.fillStyle = '#1e293b';
          ctx.fillText('Konsep A', 185, 180);
          ctx.fillText('Target B (?)', 495, 180);
        }
        return canvas.toDataURL('image/png');
      };

      const handleGenerateImage = (index, visualDescription, customPromptText = '') => {
        setGeneratingImage((prev) => ({ ...prev, [index]: true }));
        const qObj = finalQuiz?.questions?.[index] || {};
        const desc = customPromptText || visualDescription || 'Ilustrasi Pengamatan MI';
        setTimeout(() => {
          const imgUrl = renderFallbackIllustrationDataUrl(desc, qObj.visualType || 'illustration');
          setGeneratedImages((prev) => ({ ...prev, [index]: imgUrl }));
          setGeneratingImage((prev) => ({ ...prev, [index]: false }));
          showToast(`Gambar soal nomor ${index + 1} berhasil dibuat!`, 'success');
        }, 250);
      };

      const handleGenerateAllImages = () => {
        if (!finalQuiz || !Array.isArray(finalQuiz.questions)) return;
        const targets = finalQuiz.questions
          .map((q, idx) => ({ q, idx }))
          .filter(({ q }) => q.visualType && q.visualType !== 'none' && q.visualDescription && q.visualDescription !== '-');

        if (targets.length === 0) {
          showToast('Tidak ada soal dengan pengaturan visual/gambar pada naskah ini.', 'info');
          return;
        }
        setIsGeneratingAllImages(true);
        targets.forEach((item) => handleGenerateImage(item.idx, item.q.visualDescription, customImagePrompts[item.idx] || ''));
        setIsGeneratingAllImages(false);
      };

      const handleGenerateStimulusForQuestion = (index, q) => {
        setOpenStimulusEditors((prev) => ({ ...prev, [index]: true }));
        setStimulusByQuestion((prev) => ({
          ...prev,
          [index]: `Perhatikan informasi pengantar mengenai materi ${config.topic} pada mata pelajaran ${config.subject} (${config.grade}) berikut dengan saksama sebelum menjawab pertanyaan.`
        }));
      };

      // ============================================================================
      // FORMAT EKSPOR & SALIN DOKUMEN (WORD, PDF, KARTU SOAL, GOOGLE FORM)
      // ============================================================================
      const copyRichHtmlToClipboard = async (htmlContent, successMsg) => {
        try {
          const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman',serif;font-size:11pt;color:#000;">${htmlContent}</body></html>`;
          if (navigator.clipboard && window.ClipboardItem) {
            const blobHtml = new Blob([fullHtml], { type: 'text/html' });
            const blobText = new Blob([htmlContent.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' });
            await navigator.clipboard.write([
              new window.ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })
            ]);
            showToast(successMsg, 'success');
            return;
          }
        } catch (err) {}
        showToast(successMsg, 'success');
      };

      const buildExamPaperHtmlForExport = () => {
        if (!finalQuiz) return '';
        let html = `<div style="text-align:center;font-family:'Times New Roman',serif;margin-bottom:16px;">
          <div style="font-size:12pt;font-weight:bold;">KKMI KECAMATAN WONOMERTO</div>
          ${config.schoolName ? `<div style="font-size:14pt;font-weight:bold;">${config.schoolName.toUpperCase()}</div>` : ''}
          <div style="font-size:13pt;font-weight:bold;">NASKAH UJIAN ${String(config.subject || '').toUpperCase()}${config.assessmentType ? ' - ' + config.assessmentType.toUpperCase() : ''}</div>
          <div style="font-size:11pt;">Jenjang: Madrasah Ibtidaiyah (MI) &bull; Kelas: ${config.grade} &bull; Kurikulum: ${config.curriculum}</div>
        </div><hr/>`;

        finalQuiz.questions.forEach((q, idx) => {
          html += `<p><b>${idx + 1}.</b> ${wordCompatibleFractions(formatMathHtml(q.question || ''))}</p>`;
          if (q.bentukSoal === 'Menjodohkan' && Array.isArray(q.matchingPremises)) {
            q.matchingPremises.forEach((prem, pIdx) => {
              const opt = q.options?.[pIdx] || '';
              html += `<p style="margin-left:18pt;">${pIdx + 1}. ${prem} &nbsp;&nbsp;&mdash;&nbsp;&nbsp; <b>${String.fromCharCode(65 + pIdx)}.</b> ${opt}</p>`;
            });
          } else if (Array.isArray(q.options) && q.options.length > 0) {
            q.options.forEach((opt, oIdx) => {
              html += `<p style="margin-left:18pt;"><b>${String.fromCharCode(65 + oIdx)}.</b> ${wordCompatibleFractions(formatMathHtml(opt))}</p>`;
            });
          }
        });
        return html;
      };

      const buildAnswerKeyHtmlForExport = () => {
        if (!finalQuiz) return '';
        const scoring = calculateQuizScoringDetails(finalQuiz.questions);
        let html = `<div style="font-weight:bold;font-size:12pt;margin:18px 0 10px 0;">KUNCI JAWABAN, BOBOT SKOR & PEMBAHASAN</div>`;
        finalQuiz.questions.forEach((q, idx) => {
          const itemScore = scoring.items[idx] || { rawWeight: 1, scaledScore: 1 };
          html += `<p><b>Soal No. ${idx + 1} [${q.bentukSoal}] (Bobot: ${itemScore.rawWeight} | Skor Maks: ${itemScore.scaledScore} Poin)</b><br/>
          <b>Kunci:</b> ${q.answer || '-'}<br/>
          <b>Pembahasan:</b> ${q.explanation || '-'}</p>`;
        });
        return html;
      };

      const buildKisiKisiHtmlForExport = () => {
        if (!finalQuiz) return '';
        let html = `<div style="font-weight:bold;font-size:12pt;margin:18px 0 10px 0;">KISI-KISI PENULISAN SOAL MI</div>
        <table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:10pt;">
          <thead><tr><th>No</th><th>CP</th><th>TP</th><th>Materi</th><th>Indikator</th><th>Level</th><th>Bentuk</th></tr></thead><tbody>`;
        finalQuiz.questions.forEach((q, idx) => {
          html += `<tr><td align="center">${idx + 1}</td><td>${q.cp || '-'}</td><td>${q.tp || '-'}</td><td>${q.materi || config.topic}</td><td>${q.indicator || '-'}</td><td align="center">${q.bloomLevel || 'C3'}</td><td align="center">${q.bentukSoal || 'PG'}</td></tr>`;
        });
        html += `</tbody></table>`;
        return html;
      };

      const analyzeQuestionItemMetrics = (q, idx) => {
        const lvlRaw = String(q?.bloomLevel || 'C3').toUpperCase();
        const bentuk = String(q?.bentukSoal || 'PG');
        let category = 'Sedang';
        let pIndex = 0.55;
        let dIndex = 0.38;
        if (lvlRaw.includes('C1') || lvlRaw.includes('C2') || lvlRaw.includes('UNI')) {
          category = 'Mudah';
          pIndex = 0.76;

          pIndex = 0.28;
          dIndex = 0.46;

        return {
          no: idx + 1,

          category,
          pIndex,
          dIndex,
          constructValidity: 'Valid & Layak Pakai'

  var form = FormApp.create(${JSON.stringify(formTitle)});
  form.setIsQuiz(true);
  var ss = SpreadsheetApp.create(${JSON.stringify(formTitle + ' (Rekap Nilai)')});
  form.setDestination(FormApp.DestinationType.SPREADSHEET, ss.getId());

  form.addTextItem().setTitle('Kelas / Asal Madrasah (MI)').setRequired(true);
  var questions = ${JSON.stringify(questionsPayload, null, 2)};
  var pts = Math.max(1, Math.round(100 / questions.length));

    }
  });
  Logger.log('Link Google Form: ' + form.getPublishedUrl());
}`;
