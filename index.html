    // Adapter ikon Lucide agar kompatibel di GitHub Pages tanpa bundler
    const createLucideIcon = (iconName) => {
      return function LucideIcon({ size = 24, className = '', ...props }) {
        const spanRef = useRef(null);
        useEffect(() => {
          try {
            if (spanRef.current && window.lucide && window.lucide.icons) {
              const kebabName = iconName.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
              const iconDef = window.lucide.icons[iconName] || window.lucide.icons[kebabName];
              if (iconDef && typeof window.lucide.createElement === 'function') {
                const svgEl = window.lucide.createElement(iconDef);
                svgEl.setAttribute('width', size);
                svgEl.setAttribute('height', size);
                if (className) svgEl.setAttribute('class', className);
                spanRef.current.innerHTML = '';
                spanRef.current.appendChild(svgEl);
              }
            }
          } catch (err) {
            // Abaikan error rendering ikon agar tidak mengganggu aplikasi
          }
        }, [size, className]);
        return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
      };
    };

  const handleSaveAccount = (e) => {
    e.preventDefault();

    const madrasah = String(accountForm.madrasah || '').trim();

      showToast('Nama Lengkap, Username, dan Password wajib diisi.', 'error');

    }

    const isDuplicate = accounts.some(
      (acc) =>
        String(acc.username || '').trim().toLowerCase() === username &&
        acc.id !== editingAccountId
    );
    if (isDuplicate) {
      showToast(`Username "${username}" sudah digunakan akun lain.`, 'error');
      return;
    }

    if (editingAccountId) {
      setAccounts((prev) =>
        prev.map((acc) =>
          acc.id === editingAccountId
            ? { ...acc, fullName, madrasah, username, password, role }

        )
      );
      if (currentUser && currentUser.id === editingAccountId) {
        setCurrentUser((prev) => ({ ...prev, fullName, madrasah, username, password, role }));
      }
      showToast(`Akun "${username}" berhasil diperbarui!`, 'success');
    } else {
      const newAcc = {
        id: `usr-${Date.now()}`,
        fullName,
        madrasah: madrasah || 'MI Kecamatan Wonomerto',
        username,
        password,
        role,
        createdAt: new Date().toISOString().slice(0, 10)

      setAccounts((prev) => [...prev, newAcc]);
      showToast(`Akun baru "${username}" berhasil ditambahkan!`, 'success');
    }

    resetAccountForm();
  };

  const handleStartEditAccount = (acc) => {
    setEditingAccountId(acc.id);
    setAccountForm({
      fullName: acc.fullName || '',
      madrasah: acc.madrasah || '',
      username: acc.username || '',
      password: acc.password || '',
      role: acc.role || 'user'

  };

  const handleDeleteAccount = (accId) => {
    if (currentUser && currentUser.id === accId) {
      showToast('Tidak dapat menghapus akun yang sedang digunakan login saat ini.', 'error');
      setConfirmDeleteAccountId(null);
      return;
    }
    const target = accounts.find((a) => a.id === accId);
    setAccounts((prev) => prev.filter((a) => a.id !== accId));
    if (editingAccountId === accId) {
      resetAccountForm();

  // ============================================================================
  // HELPER DETEKSI BAHASA, JENJANG & FORMATTER RUMUS / SOAL
  // ============================================================================
  const isArabicActive = (cfg = config) => {
    const c = cfg || config;
    return c?.language === 'ar';
  };

  const isEnglishActive = (cfg = config) => {
    const c = cfg || config;
    if (isArabicActive(c)) return false;
    return (
      c?.language === 'en' ||
      (c?.language !== 'id' && /bahasa inggris|english/i.test(String(c?.subject || '')))
    );
  };

  const isSpecialNeedsLevel = () => false;

  const getOptionLabel = (idx, useArabic = false) => {
    if (useArabic) {
      const arLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
      return arLetters[idx] || String.fromCharCode(65 + idx);
    }
    return String.fromCharCode(65 + idx);
  };

  const cleanMatchingItemText = (text = '', isPremise = true) => {
    if (!text) return '';
    let s = String(text).trim();
    if (isPremise) {
      for (let i = 0; i < 3; i++) {
        const next = s.replace(/^\s*(?:\(\d+\)|\(\s*[٠-٩]+\s*\)|\d+[\.\)\-:]\s+|[٠-٩]+[\.\)\-:]\s+)/, '').trim();
        if (next === s) break;
        s = next;
      }
    } else {
      for (let i = 0; i < 3; i++) {
        const next = s
          .replace(/^\s*(?:\([A-Ja-j]\)|[A-Ja-j][\.\)\-:]\s+|\(?[أبجدهوزحطي][\.\)\-:]\s*)/, '')
          .trim();
        if (next === s) break;
        s = next;
      }
    }
    return s;
  };

  const ensureCompleteMatchingStructure = (q, idx = 0, cfg = config) => {
    if (!q) return q;
    const bLower = String(q.bentukSoal || '').toLowerCase();
    if (!bLower.includes('jodoh')) return q;

    const targetPremiseCount = Math.max(2, parseInt(cfg?.matchingOptionCount, 10) || 5);
    const distractorCount = Math.max(0, parseInt(cfg?.matchingDistractorCount, 10) || 0);
    const targetOptionCount = targetPremiseCount + distractorCount;

    let premises = Array.isArray(q.matchingPremises)
      ? q.matchingPremises
          .map((p) => cleanMatchingItemText(normalizeBrokenMathNotation(p), true))
          .filter(Boolean)
      : [];

    if (premises.length === 0) {
      const altArray = q.premises || q.statements || q.leftColumn || q.leftItems || q.pernyataan;
      if (Array.isArray(altArray) && altArray.length > 0) {
        premises = altArray
          .map((p) => cleanMatchingItemText(normalizeBrokenMathNotation(p), true))
          .filter(Boolean);
      }
    }

    let cleanedQuestionText = String(q.question || '');
    if (premises.length < targetPremiseCount && cleanedQuestionText.includes('\n')) {
      const qLines = cleanedQuestionText.split(/\n+/).map((l) => l.trim()).filter(Boolean);
      const numberedLines = qLines.filter((l) => /^\s*(?:\(?\d+[\.\)\-:]|\(?[٠-٩]+[\.\)\-:])\s*\S+/.test(l));
      if (numberedLines.length >= 2) {
        const extracted = numberedLines
          .map((l) => cleanMatchingItemText(normalizeBrokenMathNotation(l), true))
          .filter(Boolean);
        if (extracted.length > premises.length) {
          premises = extracted;
          const nonNumberedLines = qLines.filter((l) => !/^\s*(?:\(?\d+[\.\)\-:]|\(?[٠-٩]+[\.\)\-:])\s*\S+/.test(l));
          if (nonNumberedLines.length > 0) {
            cleanedQuestionText = nonNumberedLines.join(' ');
          }
        }
      }
    }

    let opts = Array.isArray(q.options)
      ? q.options
          .map((o) => cleanMatchingItemText(normalizeBrokenMathNotation(o), false))
          .filter(Boolean)
      : [];

    const expText = String(q.explanation || '');
    if (premises.length < targetPremiseCount && expText) {
      const expMatches = [
        ...expText.matchAll(/(?:premis|pernyataan|nomor|poin)?\s*\(?(\d+)\)?\s*(?:[:=\-–—>]|berpasangan dengan|cocok dengan|adalah)\s*([^.;\n]+)/gi)
      ];
      expMatches.forEach((m) => {
        const pIdx = parseInt(m[1], 10) - 1;
        const candidateDesc = cleanMatchingItemText(normalizeBrokenMathNotation(m[2] || ''), true);
        if (
          pIdx >= 0 &&
          pIdx < targetPremiseCount &&
          !premises[pIdx] &&
          candidateDesc &&
          candidateDesc.length > 2 &&
          !/^[A-Ja-j]$/.test(candidateDesc)
        ) {
          premises[pIdx] = candidateDesc;
        }
      });
      premises = premises.filter(Boolean);
    }

    if (premises.length < targetPremiseCount || opts.length < targetPremiseCount) {
      const fb = buildFallbackQuestionItem(
        idx,
        'Menjodohkan',
        q.bloomLevel || 'C3',
        q.visualType || 'none',
        cfg
      );
      const useAr = isArabicActive(cfg);
      const useEn = isEnglishActive(cfg);
      const topicLabel = q.materi || cfg?.topic || cfg?.subject || 'Materi';

      const ansPairs = {};
      [...String(q.answer || '').matchAll(/(\d+)\s*[-:=–—>]\s*([A-Za-zأبجدهوزحطي])/g)].forEach((m) => {
        const num = parseInt(m[1], 10);
        const letter = m[2].toUpperCase();
        const optIdx = letter.charCodeAt(0) - 65;
        if (num >= 1 && optIdx >= 0) {
          ansPairs[num - 1] = optIdx;
        }
      });

      while (opts.length < targetOptionCount) {
        const nextOptIdx = opts.length;
        const fbOpt = fb.options?.[nextOptIdx % Math.max(1, fb.options.length)] || `${(nextOptIdx + 1) * 2}`;
        opts.push(fbOpt);
      }

      for (let i = 0; i < targetPremiseCount; i++) {
        if (!premises[i] || !String(premises[i]).trim()) {
          const pairedOptIdx = ansPairs[i] !== undefined ? ansPairs[i] : i;
          const pairedOptVal = opts[pairedOptIdx] || opts[i % opts.length] || '';
          const fbPrem = fb.matchingPremises?.[i];

          if (fbPrem && opts === fb.options) {
            premises[i] = fbPrem;
          } else if (useAr) {
            premises[i] = `العِبَارَةُ أَوِ الحَالَةُ (${i + 1}) المُتَعَلِّقَةُ بِـ ${topicLabel}`;
          } else if (useEn) {
            premises[i] = `Condition or parameter (${i + 1}) in the analysis of ${topicLabel}`;
          } else if (pairedOptVal && /^[0-9.,%\-+]+$/.test(pairedOptVal.replace(/\s+/g, ''))) {

      .replace(/(?:\\+|\/)notin\b/g, '∉')
      .replace(/(?:\\+|\/)in\b/g, '∈')
      .replace(/(?:\\+|\/)subseteq\b/g, '⊆')
      .replace(/(?:\\+|\/)subset\b/g, '⊂')
      .replace(/(?:\\+|\/)cup\b/g, '∪')
      .replace(/(?:\\+|\/)cap\b/g, '∩')
      .replace(/(?:\\+|\/)emptyset\b/g, '∅')
      .replace(/(?:\\+|\/)pi\b/g, 'π')
      .replace(/(?:\\+|\/)theta\b/g, 'θ')
      .replace(/(?:\\+|\/)alpha\b/g, 'α')
      .replace(/(?:\\+|\/)beta\b/g, 'β')
      .replace(/(?:\\+|\/)gamma\b/g, 'γ')
      .replace(/(?:\\+|\/)delta\b/g, 'δ')
      .replace(/(?:\\+|\/)epsilon\b/g, 'ε')
      .replace(/(?:\\+|\/)zeta\b/g, 'ζ')
      .replace(/(?:\\+|\/)eta\b/g, 'η')
      .replace(/(?:\\+|\/)lambda\b/g, 'λ')
      .replace(/(?:\\+|\/)mu\b/g, 'μ')
      .replace(/(?:\\+|\/)nu\b/g, 'ν')
      .replace(/(?:\\+|\/)xi\b/g, 'ξ')
      .replace(/(?:\\+|\/)rho\b/g, 'ρ')
      .replace(/(?:\\+|\/)sigma\b/g, 'σ')
      .replace(/(?:\\+|\/)tau\b/g, 'τ')
      .replace(/(?:\\+|\/)(?:varphi|phi)\b/g, 'φ')
      .replace(/(?:\\+|\/)chi\b/g, 'χ')
      .replace(/(?:\\+|\/)psi\b/g, 'ψ')
      .replace(/(?:\\+|\/)omega\b/g, 'ω')
      .replace(/(?:\\+|\/)Gamma\b/g, 'Γ')
      .replace(/(?:\\+|\/)Delta\b/g, 'Δ')
      .replace(/(?:\\+|\/)Theta\b/g, 'Θ')
      .replace(/(?:\\+|\/)Lambda\b/g, 'Λ')
      .replace(/(?:\\+|\/)Pi\b/g, 'Π')
      .replace(/(?:\\+|\/)Sigma\b/g, 'Σ')
      .replace(/(?:\\+|\/)Phi\b/g, 'Φ')
      .replace(/(?:\\+|\/)Psi\b/g, 'Ψ')
      .replace(/(?:\\+|\/)Omega\b/g, 'Ω')
      .replace(/(?:\\+|\/)(?:Rightarrow|implies)\b/g, '⇒')
      .replace(/(?:\\+|\/)(?:Leftrightarrow|iff)\b/g, '⇔')
      .replace(/(?:\\+|\/)(?:rightarrow|to|longrightarrow)\b/g, '→')
      .replace(/(?:\\+|\/)(?:leftarrow|gets)\b/g, '←')
      .replace(/(?:\\+|\/)(?:rightleftharpoons|leftrightarrow)\b/g, '⇌')
      .replace(/(?:\\+|\/)oint\b/g, '∮')
      .replace(/(?:\\+|\/)iint\b/g, '∬')
      .replace(/(?:\\+|\/)iiint\b/g, '∭')
      .replace(/(?:\\+|\/)int\b/g, '∫')
      .replace(/(?:\\+|\/)sum\b/g, '∑')
      .replace(/(?:\\+|\/)prod\b/g, '∏')
      .replace(/(?:\\+|\/)partial\b/g, '∂')
      .replace(/(?:\\+|\/)nabla\b/g, '∇')
      .replace(/\\(?:quad|qquad)\b/g, ' ')
      .replace(/\\[,;:!]/g, ' ')
      .replace(/\\\{/g, '{')
      .replace(/\\\}/g, '}')
      .replace(/\^\s*\{([^{}]+)\}/g, '<sup>$1</sup>')
      .replace(/\^([+-]?\d+|\([+-]?\d+\)|[a-zA-Z])/g, '<sup>$1</sup>')
      .replace(/_\s*\{([^{}]+)\}/g, '<sub>$1</sub>')
      .replace(/([A-Za-z\])])_(\d+|[a-zA-Z])\b/g, '$1<sub>$2</sub>');

    s = convertLatexConstructsToTokens(s);

    s = s
      .replace(/\\+\s*(?=⟦)/g, '')
      .replace(/\\+(?=[\s0-9+\-=()\[\].,:;!?<>×÷±√πθαβγΔ∞∫∑∏])/g, '')
      .replace(/(^|[\s(+\-=<>])\\+(?=[a-zA-Z0-9])/g, '$1');

    return s.trim();
  };

  const cleanPgkNumbering = (text = '', isOption = false) => {
    if (!text) return '';
    let s = String(text)
      .replace(/\\n/g, '\n')
      .replace(/(^|[^a-zA-Z0-9_])\/n(?=[0-9A-Za-z\u0600-\u06FF\s.(])/g, '$1\n');

    s = s
      .replace(/[\u2610\u2611\u2612\u25A1\u25A2\u2B1C\u25FB\u25FC]/g, '')
      .replace(/\(\s*Pilihlah\s+lebih\s+dari\s+satu\s+jawaban\s+yang\s+benar\s*!?\s*\)/gi, '')
      .replace(/\(\s*Choose\s+more\s+than\s+one\s+correct\s+answer\s*!?\s*\)/gi, '')
      .replace(/\(\s*اختر\s+أكثر\s+من\s+إجابة\s+صحيحة\s*!?\s*\)/g, '');

    if (isOption) {
      s = s.replace(/^\s*(?:[A-Fa-f]|[أبجدهو])\s*[\.\)]\s*/, '');
    }
    return s.replace(/\n{3,}/g, '\n\n').trim();
  };

  const formatMathHtml = (raw = '') => {
    if (!raw) return '';
    let s = normalizeBrokenMathNotation(raw);

    const renderNestedTokens = (str) => {
      let out = String(str || '');
      for (let pass = 0; pass < 10; pass++) {
        let changed = false;

        out = out.replace(/⟦LIM:([^⟦⟧]*?)⟧/g, (_, sub) => {
          changed = true;
          const cleanSub = sub.trim().replace(/->/g, '→');
          return `<span class="math-lim" style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;"><span style="font-style:normal;font-weight:500;">lim</span><span style="font-size:0.74em;line-height:1;white-space:nowrap;">${cleanSub}</span></span>`;
        });

        out = out.replace(/⟦BIGOP:([^⟦⟧]*?)::([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, op, low, up) => {
          changed = true;
          const sym = op === 'int' ? '&int;' : op === 'sum' ? '&sum;' : '&prod;';
          const cleanLow = low.trim();
          const cleanUp = up.trim();
          return `<span class="math-bigop" style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px;"><span style="font-size:1.25em;line-height:1;">${sym}</span><span style="display:inline-flex;flex-direction:column;justify-content:space-between;font-size:0.72em;line-height:1.05;margin-left:1px;text-align:left;"><span>${cleanUp}</span><span>${cleanLow}</span></span></span>`;
        });

        out = out.replace(/⟦BINOM:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, top, bot) => {
          changed = true;
          return `<span class="math-binom" style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px;"><span style="font-size:1.35em;line-height:1;">(</span><span style="display:inline-flex;flex-direction:column;text-align:center;font-size:0.88em;line-height:1.1;padding:0 2px;"><span>${top.trim()}</span><span>${bot.trim()}</span></span><span style="font-size:1.35em;line-height:1;">)</span></span>`;
        });

        out = out.replace(/⟦MATRIX:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, mType, rowsStr) => {
          changed = true;
          const mKind = String(mType || 'bmatrix').trim();
          const rows = rowsStr
            .split(';;')
            .map((r) => r.trim())
            .filter(Boolean);
          const parsedRows = rows.map((r) => r.split('&').map((c) => c.trim()));
          const encRows = encodeURIComponent(
            parsedRows.map((cols) => cols.join('\t')).join('\n')
          );

          const trHtml = parsedRows
            .map((cols) => {
              const tds = cols
                .map(
                  (c) =>
                    `<td style="padding:2px 7px;text-align:center;white-space:nowrap;vertical-align:middle;">${c}</td>`
                )
                .join('');
              return `<tr>${tds}</tr>`;
            })
            .join('');

          let bracketStyle =
            'border-left:1.8px solid currentColor;border-right:1.8px solid currentColor;padding:1px 3px;';
          if (mKind === 'bmatrix') {
            bracketStyle =
              'border-left:1.8px solid currentColor;border-right:1.8px solid currentColor;background:linear-gradient(currentColor,currentColor) top left/5px 1.6px no-repeat,linear-gradient(currentColor,currentColor) bottom left/5px 1.6px no-repeat,linear-gradient(currentColor,currentColor) top right/5px 1.6px no-repeat,linear-gradient(currentColor,currentColor) bottom right/5px 1.6px no-repeat;padding:2px 4px;';
          } else if (mKind === 'pmatrix') {
            bracketStyle =
              'border-left:1.8px solid currentColor;border-right:1.8px solid currentColor;border-radius:8px/14px;padding:2px 5px;';
          } else if (mKind === 'vmatrix') {
            bracketStyle =
              'border-left:1.6px solid currentColor;border-right:1.6px solid currentColor;padding:2px 5px;';
          } else if (mKind === 'Vmatrix') {
            bracketStyle =
              'border-left:3.5px double currentColor;border-right:3.5px double currentColor;padding:2px 5px;';
          } else if (mKind === 'matrix') {
            bracketStyle = 'padding:2px 3px;';
          }

          return `<span class="math-matrix" data-mtype="${mKind}" data-mrows="${encRows}" style="display:inline-flex;align-items:center;vertical-align:middle;margin:2px 4px;font-family:'Cambria Math','Times New Roman',serif;${bracketStyle}"><table style="display:inline-table;border-collapse:collapse;vertical-align:middle;font-size:0.95em;line-height:1.2;"><tbody>${trHtml}</tbody></table></span>`;
        });

        out = out.replace(/⟦SQRT:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, rad, idx) => {
          changed = true;
          const cleanRad = rad.trim();
          const cleanIdx = idx.trim();
          const encRad = encodeURIComponent(cleanRad);
          const encIdx = encodeURIComponent(cleanIdx);
          if (cleanIdx) {
            return `<span class="math-sqrt" data-rad="${encRad}" data-idx="${encIdx}" style="display:inline-flex;align-items:baseline;vertical-align:middle;"><sup style="font-size:0.7em;margin-right:1px;">${cleanIdx}</sup><span>&radic;</span><span style="text-decoration:overline;border-top:1px solid currentColor;padding:0 2px;line-height:1.1;">${cleanRad}</span></span>`;
          }
          return `<span class="math-sqrt" data-rad="${encRad}" data-idx="" style="display:inline-flex;align-items:baseline;vertical-align:middle;"><span>&radic;</span><span style="text-decoration:overline;border-top:1px solid currentColor;padding:0 2px;line-height:1.1;">${cleanRad}</span></span>`;
        });

        out = out.replace(/⟦FRAC:([^⟦⟧]*?)::([^⟦⟧]*?)⟧/g, (_, num, den) => {
          changed = true;
          const cleanNum = num.trim();
          const cleanDen = den.trim();
          const encNum = encodeURIComponent(cleanNum);
          const encDen = encodeURIComponent(cleanDen);
          return `<span class="math-frac" data-num="${encNum}" data-den="${encDen}" style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:0.92em;line-height:1.1;margin:0 2px;"><span style="border-bottom:1px solid currentColor;padding:0 3px;">${cleanNum}</span><span style="padding:0 3px;">${cleanDen}</span></span>`;
        });

        if (!changed) break;
      }

      out = out.replace(/\\+\s*(?=<span class="math-)/g, '');
      return out;
    };

    return renderNestedTokens(s);
  };

  const wordCompatibleFractions = (html = '') => {
    if (!html) return '';
    const container = document.createElement('div');
    container.innerHTML = String(html);

    const sqrts = Array.from(container.querySelectorAll('.math-sqrt'));
    sqrts.forEach((el) => {
      const radRaw = decodeURIComponent(el.getAttribute('data-rad') || '');
      const idxRaw = decodeURIComponent(el.getAttribute('data-idx') || '');
      const spanSqrt = document.createElement('span');
      const idxHtml = idxRaw ? `<sup style="font-size:0.75em;">${idxRaw}</sup>` : '';
      spanSqrt.innerHTML = `<span style="white-space:nowrap;">${idxHtml}&radic;<span style="text-decoration:overline;border-top:1pt solid #000;padding:0 1.5pt;">${radRaw}</span></span>`;
      el.replaceWith(spanSqrt);
    });

    const fracs = Array.from(container.querySelectorAll('.math-frac'));
    fracs.forEach((el) => {
      const numRaw = decodeURIComponent(el.getAttribute('data-num') || '');
      const denRaw = decodeURIComponent(el.getAttribute('data-den') || '');
      const spanReplacement = document.createElement('span');
      spanReplacement.innerHTML = `<table style="display:inline-table;vertical-align:middle;border-collapse:collapse;margin:0 2pt;font-family:'Cambria Math','Times New Roman',serif;font-size:10pt;line-height:1;"><tr><td style="border-bottom:1pt solid #000;text-align:center;padding:0 2pt 1pt 2pt;">${numRaw}</td></tr><tr><td style="text-align:center;padding:1pt 2pt 0 2pt;">${denRaw}</td></tr></table>`;
      el.replaceWith(spanReplacement);
    });

    const matrices = Array.from(container.querySelectorAll('.math-matrix'));
    matrices.forEach((el) => {
      const mKind = el.getAttribute('data-mtype') || 'bmatrix';
      const innerTable = el.querySelector('table');
      if (!innerTable) return;
      const rowsHtml = innerTable.innerHTML;
      const rowCount = Math.max(1, innerTable.querySelectorAll('tr').length);
      const isVmat = mKind === 'vmatrix' || mKind === 'Vmatrix';
      const isPmat = mKind === 'pmatrix';

      const leftBorder = isVmat ? '1.2pt solid #000' : '1.5pt solid #000';
      const rightBorder = isVmat ? '1.2pt solid #000' : '1.5pt solid #000';
      const topBottomTick = !isVmat && !isPmat ? '1.5pt solid #000' : 'none';

      const wrapperSpan = document.createElement('span');
      wrapperSpan.innerHTML = `<table style="display:inline-table;vertical-align:middle;border-collapse:collapse;margin:2pt 3pt;font-family:'Cambria Math','Times New Roman',serif;font-size:10.5pt;line-height:1.15;"><tr><td rowspan="${rowCount}" style="border-left:${leftBorder};border-top:${topBottomTick};border-bottom:${topBottomTick};width:3pt;padding:0;">&nbsp;</td><td><table style="border-collapse:collapse;font-family:'Cambria Math','Times New Roman',serif;font-size:10.5pt;">${rowsHtml}</table></td><td rowspan="${rowCount}" style="border-right:${rightBorder};border-top:${topBottomTick};border-bottom:${topBottomTick};width:3pt;padding:0;">&nbsp;</td></tr></table>`;
      el.replaceWith(wrapperSpan);
    });

    return container.innerHTML;
  };

  const formatMatchingAnswerKey = (rawAnswer = '', premises = [], options = []) => {
    const str = String(rawAnswer || '').trim();
    const pairs = [...str.matchAll(/(\d+)\s*[-:=–—>]\s*([A-Za-zأبجدهوزحطي])/g)];
    if (pairs.length > 0) {
      return pairs.map((m) => `${m[1]}-${m[2].toUpperCase()}`).join(', ');
    }
    if (str) return str;
    if (Array.isArray(premises) && premises.length > 0) {
      return premises.map((_, i) => `${i + 1}-${String.fromCharCode(65 + i)}`).join(', ');
    }
    return '-';
  };

  const ensureCompletePgkStructure = (q, cfg = config) => {
    if (!q) return q;
    const bLower = String(q.bentukSoal || '').toLowerCase();
    if (!bLower.includes('kompleks')) return q;

    const optCount = parseInt(cfg?.optionCount, 10) || 4;
    let qText = cleanPgkNumbering(q.question || '', false);
    const lines = qText
      .split(/\n+/)
      .map((l) => l.trim())
      .filter((l) => l && !/^[1-6][\.\)]\s+/.test(l));
    qText = lines.join(' ').trim() || qText;

    let opts = Array.isArray(q.options)
      ? q.options.map((o) => cleanPgkNumbering(o, true)).filter(Boolean)
      : [];

    const hasLegacyComboOpts = opts.some((o) =>
      /^(?:semua\s+benar|all\s+are\s+correct|hanya\s+\d|[1-4]\s*,\s*[1-4]|[1-4]\s+(?:dan|and)\s+[1-4])$/i.test(
        o.trim()
      )
    );

    if (opts.length < 2 || hasLegacyComboOpts) {
      const fb = buildFallbackQuestionItem(0, 'PG Kompleks', q.bloomLevel || 'C3', q.visualType || 'none', cfg);
      opts = fb.options.slice(0, optCount);
    }

    return {
      ...q,
      question: qText,
      options: opts
    };
  };

  const diversifyPgkClosingQuestions = (questions = []) => {
    if (!Array.isArray(questions)) return [];
    return questions.map((q) => {
      if (!q) return q;
      const isPgk = String(q.bentukSoal || '').toLowerCase().includes('kompleks');
      if (!isPgk) return q;
      return {
        ...q,
        question: cleanPgkNumbering(q.question || '', false)
      };
    });
  };

  const isMultipleChoice = (q) => {
    const b = String(q?.bentukSoal || '').toLowerCase();
    return b === 'pg' || b === 'pilihan ganda' || b === 'multiple choice';
  };

  const resolveCorrectOptionIndex = (q) => {
    if (!q || !Array.isArray(q.options) || q.options.length === 0) return 0;
    const ans = String(q.answer || '').trim();
    const letterMatch = ans.match(/^\s*([A-Ea-eأبجده])\b/);
    if (letterMatch) {
      const ch = letterMatch[1].toUpperCase();
      const arIdx = ['أ', 'ب', 'ج', 'د', 'ه'].indexOf(ch);
      if (arIdx !== -1 && arIdx < q.options.length) return arIdx;
      const idx = ch.charCodeAt(0) - 65;
      if (idx >= 0 && idx < q.options.length) return idx;
    }
    const cleanAns = ans.replace(/^[A-Ea-eأبجده][\.\)]\s*/, '').trim().toLowerCase();
    const foundIdx = q.options.findIndex((o) => String(o || '').trim().toLowerCase() === cleanAns);
    return foundIdx >= 0 ? foundIdx : 0;
  };

  const balanceMultipleChoiceAnswers = (questions = []) => {
    if (!Array.isArray(questions)) return [];
    const useAr = isArabicActive();
    return questions.map((q, idx) => {
      if (!isMultipleChoice(q) || !Array.isArray(q.options) || q.options.length < 2) {
        return q;
      }
      const currentCorrectIdx = resolveCorrectOptionIndex(q);
      const targetIdx = idx % q.options.length;
      const newOpts = [...q.options];
      if (currentCorrectIdx !== targetIdx && currentCorrectIdx < newOpts.length) {
        const temp = newOpts[targetIdx];
        newOpts[targetIdx] = newOpts[currentCorrectIdx];
        newOpts[currentCorrectIdx] = temp;
      }
      const correctLabel = getOptionLabel(targetIdx, useAr);
      const correctText = newOpts[targetIdx];
      return {
        ...q,
        options: newOpts,
        answer: `${correctLabel}. ${correctText}`
      };
    });
  };

  const handleShuffleMultipleChoiceOptions = () => {
    if (!finalQuiz || !Array.isArray(finalQuiz.questions)) return;
    const useAr = isArabicActive();
    const shuffledQuestions = finalQuiz.questions.map((q) => {
      if (!isMultipleChoice(q) || !Array.isArray(q.options) || q.options.length < 2) {
        return q;
      }
      const currentIdx = resolveCorrectOptionIndex(q);
      const pairs = q.options.map((opt, i) => ({ opt, isCorrect: i === currentIdx }));
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }
      const newCorrectIdx = Math.max(0, pairs.findIndex((p) => p.isCorrect));
      const newOpts = pairs.map((p) => p.opt);
      const label = getOptionLabel(newCorrectIdx, useAr);
      return {
        ...q,
        options: newOpts,
        answer: `${label}. ${newOpts[newCorrectIdx]}`
      };
    });
    setFinalQuiz((prev) => ({ ...prev, questions: shuffledQuestions }));
    showToast('Urutan pilihan jawaban PG berhasil diacak!', 'success');
  };

  const buildAutoTopicByAssessment = (cfg) => {
    const type = String(cfg?.assessmentType || '');
    const parts = [cfg?.curriculum, 'MI', cfg?.grade, cfg?.subject]
      .map(v => String(v || '').trim())
      .filter(Boolean);
    const prefix = parts.join(' ');
    if (type === 'STS (Sumatif Tengah Semester)') {
      return `${prefix ? prefix + ' ' : ''}Tengah semester`.trim();
    }
    if (type === 'SAS (Sumatif Akhir Semester)') {
      return `${prefix ? prefix + ' ' : ''}Semester 1 atau 2`.trim();
    }
    if (type === 'TKA') {
      return `${prefix ? prefix + ' ' : ''}Tes Kemampuan Akademik (TKA) Madrasah Ibtidaiyah`.trim();
    }
    if (type === 'OSN') {
      return `${prefix ? prefix + ' ' : ''}Latihan Olimpiade Sains Nasional (OSN) MI`.trim();
    }
    if (type === 'OMI') {
      return `${prefix ? prefix + ' ' : ''}Latihan Olimpiade Madrasah Indonesia (OMI) MI Terintegrasi`.trim();
    }
    return null;
  };

  const getTotalQuestions = (cfg = config) => {
    return (
      (parseInt(cfg.pgCount, 10) || 0) +
      (parseInt(cfg.pgKompleksCount, 10) || 0) +
      (parseInt(cfg.menjodohkanCount, 10) || 0) +
      (parseInt(cfg.benarSalahCount, 10) || 0) +
      (parseInt(cfg.isianCount, 10) || 0) +
      (parseInt(cfg.uraianCount, 10) || 0)
    );
  };

  const getCustomBloomTotal = (bloomObj = config.customBloomCounts) => {
    return ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'].reduce(
      (acc, k) => acc + (parseInt(bloomObj?.[k], 10) || 0),
      0
    );
  };

  const getCustomSoloTotal = (soloObj = config.customSoloCounts) => {
    return ['Prestructural', 'Unistructural', 'Multistructural', 'Relational', 'ExtendedAbstract'].reduce(
      (acc, k) => acc + (parseInt(soloObj?.[k], 10) || 0),
      0
    );
  };

  const distributeDefaultBloomCounts = (total) => {
    const levels = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'];
    const base = Math.floor(total / 6);
    let rem = total % 6;
    const next = {};
    levels.forEach((lvl) => {
      next[lvl] = base + (rem > 0 ? 1 : 0);
      if (rem > 0) rem -= 1;
    });
    return next;
  };

  const distributeDefaultSoloCounts = (total) => {
    const levels = ['Unistructural', 'Multistructural', 'Relational', 'ExtendedAbstract'];
    const base = Math.floor(total / 4);
    let rem = total % 4;
    const next = { Prestructural: 0 };
    levels.forEach((lvl) => {
      next[lvl] = base + (rem > 0 ? 1 : 0);
      if (rem > 0) rem -= 1;
    });
    return next;
  };

  const sanitizeLeadingZeros = (rawVal) => {
    const digits = String(rawVal ?? '').replace(/[^0-9]/g, '');
    if (!digits) return '';
    return digits.replace(/^0+(?=\d)/, '');
  };

  const handleNumberFocusSelect = (e) => {
    if (String(e.target.value) === '0') {
      e.target.select();
    }
  };

  const handleInputChange = (e) => {
    const { name, value } = e.target;
    const countFields = [
      'pgCount',
      'pgKompleksCount',
      'menjodohkanCount',
      'benarSalahCount',
      'isianCount',
      'uraianCount',
      'aiIllustrationCount',
      'chartCount',
      'conceptMapCount',
      'multiStimulusCount',
      'questionsPerStimulus'
    ];

    if (countFields.includes(name)) {
      const cleanedStr = sanitizeLeadingZeros(value);
      if (e.target && e.target.value !== cleanedStr && cleanedStr !== '') {
        e.target.value = cleanedStr;
      }
      let numVal = cleanedStr === '' ? '' : Math.max(0, parseInt(cleanedStr, 10) || 0);
      if (name === 'questionsPerStimulus' && numVal !== '') {
        numVal = Math.min(8, Math.max(3, numVal));
      }
      if (name === 'multiStimulusCount' && numVal !== '') {
        numVal = Math.min(15, Math.max(1, numVal));
      }
      const visualFields = ['aiIllustrationCount', 'chartCount', 'conceptMapCount'];

      if (visualFields.includes(name)) {
        const currentTotalQ = getTotalQuestions(config);
        if (numVal !== '' && numVal > currentTotalQ) {
          numVal = currentTotalQ;
          if (e.target) e.target.value = String(currentTotalQ);
          showToast(`Jumlah maksimal soal bergambar adalah ${currentTotalQ} soal (sesuai jumlah soal yang diinput).`, 'error');
        }
        const tempVisualCfg = { ...config, [name]: numVal };
        const otherVisualSum = visualFields
          .filter((f) => f !== name)
          .reduce((acc, f) => acc + (parseInt(tempVisualCfg[f], 10) || 0), 0);
        if (numVal !== '' && otherVisualSum + numVal > currentTotalQ) {
          const allowedMax = Math.max(0, currentTotalQ - otherVisualSum);
          numVal = allowedMax;
          if (e.target) e.target.value = String(allowedMax);
          showToast(`Total gabungan soal bergambar maksimal ${currentTotalQ} soal (sesuai jumlah soal yang diinput).`, 'error');
        }
      }

      const nextConfig = { ...config, [name]: numVal };
      const totalQ = getTotalQuestions(nextConfig);
      if (totalQ > 50 && !visualFields.includes(name) && name !== 'multiStimulusCount' && name !== 'questionsPerStimulus') {
        showToast('Maksimal total keseluruhan soal adalah 50 butir.', 'error');
        return;
      }
      if (!visualFields.includes(name) && name !== 'multiStimulusCount' && name !== 'questionsPerStimulus') {
        let remVisual = totalQ;
        visualFields.forEach((vf) => {
          const curV = parseInt(nextConfig[vf], 10) || 0;
          if (curV > remVisual) {
            nextConfig[vf] = remVisual;

          remVisual = Math.max(0, remVisual - (parseInt(nextConfig[vf], 10) || 0));

      if (config.difficultyProfile === 'custom' && !visualFields.includes(name) && name !== 'multiStimulusCount' && name !== 'questionsPerStimulus') {

      setConfig(nextConfig);

    if (name === 'level') {

        grade: '',
        subject: '',

      } else if (file.name.endsWith('.docx')) {
        if (!window.JSZip) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        const zip = await window.JSZip.loadAsync(file);
        const docXml = await zip.file('word/document.xml')?.async('string');
        if (docXml) {
          const stripped = docXml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

  const parseAndRecoverQuizJson = (rawText) => {
    if (!rawText) return null;
    let cleaned = String(rawText)
      .replace(/^```(?:json)?\s*/i, '')
      .replace(/\s*```$/i, '')
      .trim();

    const firstBrace = cleaned.indexOf('{');
    const firstBracket = cleaned.indexOf('[');
    if (firstBrace === -1 && firstBracket === -1) return null;

    let candidate = cleaned;
    if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) {
      const lastBrace = cleaned.lastIndexOf('}');
      candidate = lastBrace > firstBrace ? cleaned.slice(firstBrace, lastBrace + 1) : cleaned.slice(firstBrace);
    } else if (firstBracket !== -1) {
      const lastBracket = cleaned.lastIndexOf(']');
      const arrSlice = lastBracket > firstBracket ? cleaned.slice(firstBracket, lastBracket + 1) : cleaned.slice(firstBracket);
      candidate = `{"questions": ${arrSlice}}`;
    }

    try {
      const parsed = JSON.parse(sanitizeRawJsonMath(candidate));
      if (Array.isArray(parsed)) return { title: 'Naskah Ujian MI', questions: parsed };
      if (parsed && (Array.isArray(parsed.questions) || parsed.question)) return parsed;
    } catch (e1) {
      // Lanjut ke percobaan 2
    }

    try {
      const safeEscaped = candidate
        .replace(/\r\n/g, '\n')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]+/g, ' ')
        .replace(/\\(?!["\\/bfnrtu])/g, '\\\\');
      const parsed2 = JSON.parse(safeEscaped);
      if (Array.isArray(parsed2)) return { title: 'Naskah Ujian MI', questions: parsed2 };
      if (parsed2 && (Array.isArray(parsed2.questions) || parsed2.question)) return parsed2;
    } catch (e2) {
      // Lanjut ke percobaan 3
    }

    try {
      const bracketIdx = candidate.indexOf('[');
      if (bracketIdx !== -1) {
        const recoveredQuestions = [];
        let i = bracketIdx + 1;
        const len = candidate.length;

        while (i < len) {
          while (i < len && candidate[i] !== '{' && candidate[i] !== ']') i++;
          if (i >= len || candidate[i] === ']') break;

          const objStart = i;
          let depth = 0;
          let inStr = false;
          let esc = false;
          let objEnd = -1;

          for (let j = objStart; j < len; j++) {
            const ch = candidate[j];
            if (esc) {
              esc = false;
              continue;
            }
            if (ch === '\\') {
              esc = true;
              continue;
            }
            if (ch === '"') {
              inStr = !inStr;
              continue;
            }
            if (!inStr) {
              if (ch === '{') depth++;
              else if (ch === '}') {
                depth--;
                if (depth === 0) {
                  objEnd = j + 1;
                  break;
                }
              }
            }
          }

          if (objEnd !== -1) {
            const rawObjStr = candidate.slice(objStart, objEnd);
            try {
              const qObj = JSON.parse(sanitizeRawJsonMath(rawObjStr));
              if (qObj && qObj.question) recoveredQuestions.push(qObj);
            } catch (eObj1) {
              try {
                const qObj2 = JSON.parse(
                  rawObjStr
                    .replace(/[\u0000-\u001F]+/g, ' ')
                    .replace(/\\(?!["\\/bfnrtu])/g, '\\\\')
                );
                if (qObj2 && qObj2.question) recoveredQuestions.push(qObj2);
              } catch (eObj2) {
                // lewati objek yang rusak
              }
            }
            i = objEnd;
          } else {
            break;
          }
        }

        if (recoveredQuestions.length > 0) {
          return {
            title: 'Naskah Ujian MI',
            questions: recoveredQuestions
          };
        }
      }
    } catch (e3) {
      // ignore
    }

    return null;
  };

          `إِهْمَالُ الشُّرُوْطِ الرَّئِيْسِيَّةِ فِي المَوْضُوْعِ`,
          `الاعْتِمَادُ عَلَى التَّخْمِيْنِ دُوْنَ الرُّجُوْعِ إِلَى الأَدِلَّةِ`,
          `تَجَاهُلُ النَّتَائِجِ المَتَرَتِّبَةِ عَلَى تَطْبِيْقِ المَفْهُوْمِ`
        ].slice(0, optCount)
      : isIslamic
      ? [
          `Menjaga persatuan, ukhuwah, dan mengamalkan prinsip ${top} secara konsisten`,
          `Mengutamakan kepentingan pribadi di atas kepentingan bersama`,
          `Menunda pelaksanaan kewajiban ibadah tanpa alasan syar'i`,
          `Mengabaikan adab dan akhlak mulia dalam bergaul`
        ].slice(0, optCount)
      : useEn
      ? [
          `Applying the core principles of ${top} accurately in daily situations`,
          `Ignoring the basic rules required in the topic`,
          `Drawing conclusions without checking the facts`,
          `Disregarding the main objective of the lesson`
        ].slice(0, optCount)
      : [
          `Memahami konsep dasar ${top} dan menerapkannya secara tepat dalam kehidupan sehari-hari`,
          `Mengabaikan aturan utama yang berlaku pada materi ${top}`,
          `Menyimpulkan masalah tanpa memperhatikan fakta yang ada`,
          `Menolak bekerja sama saat menyelesaikan tugas kelompok`
        ].slice(0, optCount);

    return {
      bentukSoal: 'PG',
      question: pgQ,
      matchingPremises: [],
      options: pgOpts,
      answer: `${getOptionLabel(0, useAr)}. ${pgOpts[0]}`,
      explanation: `Jawaban yang tepat sesuai dengan kaidah dan pemahaman konsep dasar pada materi ${top} jenjang MI.`,
      bloomLevel,
      cp: `Memahami konsep ${top} pada mata pelajaran ${subj} jenjang MI.`,
      tp: `Peserta didik MI mampu menyelesaikan soal terkait ${top} dengan tepat.`,
      materi: top,
      indicator: `Disajikan permasalahan mengenai ${top}, peserta didik dapat menentukan jawaban yang tepat.`,
      visualType,
      visualDescription: visDesc
    };
  };

  const handleGenerateQuiz = async () => {
    if (!config.grade || !config.subject) {
      showToast('Mohon pilih Kelas MI dan Mata Pelajaran terlebih dahulu.', 'error');
      return;
    }
    if (!config.topic.trim()) {
      showToast('Mohon isi Topik / Materi Spesifik terlebih dahulu.', 'error');
      return;
    }
    const totalQuestions = getTotalQuestions();
    if (totalQuestions <= 0) {
      showToast('Total soal minimal 1 butir.', 'error');
      return;
    }
    if (config.difficultyProfile === 'custom') {
      if (config.taxonomyType === 'solo') {
        const soloSum = getCustomSoloTotal();
        if (soloSum !== totalQuestions) {
          showToast(`Total bobot level SOLO (${soloSum} soal) harus sama dengan Total Keseluruhan Soal (${totalQuestions} soal).`, 'error');
          return;
        }
      } else {
        const bloomSum = getCustomBloomTotal();
        if (bloomSum !== totalQuestions) {
          showToast(`Total bobot level C1-C6 (${bloomSum} soal) harus sama dengan Total Keseluruhan Soal (${totalQuestions} soal).`, 'error');
          return;
        }
      }
    }

    setLoading(true);
    setGenerationSuccess(false);
    setProgress(8);
    setGeneratedImages({});
    setStimulusByQuestion({});

    if (progressInterval.current) clearInterval(progressInterval.current);
    progressInterval.current = setInterval(() => {
      setProgress((prev) => (prev < 90 ? prev + Math.floor(Math.random() * 7) + 2 : prev));
    }, 600);

    try {
      const useArabic = isArabicActive(config);
      const useEnglish = isEnglishActive(config);
      const isIslamicContext = /agama|pai|islam|qur'?an|hadis|hadits|fikih|fiqih|akidah|aqidah|akhlak|ski|sejarah kebudayaan islam|bahasa arab|tajwid|ayat|surah|surat|sholat|salat|zakat|puasa|haji|iman|tauhid|doa|dzikir|zikir|wudhu|thaharah|muamalah|waris|mawaris/i.test(
        `${config.subject || ''} ${config.topic || ''}`
      );
      const arabicRule = useArabic
        ? `\nATURAN MUTLAK BAHASA ARAB (PENTING!):
- NASKAH SOAL ("question", "matchingPremises", dan "options") WAJIB 100% FULL BAHASA ARAB FUSHA LENGKAP DENGAN HARAKAT/SYAKAL (تَشْكِيْل كَامِل) yang sesuai tingkat bacaan siswa Madrasah Ibtidaiyah (MI) tanpa ada kata Bahasa Indonesia sedikit pun di dalam teks soal maupun opsi jawaban!
- SEDANGKAN untuk Kunci Jawaban & Pembahasan ("answer" dan "explanation"), Kisi-Kisi ("cp", "tp", "materi", "indicator"), serta "visualDescription" WAJIB TETAP MENGGUNAKAN BAHASA INDONESIA yang jelas.`
        : isIslamicContext
        ? `\nATURAN KHUSUS MATA PELAJARAN AGAMA / KEISLAMAN JENJANG MI (BAHASA SOAL: BAHASA INDONESIA):
- BAHASA MAYORITAS untuk narasi soal, kalimat pertanyaan, pernyataan, dan pilihan jawaban WAJIB menggunakan BAHASA INDONESIA yang ramah dan sesuai usia siswa Madrasah Ibtidaiyah (MI).
- NAMUN apabila konteks butir soal membutuhkan dalil atau lafaz berbahasa Arab (seperti kutipan ayat Al-Qur'an pendek, potongan Hadis, bacaan doa sehari-hari, niat/bacaan salat, contoh hukum tajwid, atau mufradat Bahasa Arab MI), WAJIB tuliskan teks Arab aslinya LENGKAP DENGAN HARAKAT/SYAKAL (contoh: قُلْ هُوَ اللّٰهُ أَحَدٌ atau إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ) yang dipadukan secara alami di dalam soal/opsi berbahasa Indonesia tersebut.`
        : '';

      const miLevelPedagogyRule = `\nATURAN KHUSUS JENJANG MADRASAH IBTIDAIYAH (MI - ${config.grade}):
- Sesuaikan tingkat kesulitan bahasa, panjang kalimat, konteks kehidupan sehari-hari anak usia MI (7–12 tahun), dan kedalaman materi dengan Capaian Pembelajaran (CP) Madrasah Ibtidaiyah (${config.grade}) Kemenag/Kemendikdasmen.
- Gunakan bahasa yang komunikatif, jelas, edukatif, dan tidak menggunakan istilah teknis perguruan tinggi/SMA yang terlalu rumit bagi siswa MI.`;

      const isOsnMode = config.assessmentType === 'OSN';
      const isOmiMode = config.assessmentType === 'OMI';
      const isTkaMode = config.assessmentType === 'TKA';

      const osnStrictRules = isOsnMode
        ? `\nATURAN KHUSUS SOAL LATIHAN OSN JENJANG MI:
- Buat soal latihan setara Olimpiade Sains Nasional (OSN) tingkat SD/MI bidang ${config.subject} (${config.grade}) yang menguji logika, pemecahan masalah kreatif, dan penalaran bertingkat (HOTS C4-C6) namun tetap berada dalam batas kurikulum tingkat dasar/MI.`
        : '';

      const omiStrictRules = isOmiMode
        ? `\nATURAN KHUSUS SOAL OMI (OLIMPIADE MADRASAH INDONESIA / KSM) JENJANG MI:
- Buat soal setara Olimpiade Madrasah Indonesia (OMI / KSM Kemenag) tingkat MI bidang ${config.subject} Terintegrasi yang memadukan konsep sains/matematika/IPAS dengan konteks keislaman (Al-Qur'an berharakat, Hadis, Fikih ibadah/zakat/waktu salat, atau sejarah Islam) secara organik dan bermakna sesuai tingkat pemahaman siswa MI.`
        : '';

      const tkaStrictRules = isTkaMode
        ? `\nSTANDAR KERANGKA ASESMEN TKA JENJANG MI:
- Soal mengukur literasi/numerasi/penalaran akademik esensial tingkat MI (${config.grade}) berbasis stimulus kontekstual fungsional, bebas ambiguitas, dan opsi pengecoh homogen.`
        : '';

      const bloomSpec =
        config.taxonomyType === 'solo'
          ? config.difficultyProfile === 'custom'
            ? `Menggunakan Taksonomi SOLO dengan Distribusi Kustom (WAJIB TEPAT SESUAI JUMLAH INI): Pre-structural=${config.customSoloCounts.Prestructural || 0} soal, Uni-structural=${config.customSoloCounts.Unistructural || 0} soal, Multi-structural=${config.customSoloCounts.Multistructural || 0} soal, Relational=${config.customSoloCounts.Relational || 0} soal, Extended Abstract=${config.customSoloCounts.ExtendedAbstract || 0} soal.`
            : config.difficultyProfile === 'hots' || isOsnMode || isOmiMode || isTkaMode
            ? 'Menggunakan Taksonomi SOLO Fokus HOTS (Dominan level Relational dan Extended Abstract).'
            : config.difficultyProfile === 'basic'
            ? 'Menggunakan Taksonomi SOLO Fokus Dasar (Dominan level Uni-structural dan Multi-structural).'
            : 'Menggunakan Taksonomi SOLO Proporsional Standar Ujian MI (Campuran Uni-structural, Multi-structural, dan Relational).'
          : config.difficultyProfile === 'custom'
          ? `Distribusi Level Kognitif Taksonomi Bloom Kustom (WAJIB TEPAT SESUAI JUMLAH INI): C1=${config.customBloomCounts.C1} soal, C2=${config.customBloomCounts.C2} soal, C3=${config.customBloomCounts.C3} soal, C4=${config.customBloomCounts.C4} soal, C5=${config.customBloomCounts.C5} soal, C6=${config.customBloomCounts.C6} soal.`
          : config.difficultyProfile === 'hots' || isOsnMode || isOmiMode || isTkaMode
          ? 'Fokus HOTS Taksonomi Bloom (Dominan C4 Analisis, C5 Evaluasi, C6 Kreasi).'
          : config.difficultyProfile === 'basic'
          ? 'Fokus Dasar/LOTS Taksonomi Bloom (Dominan C1 Mengingat, C2 Memahami, C3 Menerapkan).'
          : 'Proporsional Standar Ujian MI Taksonomi Bloom (Campuran seimbang C1 sampai C4).';

      const fullPlan = [];
      const pushPlanItems = (cnt, bType) => {
        const c = parseInt(cnt, 10) || 0;
        for (let i = 0; i < c; i++) fullPlan.push({ bentukSoal: bType });
      };
      pushPlanItems(config.pgCount, 'PG');
      pushPlanItems(config.pgKompleksCount, 'PG Kompleks');
      pushPlanItems(config.menjodohkanCount, 'Menjodohkan');
      pushPlanItems(config.benarSalahCount, 'Benar/Salah');
      pushPlanItems(config.isianCount, 'Isian Singkat');
      pushPlanItems(config.uraianCount, 'Uraian');

      const levelSchedule = [];
      if (config.taxonomyType === 'solo') {
        if (config.difficultyProfile === 'custom') {
          [
            { k: 'Prestructural', l: 'SOLO: Pre-structural' },
            { k: 'Unistructural', l: 'SOLO: Uni-structural' },
            { k: 'Multistructural', l: 'SOLO: Multi-structural' },
            { k: 'Relational', l: 'SOLO: Relational' },
            { k: 'ExtendedAbstract', l: 'SOLO: Extended Abstract' }
          ].forEach((item) => {
            const c = parseInt(config.customSoloCounts?.[item.k], 10) || 0;
            for (let i = 0; i < c; i++) levelSchedule.push(item.l);
          });
        } else if (config.difficultyProfile === 'hots' || isOsnMode || isOmiMode || isTkaMode) {
          levelSchedule.push('SOLO: Relational', 'SOLO: Extended Abstract');
        } else if (config.difficultyProfile === 'basic') {
          levelSchedule.push('SOLO: Uni-structural', 'SOLO: Multi-structural');
        } else {
          levelSchedule.push('SOLO: Uni-structural', 'SOLO: Multi-structural', 'SOLO: Relational');
        }
      } else {
        if (config.difficultyProfile === 'custom') {
          ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'].forEach((lvl) => {
            const c = parseInt(config.customBloomCounts?.[lvl], 10) || 0;
            for (let i = 0; i < c; i++) levelSchedule.push(lvl);
          });
        } else if (config.difficultyProfile === 'hots' || isOsnMode || isOmiMode || isTkaMode) {
          levelSchedule.push('C4', 'C5', 'C6');
        } else if (config.difficultyProfile === 'basic') {
          levelSchedule.push('C1', 'C2', 'C3');
        } else {
          levelSchedule.push('C2', 'C3', 'C4');
        }
      }

      const visualSchedule = new Array(fullPlan.length).fill('none');
      const rawVisualList = [];
      for (let i = 0; i < (parseInt(config.aiIllustrationCount, 10) || 0); i++) rawVisualList.push('illustration');
      for (let i = 0; i < (parseInt(config.chartCount, 10) || 0); i++) rawVisualList.push('chart');
      for (let i = 0; i < (parseInt(config.conceptMapCount, 10) || 0); i++) rawVisualList.push('conceptMap');

      const shuffledQuestionIndices = Array.from({ length: fullPlan.length }, (_, i) => i);
      for (let i = shuffledQuestionIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledQuestionIndices[i], shuffledQuestionIndices[j]] = [shuffledQuestionIndices[j], shuffledQuestionIndices[i]];
      }
      rawVisualList.slice(0, fullPlan.length).forEach((vType, i) => {
        visualSchedule[shuffledQuestionIndices[i]] = vType;
      });

      const multiStimGroups = {};
      if (config.multiStimulusEnabled) {
        const stimCount = Math.max(1, parseInt(config.multiStimulusCount, 10) || 1);
        const qPerStim = Math.min(8, Math.max(3, parseInt(config.questionsPerStimulus, 10) || 3));
        const totalSlots = fullPlan.length;
        const maxPossibleGroups = Math.min(stimCount, Math.max(1, Math.floor(totalSlots / qPerStim)));
        const actualGroupLen = Math.min(qPerStim, totalSlots);

        const chosenStarts = [];
        const freeSlack = Math.max(0, totalSlots - maxPossibleGroups * actualGroupLen);
        const buckets = new Array(maxPossibleGroups + 1).fill(0);
        for (let s = 0; s < freeSlack; s++) {
          const randBucket = Math.floor(Math.random() * (maxPossibleGroups + 1));
          buckets[randBucket] += 1;
        }
        if (maxPossibleGroups === 1 && freeSlack > 0 && buckets[0] === 0 && Math.random() < 0.8) {
          const shift = Math.max(1, Math.floor(Math.random() * (freeSlack + 1)));
          buckets[0] = shift;
          buckets[1] = freeSlack - shift;
        }

        let posCursor = 0;
        for (let g = 0; g < maxPossibleGroups; g++) {
          posCursor += buckets[g];
          chosenStarts.push(posCursor);
          posCursor += actualGroupLen;
        }

        chosenStarts.forEach((startIdx, idxG) => {
          const g = idxG + 1;
          const startNo = startIdx + 1;
          const endIdx = Math.min(totalSlots, startIdx + actualGroupLen);
          const endNo = endIdx;
          const gId = `STIM_${g}`;
          const stimMode = config.multiStimulusType || 'narasi';
          multiStimGroups[gId] = {
            groupId: gId,
            groupIndex: g,
            startNo,
            endNo,
            stimMode
          };
          for (let k = startIdx; k < endIdx; k++) {
            fullPlan[k].stimulusGroupId = gId;
            fullPlan[k].stimulusGroupStart = startNo;
            fullPlan[k].stimulusGroupEnd = endNo;
            fullPlan[k].stimulusGroupMode = stimMode;
            fullPlan[k].isStimulusGroupLeader = k === startIdx;
            if (stimMode === 'gambar' || stimMode === 'campuran') {
              visualSchedule[k] = k === startIdx ? 'illustration' : 'none';
            }
          }
        });
      }

      fullPlan.forEach((item, idx) => {
        item.no = idx + 1;
        item.bloomLevel = levelSchedule[idx % Math.max(1, levelSchedule.length)] || 'C3';
        item.visualType = visualSchedule[idx] || 'none';
      });

      const batches = [];
      if (config.multiStimulusEnabled) {
        let idxCursor = 0;
        while (idxCursor < fullPlan.length) {
          let sliceEnd = Math.min(fullPlan.length, idxCursor + 12);
          const lastItem = fullPlan[sliceEnd - 1];
          if (lastItem?.stimulusGroupId && lastItem.stimulusGroupEnd > sliceEnd && lastItem.stimulusGroupEnd - idxCursor <= 16) {
            sliceEnd = lastItem.stimulusGroupEnd;
          } else if (lastItem?.stimulusGroupId && lastItem.stimulusGroupStart > idxCursor + 1 && lastItem.stimulusGroupEnd > sliceEnd) {
            sliceEnd = lastItem.stimulusGroupStart - 1;
          }
          batches.push(fullPlan.slice(idxCursor, sliceEnd));
          idxCursor = sliceEnd;
        }
      } else {
        const BATCH_SIZE = 12;
        for (let i = 0; i < fullPlan.length; i += BATCH_SIZE) {
          batches.push(fullPlan.slice(i, i + BATCH_SIZE));
        }
      }

      const buildBatchPrompt = (batchItems, batchIdx, totalBatches, prevQuestionsSummary = '') => {
        const batchSpecLines = batchItems
          .map(
            (it) =>
              `  * Soal Nomor ${it.no}: Bentuk="${it.bentukSoal}", Level="${it.bloomLevel}", visualType="${it.visualType}"${
                it.stimulusGroupId
                  ? `, KelompokStimulus="${it.stimulusGroupId}" (Soal Nomor ${it.stimulusGroupStart} s.d. ${it.stimulusGroupEnd} WAJIB mengacu pada SATU stimulus bersama berjenis "${it.stimulusGroupMode}")`
                  : ''
              }`
          )
          .join('\n');

        const activeStimGroupsInBatch = [];
        const seenGIds = new Set();
        batchItems.forEach((it) => {
          if (it.stimulusGroupId && !seenGIds.has(it.stimulusGroupId)) {
            seenGIds.add(it.stimulusGroupId);
            activeStimGroupsInBatch.push(multiStimGroups[it.stimulusGroupId]);
          }
        });

        const multiStimRuleText =
          activeStimGroupsInBatch.length > 0
            ? `\nATURAN WAJIB STIMULUS MULTI-SOAL:
${activeStimGroupsInBatch
  .map(
    (g) =>
      `- Kelompok "${g.groupId}" untuk Soal Nomor ${g.startNo} s.d. Nomor ${g.endNo} (${g.endNo - g.startNo + 1} soal):
- Tuliskan ISI WACANA / NARASI / DATA KASUS / PERNYATAAN LENGKAP pada field "sharedStimulusText" di setiap butir soal Nomor ${g.startNo} s.d. Nomor ${g.endNo}, serta isi "stimulusGroupId" dengan "${g.groupId}".`
  )
  .join('\n')}`
            : '';

        return `Anda adalah pakar penyusun soal ujian Madrasah Ibtidaiyah (MI) profesional di Indonesia (KKMI Kecamatan Wonomerto).
Susun naskah soal ujian berkualitas tinggi (Gelombang ${batchIdx + 1} dari ${totalBatches}, berisi tepat ${batchItems.length} butir soal untuk Nomor ${batchItems[0].no} s.d. Nomor ${batchItems[batchItems.length - 1].no}) dengan rincian berikut:
- Kurikulum: ${config.curriculum}
- Jenjang / Kelas: Madrasah Ibtidaiyah (MI) - ${config.grade}
- Mata Pelajaran: ${config.subject}
${config.assessmentType ? `- Jenis Asesmen / Ujian: ${config.assessmentType}` : ''}
- Bahasa Soal: ${
          useArabic
            ? 'NASKAH SOAL ("question", "matchingPremises", "options") WAJIB 100% FULL BAHASA ARAB BERHARAKAT LENGKAP (فُصْحَى مَشْكُوْلَة), sedangkan "answer", "explanation", "cp", "tp", "materi", "indicator", dan "visualDescription" WAJIB dalam BAHASA INDONESIA!'
            : useEnglish
            ? '100% FULL ENGLISH'
            : 'Bahasa Indonesia'
        }
- Materi / Topik / CP: ${config.topic}
- Profil Kognitif: ${bloomSpec}
- RINCIAN WAJIB TIAP NOMOR PADA GELOMBANG INI (TOTAL ${batchItems.length} SOAL):
${batchSpecLines}
- Jumlah opsi untuk PG dan PG Kompleks: tepat ${config.optionCount} opsi pilihan.
- Jumlah pasangan untuk Menjodohkan: tepat ${config.matchingOptionCount} pernyataan di kolom kiri dan tepat ${(parseInt(config.matchingOptionCount, 10) || 5) + (parseInt(config.matchingDistractorCount, 10) || 0)} pilihan jawaban di kolom kanan.
${prevQuestionsSummary ? `\n- HINDARI PENGULANGAN! Soal harus berbeda konsep/skenario dari soal gelombang sebelumnya:\n${prevQuestionsSummary}` : ''}
${miLevelPedagogyRule}${multiStimRuleText}${osnStrictRules}${omiStrictRules}${tkaStrictRules}${arabicRule}

ATURAN MUTLAK PENULISAN RUMUS & FORMAT SOAL:
1. Pangkat gunakan <sup>...</sup>, subskrip <sub>...</sub>, pecahan \\\\frac{pembilang}{penyebut}, akar \\\\sqrt{isi}, dan simbol Unicode asli: ×, ÷, ±, °, π, Δ, θ, α, β, →, ⇌, ≤, ≥, ≠, ≈.
2. Untuk PG Kompleks: siswa memilih lebih dari satu jawaban benar langsung dari opsi A-${getOptionLabel((parseInt(config.optionCount, 10) || 4) - 1, false)}. Tanpa teks "(Pilihlah lebih dari satu jawaban yang benar!)" dan tanpa kotak ☐.
3. Untuk Menjodohkan: "matchingPremises" tanpa nomor "1.", "options" tanpa huruf "A.", dan "answer" berformat pasangan singkat "1-C, 2-A, 3-B".

Keluarkan HANYA JSON valid dengan struktur:
{
  "title": "Judul Naskah Ujian MI",
  "questions": [
    {
      "bentukSoal": "PG | PG Kompleks | Menjodohkan | Benar/Salah | Isian Singkat | Uraian",
      "question": "Teks pertanyaan...",
      "matchingPremises": ["Premis 1", "Premis 2"],
      "options": ["Opsi A tanpa huruf A.", "Opsi B tanpa huruf B."],
      "answer": "Jawaban benar",
      "explanation": "Pembahasan lengkap langkah demi langkah...",
      "bloomLevel": "C1/C2/C3/C4/C5/C6",
      "cp": "Capaian Pembelajaran MI",
      "tp": "Tujuan Pembelajaran MI",
      "materi": "Materi Pokok",
      "indicator": "Disajikan ..., peserta didik dapat ...",
      "visualType": "none | illustration | chart | conceptMap",
      "visualDescription": "Deskripsi visual atau '-'",
      "stimulusGroupId": "STIM_1 atau kosong",
      "sharedStimulusText": "Teks wacana stimulus bersama (atau kosong)"
    }
  ]
}`;
      };

      const quizResponseSchema = {
        type: 'OBJECT',
        properties: {
          title: { type: 'STRING' },
          questions: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                bentukSoal: { type: 'STRING' },
                question: { type: 'STRING' },
                matchingPremises: { type: 'ARRAY', items: { type: 'STRING' } },
                options: { type: 'ARRAY', items: { type: 'STRING' } },
                answer: { type: 'STRING' },
                explanation: { type: 'STRING' },
                bloomLevel: { type: 'STRING' },
                cp: { type: 'STRING' },
                tp: { type: 'STRING' },
                materi: { type: 'STRING' },
                indicator: { type: 'STRING' },
                visualType: { type: 'STRING' },
                visualDescription: { type: 'STRING' },
                stimulusGroupId: { type: 'STRING' },
                sharedStimulusText: { type: 'STRING' }
              },
              required: [
                'bentukSoal',
                'question',
                'options',
                'answer',
                'explanation',
                'bloomLevel',
                'cp',
                'tp',
                'materi',
                'indicator',
                'visualType',
                'visualDescription',
                'matchingPremises',
                'stimulusGroupId',
                'sharedStimulusText'
              ]
            }
          }
        },
        required: ['questions']
      };

      const fetchSingleBatch = async (batchItems, bIdx) => {
        const batchPrompt = buildBatchPrompt(batchItems, bIdx, batches.length, '');
        let batchQuestions = [];

        try {
          const rawResponse = await callGeminiContentApi({
            contents: [{ role: 'user', parts: [{ text: batchPrompt }] }],
            generationConfig: {
              temperature: 0.55,
              responseMimeType: 'application/json',
              responseSchema: quizResponseSchema
            }
          });
          const rawText = rawResponse?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
          const parsedBatch = parseAndRecoverQuizJson(rawText);
          if (parsedBatch && Array.isArray(parsedBatch.questions)) {
            batchQuestions = parsedBatch.questions;
          }
        } catch (err1) {
          const retryRes = await callGeminiContentApi({
            contents: [{ role: 'user', parts: [{ text: batchPrompt }] }],
            generationConfig: {
              temperature: 0.5,
              responseMimeType: 'application/json'
            }
          });
          const retryTxt = retryRes?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
          const parsedRetry = parseAndRecoverQuizJson(retryTxt);
          if (parsedRetry && Array.isArray(parsedRetry.questions)) {
            batchQuestions = parsedRetry.questions;
          }
        }

        if (batchQuestions.length < batchItems.length) {
          const missingItems = batchItems.slice(batchQuestions.length);
          const missingPrompt = buildBatchPrompt(
            missingItems,
            bIdx,
            batches.length,
            batchQuestions.map((q, i) => `${i + 1}. ${q.question}`).join('\n')
          );
          try {
            const missRes = await callGeminiContentApi({
              contents: [{ role: 'user', parts: [{ text: missingPrompt }] }],
              generationConfig: {
                temperature: 0.6,
                responseMimeType: 'application/json',
                responseSchema: quizResponseSchema
              }
            });
            const missTxt = missRes?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || '';
            const missParsed = parseAndRecoverQuizJson(missTxt);
            if (missParsed && Array.isArray(missParsed.questions)) {
              batchQuestions = [...batchQuestions, ...missParsed.questions];
            }
          } catch (missErr) {
            // abaikan
          }
        }

        if (batchQuestions.length < batchItems.length) {
          for (let mIdx = batchQuestions.length; mIdx < batchItems.length; mIdx++) {
            const spec = batchItems[mIdx] || {};
            batchQuestions.push(
              buildFallbackQuestionItem(
                (spec.no || mIdx + 1) - 1,
                spec.bentukSoal || 'PG',
                spec.bloomLevel || 'C3',
                spec.visualType || 'none',

              )
            );

        }

        return batchQuestions.slice(0, batchItems.length).map((q, idxInBatch) => {
          const targetSpec = batchItems[idxInBatch] || {};
          return {
            ...q,
            bentukSoal: targetSpec.bentukSoal || q.bentukSoal || 'PG',
            bloomLevel: q.bloomLevel || targetSpec.bloomLevel || 'C3',
            visualType: targetSpec.visualType || q.visualType || 'none',

      const allGeneratedQuestions = [];
      const CONCURRENCY = 2;
      for (let i = 0; i < batches.length; i += CONCURRENCY) {

            rawAns = useArabic ? 'أ. صَحِيْحٌ (Benar)' : `A. ${useEnglish ? 'True' : 'Benar'}`;
          } else if (/^(?:[bب]\.?\s*)?(?:salah|false|خطأ|خَطَأٌ)$/i.test(rawAns.trim())) {

          }

          ...q,

        const uniqueGroupIds = [
          ...new Set(normalizedQuestions.map((q) => q.stimulusGroupId).filter(Boolean))

        for (const gId of uniqueGroupIds) {
          if (!groupTextMap[gId]) {

${questionsContext}`;

      const newGroupVisDesc = parsed?.visualDescription || newQuestionsArr[0]?.visualDescription || leaderQ.visualDescription;

        if (!prev || !Array.isArray(prev.questions)) return prev;
        const updated = [...prev.questions];

        groupIndices.forEach((targetIdx, i) => {
          const oldQ = updated[targetIdx] || {};
          const rawNew = newQuestionsArr[i] || newQuestionsArr[newQuestionsArr.length - 1] || {};
          const bLower = String(rawNew.bentukSoal || oldQ.bentukSoal || 'PG').toLowerCase();
          const isPgk = bLower.includes('kompleks');
          const isMatching = bLower.includes('jodoh');
          const isBenarSalah =
            bLower.includes('benar') || bLower.includes('salah') || bLower.includes('true') || bLower.includes('false');

          let cleanedOpts = Array.isArray(rawNew.options)
            ? rawNew.options
                .map((o) =>
                  isMatching
                    ? cleanMatchingItemText(normalizeBrokenMathNotation(o), false)
                    : cleanPgkNumbering(normalizeBrokenMathNotation(o), isPgk)
                )
                .filter(Boolean)
            : oldQ.options || [];
          if (isBenarSalah) {
            cleanedOpts = useArabic ? ['صَحِيْحٌ', 'خَطَأٌ'] : useEnglish ? ['True', 'False'] : ['Benar', 'Salah'];
          }
          const cleanedPremises = Array.isArray(rawNew.matchingPremises)
            ? rawNew.matchingPremises
                .map((p) => cleanMatchingItemText(normalizeBrokenMathNotation(p), true))
                .filter(Boolean)
            : oldQ.matchingPremises || [];
          let rawAns = cleanPgkNumbering(normalizeBrokenMathNotation(rawNew.answer || ''), false);

          let mergedQ = {
            ...oldQ,
            ...rawNew,
            bentukSoal: oldQ.bentukSoal,
            bloomLevel: rawNew.bloomLevel || oldQ.bloomLevel,
            visualType: i === 0 ? oldQ.visualType : rawNew.visualType || oldQ.visualType,
            visualDescription: i === 0 && newGroupVisDesc && newGroupVisDesc !== '-' ? newGroupVisDesc : rawNew.visualDescription || oldQ.visualDescription,
            question: cleanPgkNumbering(normalizeBrokenMathNotation(rawNew.question || oldQ.question), false),
            options: cleanedOpts,
            matchingPremises: cleanedPremises,
            answer: isMatching ? formatMatchingAnswerKey(rawAns, cleanedPremises, cleanedOpts) : rawAns,
            explanation: normalizeBrokenMathNotation(rawNew.explanation || oldQ.explanation),
            stimulusGroupId: oldQ.stimulusGroupId,
            stimulusGroupStart: oldQ.stimulusGroupStart,
            stimulusGroupEnd: oldQ.stimulusGroupEnd,
            stimulusGroupMode: oldQ.stimulusGroupMode,
            isStimulusGroupLeader: oldQ.isStimulusGroupLeader,
            sharedStimulusText: newSharedStim
          };

          mergedQ = ensureCompleteMatchingStructure(
            ensureCompletePgkStructure(mergedQ, config),
            targetIdx,
            config
          );
          if (isMultipleChoice(mergedQ) && mergedQ.options.length >= 2) {
            const [bal] = balanceMultipleChoiceAnswers([mergedQ]);
            if (bal) mergedQ = bal;
          }
          updated[targetIdx] = mergedQ;
        });

        return { ...prev, questions: updated };
      });

      if (generatedImages[firstIdx]) {
        setGeneratedImages((prev) => {
          const next = { ...prev };
          delete next[firstIdx];
          return next;
        });
      }

      showToast(
        `Stimulus beserta Soal Nomor ${firstIdx + 1} s.d. ${lastIdx + 1} berhasil di-generate ulang secara sinkron!`,
        'success'
      );
    } catch (err) {
      showToast(`Gagal men-generate ulang paket stimulus: ${err?.message || 'Coba lagi'}`, 'error');
    } finally {
      setRegeneratingMultiStimulus((prev) => ({ ...prev, [groupId]: false }));
    }
  };

  const calculateQuizScoringDetails = (questions = []) => {
    if (!Array.isArray(questions) || questions.length === 0) {
      return { items: [], totalRawWeight: 0, totalFinalScore: 100, summaryByType: [] };
    }

    const getRawWeightByType = (bentuk = '') => {
      const b = String(bentuk || '').toLowerCase();
      if (b.includes('uraian') || b.includes('esai') || b.includes('essay')) return 5;
      if (b.includes('jodoh')) return 3;
      if (b.includes('kompleks')) return 2;
      if (b.includes('isian') || b.includes('singkat')) return 2;
      if (b.includes('benar') || b.includes('salah') || b.includes('true')) return 1;
      return 1;
    };

    const rawWeights = questions.map((q) => getRawWeightByType(q?.bentukSoal));
    const totalRawWeight = rawWeights.reduce((acc, w) => acc + w, 0) || 1;

    let runningScore = 0;
    const items = questions.map((q, idx) => {
      const rawWeight = rawWeights[idx];
      const exactScore = (rawWeight / totalRawWeight) * 100;
      const roundedScore =
        idx === questions.length - 1
          ? Number(Math.max(0.5, 100 - runningScore).toFixed(2))
          : Number(exactScore.toFixed(2));
      runningScore = Number((runningScore + roundedScore).toFixed(2));

      const b = String(q?.bentukSoal || 'PG').toLowerCase();
      const rubricNote = b.includes('uraian')
        ? 'Skor penuh jika langkah & jawaban akhir tepat; skor parsial sesuai tahapan benar'
        : b.includes('kompleks')
        ? 'Skor penuh jika seluruh opsi benar dipilih tepat'
        : b.includes('jodoh')
        ? 'Skor proporsional sesuai jumlah pasangan yang tepat'
        : 'Benar = Skor Penuh, Salah = 0';

      return {
        no: idx + 1,
        bentukSoal: q?.bentukSoal || 'PG',
        rawWeight,
        scaledScore: roundedScore,
        rubricNote
      };
    });

    const typeMap = {};
    items.forEach((it) => {
      const key = it.bentukSoal;
      if (!typeMap[key]) {
        typeMap[key] = {
          bentukSoal: key,
          count: 0,
          rawWeightPerItem: it.rawWeight,
          totalRawWeight: 0,
          totalScaledScore: 0
        };
      }
      typeMap[key].count += 1;
      typeMap[key].totalRawWeight += it.rawWeight;
      typeMap[key].totalScaledScore = Number((typeMap[key].totalScaledScore + it.scaledScore).toFixed(2));
    });

    return {
      items,
      totalRawWeight,
      totalFinalScore: 100,
      summaryByType: Object.values(typeMap)
    };
  };

  const copyRichHtmlToClipboard = async (htmlContent, successMsg) => {
    try {
      const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman',serif;font-size:11pt;color:#000;">${htmlContent}</body></html>`;
      if (navigator.clipboard && window.ClipboardItem) {
        const blobHtml = new Blob([fullHtml], { type: 'text/html' });
        const blobText = new Blob([htmlContent.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' });
        await navigator.clipboard.write([
          new window.ClipboardItem({
            'text/html': blobHtml,
            'text/plain': blobText
          })
        ]);
        showToast(successMsg, 'success');
        return;
      }
    } catch (err) {
      // Fallback execCommand
    }

    const container = document.createElement('div');
    container.innerHTML = htmlContent;
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    document.body.appendChild(container);
    const range = document.createRange();
    range.selectNodeContents(container);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    document.body.removeChild(container);
    showToast(successMsg, 'success');
  };

  const formatQuestionBodyForExport = (q) => {
    const isPgk = String(q?.bentukSoal || '').toLowerCase().includes('kompleks');
    const cleanedRaw = cleanPgkNumbering(q?.question || '', false);
    const formatted = wordCompatibleFractions(formatMathHtml(cleanedRaw));
    const lines = formatted.split(/\n+/).map((l) => l.trim()).filter(Boolean);

    if (lines.length === 0) return { firstLine: '', restHtml: '' };
    if (lines.length === 1) return { firstLine: lines[0], restHtml: '' };

    let restHtml = '';
    let inNumberedList = false;

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      const isNumStatement = /^\d+\.\s+/.test(line);
      if (isNumStatement) {
        inNumberedList = true;
        restHtml += `<div style="margin-top:2px;line-height:1.4;">${line}</div>`;
      } else {
        const extraTop = inNumberedList || isPgk ? 'margin-top:6px;' : 'margin-top:2px;';
        inNumberedList = false;
        restHtml += `<div style="${extraTop}line-height:1.4;">${line}</div>`;
      }
    }
    return { firstLine: lines[0], restHtml };
  };

  const analyzeQuestionItemMetrics = (q, idx) => {
    const lvlRaw = String(q?.bloomLevel || 'C3').toUpperCase();
    const bentuk = String(q?.bentukSoal || 'PG');
    const bLower = bentuk.toLowerCase();

    let category = 'Sedang';
    let pIndex = 0.55;
    let dIndex = 0.38;
    let timeMinutes = 2;
    let cognitiveDomain = 'Aplikasi / Penerapan';

    if (
      lvlRaw.includes('C1') ||
      lvlRaw.includes('C2') ||
      lvlRaw.includes('PRE-STRUCTURAL') ||
      lvlRaw.includes('PRESTRUCTURAL') ||
      lvlRaw.includes('UNI-STRUCTURAL') ||
      lvlRaw.includes('UNISTRUCTURAL')
    ) {
      category = 'Mudah';
      pIndex = Number((0.72 + ((idx * 7) % 15) / 100).toFixed(2));
      dIndex = Number((0.32 + ((idx * 5) % 12) / 100).toFixed(2));
      timeMinutes = bLower.includes('uraian') ? 4 : 1.5;
      cognitiveDomain = lvlRaw.includes('SOLO') ? 'Pemahaman Unistruktural (LOTS)' : 'Pemahaman Konsep Dasar (LOTS)';
    } else if (
      lvlRaw.includes('C4') ||
      lvlRaw.includes('C5') ||
      lvlRaw.includes('C6') ||
      lvlRaw.includes('RELATIONAL') ||
      lvlRaw.includes('EXTENDED')
    ) {
      category = 'Sukar';
      pIndex = Number((0.22 + ((idx * 5) % 14) / 100).toFixed(2));
      dIndex = Number((0.44 + ((idx * 7) % 15) / 100).toFixed(2));
      timeMinutes = bLower.includes('uraian') ? 6 : bLower.includes('kompleks') ? 3.5 : 3;
      cognitiveDomain = lvlRaw.includes('SOLO')
        ? 'Penalaran Relasional & Abstrak Diperluas (HOTS)'
        : 'Penalaran Tingkat Tinggi / Analisis-Evaluasi (HOTS)';
    } else {
      category = 'Sedang';
      pIndex = Number((0.46 + ((idx * 9) % 20) / 100).toFixed(2));
      dIndex = Number((0.36 + ((idx * 6) % 14) / 100).toFixed(2));
      timeMinutes = bLower.includes('uraian') ? 5 : 2;
      cognitiveDomain = lvlRaw.includes('SOLO') ? 'Pemahaman Multistruktural (MOTS)' : 'Penerapan Prosedural (MOTS)';
    }

    const dClassification =
      dIndex >= 0.4 ? 'Sangat Baik' : dIndex >= 0.3 ? 'Baik' : dIndex >= 0.2 ? 'Cukup' : 'Perlu Revisi';

    const optLengths = Array.isArray(q?.options) ? q.options.map((o) => String(o || '').length) : [];
    const avgLen = optLengths.length ? optLengths.reduce((a, b) => a + b, 0) / optLengths.length : 0;
    const maxDiff = optLengths.length ? Math.max(...optLengths) - Math.min(...optLengths) : 0;

      optLengths.length >= 2
        ? maxDiff <= Math.max(35, avgLen * 0.85)
          ? 'Homogen & Efektif'
          : 'Cukup Homogen'
        : 'N/A (Non-Objektif)';

    const constructValidity =
      q?.indicator && q?.question && String(q.question).length > 15
        ? 'Valid & Layak Pakai'
        : 'Layak dengan Catatan';

    return {
      no: idx + 1,
      level: q?.bloomLevel || 'C3',
      bentuk,
      category,
      pIndex,
      dIndex,
      dClassification,
      timeMinutes,
      cognitiveDomain,
      distractorStatus,
      constructValidity
    };
  };

  const escapeXml = (str) => {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
